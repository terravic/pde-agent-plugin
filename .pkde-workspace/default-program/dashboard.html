    function renderSvgChartFallback(container, traces, layout) {
      const theme = getThemeTokens();
      const trace = traces[0] || {};
      const title = (layout && layout.title && (layout.title.text || layout.title)) || '';
      const w = Math.max(container.clientWidth || 640, 480);
      const h = Math.max(parseInt(container.style.height, 10) || 340, 240);

      if (trace.type === 'scatterpolar') {
        const rArr = (trace.r || []).slice(0, -1);
        const tArr = (trace.theta || []).slice(0, -1);
        const markerColors = (trace.marker && Array.isArray(trace.marker.color)) ? trace.marker.color : null;
        const maxR = (layout.polar && layout.polar.radialaxis && layout.polar.radialaxis.range && layout.polar.radialaxis.range[1]) || 3.4;
        const cx = w / 2, cy = h / 2 + 10, rad = Math.min(w, h) * 0.34;
        const n = Math.max(rArr.length, 1);
        const pts = rArr.map((rv, i) => {
          const ang = -Math.PI / 2 + (2 * Math.PI * i) / n;
          const dist = Math.max(0, Math.min(1, rv / maxR)) * rad;
          const ptCol = (markerColors && markerColors[i]) || (rv >= 2.5 ? theme.emerald : (rv >= 1.8 ? theme.amber : theme.rose));
          return [cx + dist * Math.cos(ang), cy + dist * Math.sin(ang), tArr[i] || '', rv, ptCol];
        });
        const poly = pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
        const rings = [0.33, 0.66, 1.0].map(f => `<circle cx="${cx}" cy="${cy}" r="${(rad * f).toFixed(1)}" fill="none" stroke="${theme.border}" stroke-dasharray="3,3"/>`).join('');
        const axes = pts.map((p, i) => {
          const ang = -Math.PI / 2 + (2 * Math.PI * i) / n;
          const ex = cx + rad * Math.cos(ang), ey = cy + rad * Math.sin(ang);
          const lx = cx + (rad + 28) * Math.cos(ang), ly = cy + (rad + 18) * Math.sin(ang);
          return `<line x1="${cx}" y1="${cy}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${theme.border}"/>
                  <text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="${theme.textSecondary}">${escapeHtml(String(p[2]))}</text>`;
        }).join('');
        const dots = pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="5" fill="${p[4]}" stroke="${theme.surface}" stroke-width="1.5"><title>${escapeHtml(String(p[2]))}: ${p[3]}</title></circle>`).join('');
        container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;background:transparent;">
          <text x="${w / 2}" y="22" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="13" font-weight="600" fill="${theme.textPrimary}">${escapeHtml(String(title))}</text>
          ${rings}${axes}
          <polygon points="${poly}" fill="${theme.fillAlpha}" stroke="${theme.teal}" stroke-width="2"/>
          ${dots}
        </svg>`;
        return;
      }

      if (trace.type === 'heatmap') {
        const z = Array.isArray(trace.z) && Array.isArray(trace.z[0]) ? trace.z : [[0]];
        const rows = z.length, cols = Math.max((z[0] || []).length, 1);
        const padL = 70, padR = 30, padT = 38, padB = 45;
        const pw = w - padL - padR, ph = h - padT - padB;
        const cw = pw / cols, ch = ph / rows;
        const zmin = trace.zmin || 0;
        const zmax = trace.zmax || 31.75;
        const invertHot = Boolean(trace.invertHot);
        let cells = '';
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const val = Number((z[r] && z[r][c]) || 0);
            const ratio = Math.max(0, Math.min(1, (val - zmin) / Math.max(zmax - zmin, 0.001)));
            const cellColor = heatmapSampleColor(ratio, theme, invertHot);
            cells += `<rect x="${(padL + c * cw).toFixed(1)}" y="${(padT + r * ch).toFixed(1)}" width="${Math.max(cw + 0.4, 1).toFixed(1)}" height="${Math.max(ch + 0.4, 1).toFixed(1)}" fill="${cellColor}"><title>[${r + 1}, ${c + 1}]: ${val.toFixed(2)}</title></rect>`;
          }
        }
        container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;background:transparent;">
          <text x="${w / 2}" y="22" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="13" font-weight="600" fill="${theme.textPrimary}">${escapeHtml(String(title))}</text>
          ${cells}
          <rect x="${padL}" y="${padT}" width="${pw}" height="${ph}" fill="none" stroke="${theme.border}"/>
        </svg>`;
        return;
      }

      if (trace.type === 'bar') {
        const isHoriz = trace.orientation === 'h';
        const labels = (isHoriz ? trace.y : trace.x) || [];
        const rawVals = (isHoriz ? trace.x : trace.y) || [];
        const vals = rawVals.map(v => Number(v) || 0);
        const colors = (trace.marker && Array.isArray(trace.marker.color)) ? trace.marker.color : null;
        const baseColor = (trace.marker && typeof trace.marker.color === 'string') ? trace.marker.color : theme.teal;
        const padL = isHoriz ? 155 : 60, padR = 30, padT = 38, padB = 48;
        const pw = w - padL - padR, ph = h - padT - padB;
        const n = Math.max(vals.length, 1);
        const minV = Math.min(0, ...vals), maxV = Math.max(0.001, ...vals);
        const span = Math.max(Math.abs(maxV - minV), 1);

        if (isHoriz) {
          const bh = Math.max(6, (ph / n) * 0.7);
          const bars = vals.map((v, i) => {
            const y = padT + (i + 0.15) * (ph / n);
            const bw = Math.max(2, (Math.abs(v) / Math.max(Math.abs(maxV), Math.abs(minV), 1)) * pw);
            const col = colors ? (colors[i] || baseColor) : theme.palette[i % theme.palette.length];
            return `<rect x="${padL}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${col}" rx="2"/>
                    <text x="${padL - 6}" y="${(y + bh / 2).toFixed(1)}" text-anchor="end" dominant-baseline="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="${theme.textSecondary}">${escapeHtml(String(labels[i] || ''))}</text>
                    <text x="${(padL + bw + 5).toFixed(1)}" y="${(y + bh / 2).toFixed(1)}" dominant-baseline="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="${theme.textPrimary}" font-weight="600">${v.toFixed(2)}</text>`;
          }).join('');
          container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;background:transparent;">
            <text x="${w / 2}" y="22" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="13" font-weight="600" fill="${theme.textPrimary}">${escapeHtml(String(title))}</text>
            <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + ph}" stroke="${theme.border}"/>
            ${bars}
          </svg>`;
        } else {
          const bw = Math.max(10, (pw / n) * 0.62);
          const zeroY = maxV <= 0 ? padT : (minV >= 0 ? padT + ph : padT + (maxV / span) * ph);
          const bars = vals.map((v, i) => {
            const x = padL + (i + 0.19) * (pw / n);
            const bh = Math.max(2, (Math.abs(v) / Math.max(Math.abs(maxV), Math.abs(minV), 1)) * (ph * 0.85));
            const y = v >= 0 ? (zeroY - bh) : zeroY;
            const col = colors ? (colors[i] || baseColor) : theme.palette[i % theme.palette.length];
            return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${col}" rx="2"/>
                    <text x="${(x + bw / 2).toFixed(1)}" y="${padT + ph + 16}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="${theme.textSecondary}">${escapeHtml(String(labels[i] || '').slice(0, 14))}</text>
                    <text x="${(x + bw / 2).toFixed(1)}" y="${(v >= 0 ? y - 5 : y + bh + 12).toFixed(1)}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="${theme.textPrimary}" font-weight="600">${v.toFixed(1)}</text>`;
          }).join('');
          container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;background:transparent;">
            <text x="${w / 2}" y="22" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="13" font-weight="600" fill="${theme.textPrimary}">${escapeHtml(String(title))}</text>
            <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${padL + pw}" y2="${zeroY.toFixed(1)}" stroke="${theme.border}"/>
            ${bars}
          </svg>`;
        }
        return;
      }

      // Line / scatter fallback
      const padL = 55, padR = 25, padT = 38, padB = 42;
      const pw = w - padL - padR, ph = h - padT - padB;
      const allX = [], allY = [];
      traces.forEach(tr => {
        (tr.x || []).forEach(v => allX.push(Number(v) || 0));
        (tr.y || []).forEach(v => allY.push(Number(v) || 0));
      });
      const minX = Math.min(0, ...allX), maxX = Math.max(1, ...allX);
      const minY = (layout.yaxis && layout.yaxis.range) ? layout.yaxis.range[0] : Math.min(0, ...allY);
      const maxY = (layout.yaxis && layout.yaxis.range) ? layout.yaxis.range[1] : Math.max(100, ...allY);
      const paths = traces.map((tr, ti) => {
        const xs = tr.x || [], ys = tr.y || [];
        const col = (tr.line && tr.line.color) || theme.palette[ti % theme.palette.length];
        const pts = ys.map((yv, i) => {
          const xv = xs[i] !== undefined ? Number(xs[i]) : i + 1;
          const px = padL + ((xv - minX) / Math.max(maxX - minX, 1)) * pw;
          const py = padT + ph - ((Number(yv) - minY) / Math.max(maxY - minY, 1)) * ph;
          return `${px.toFixed(1)},${py.toFixed(1)}`;
        }).join(' ');
        return pts ? `<polyline fill="none" stroke="${col}" stroke-width="2" points="${pts}"/>` : '';
      }).join('');
      container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;background:transparent;">
        <text x="${w / 2}" y="22" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="13" font-weight="600" fill="${theme.textPrimary}">${escapeHtml(String(title))}</text>
        <rect x="${padL}" y="${padT}" width="${pw}" height="${ph}" fill="none" stroke="${theme.border}"/>
        ${paths}
      </svg>`;
    }

    /* --- Viewer 1: ADMET Radar & Table --- */
    function renderEmbeddedAdmet(box, data, ana) {
      const theme = getThemeTokens();
      const ENDPOINTS = ['metabolic_stability', 'cyp_inhibition', 'permeability', 'herg_liability', 'solubility'];
      const LABELS = {
        metabolic_stability: 'Metabolic Stability',
        cyp_inhibition: 'CYP Inhibition',
        permeability: 'Permeability',
        herg_liability: 'hERG Safety',
        solubility: 'Solubility'
      };
      const SCORE_MAP = { acceptable: 3, pass: 3, marginal: 2, flag: 2, unacceptable: 1, fail: 1 };

      const epSource = (ana && ana.metrics && ana.metrics.endpoint_results)
        || (data && data.metrics && data.metrics.endpoint_results)
        || (data && data.endpoint_results)
        || {};
      const preds = (data && data.predictions) || (ana && ana.metrics && ana.metrics.predictions) || {};
      const radarAxes = (data && data.radar_axes) || (ana && ana.metrics && ana.metrics.radar_axes) || {};

      function resolveEndpoint(e) {
        if (epSource[e] !== undefined) {
          const it = epSource[e];
          if (typeof it === 'object' && it !== null) {
            return {
              status: it.status || 'acceptable',
              score: SCORE_MAP[it.status] || (typeof it.score === 'number' ? it.score : 2.5),
              display: it.value !== undefined ? String(it.value) : '--'
            };
          }
          if (typeof it === 'number') {
            return { status: it >= 2.2 ? 'acceptable' : 'marginal', score: it, display: String(it) };
          }
        }
        if (e === 'metabolic_stability') {
          const v = preds.hlm_t12_min ?? preds.metabolic_stability;
          const ax = radarAxes.metabolic_stability;
          const st = (v !== undefined && v >= 30) ? 'acceptable' : (v !== undefined ? 'marginal' : 'acceptable');
          return {
            status: st,
            score: ax !== undefined ? ax * 3.0 : (SCORE_MAP[st] || 2.5),
            display: v !== undefined ? `${v} min` : (ax !== undefined ? `${(ax * 100).toFixed(0)}%` : '--')
          };
        }
        if (e === 'cyp_inhibition') {
          const v = preds.cyp3a4_ic50_um ?? preds.cyp_inhibition;
          const ax = radarAxes.cyp_safety ?? radarAxes.cyp_inhibition;
          const st = (v !== undefined && v >= 10) ? 'acceptable' : (v !== undefined ? 'marginal' : 'acceptable');
          return {
            status: st,
            score: ax !== undefined ? ax * 3.0 : (SCORE_MAP[st] || 2.5),
            display: v !== undefined ? `${v} uM` : (ax !== undefined ? `${(ax * 100).toFixed(0)}%` : '--')
          };
        }
        if (e === 'permeability') {
          const v = preds.caco2_papp_1e6 ?? preds.permeability;
          const ax = radarAxes.permeability;
          const st = (v !== undefined && v >= 5) ? 'acceptable' : (v !== undefined ? 'marginal' : 'acceptable');
          return {
            status: st,
            score: ax !== undefined ? ax * 3.0 : (SCORE_MAP[st] || 2.5),
            display: v !== undefined ? `${v} x 10-^6 cm/s` : (ax !== undefined ? `${(ax * 100).toFixed(0)}%` : '--')
          };
        }
        if (e === 'herg_liability') {
          const v = preds.herg_ic50_um ?? preds.herg_liability;
          const ax = radarAxes.herg_safety ?? radarAxes.herg_liability;
          const st = (v !== undefined && v >= 30) ? 'acceptable' : (v !== undefined && v >= 10 ? 'marginal' : 'acceptable');
          return {
            status: st,
            score: ax !== undefined ? ax * 3.0 : (SCORE_MAP[st] || 2.5),
            display: v !== undefined ? `${v} uM` : (ax !== undefined ? `${(ax * 100).toFixed(0)}%` : '--')
          };
        }
        if (e === 'solubility') {
          const v = preds.kinetic_solubility_um ?? preds.solubility;
          const ax = radarAxes.solubility;
          const st = (v !== undefined && v >= 50) ? 'acceptable' : (v !== undefined ? 'marginal' : 'acceptable');
          return {
            status: st,
            score: ax !== undefined ? ax * 3.0 : (SCORE_MAP[st] || 2.5),
            display: v !== undefined ? `${v} uM` : (ax !== undefined ? `${(ax * 100).toFixed(0)}%` : '--')
          };
        }
        return { status: 'acceptable', score: 2.5, display: '--' };
      }

      const resolved = ENDPOINTS.map(e => ({ key: e, label: LABELS[e], ...resolveEndpoint(e) }));
      if (preds.oral_bioavailability_pct !== undefined) {
        resolved.push({
          key: 'oral_f',
          label: 'Oral Bioavailability (%F)',
          status: preds.oral_bioavailability_pct >= 30 ? 'acceptable' : 'marginal',
          score: Math.min(3.0, (preds.oral_bioavailability_pct / 100) * 3.5),

      const plotDiv = document.createElement('div');
      plotDiv.style.height = '330px';
      const tblDiv = document.createElement('div');
      box.appendChild(plotDiv);
      box.appendChild(tblDiv);

      const radarItems = resolved.slice(0, 5);

      const rVals = radarItems.map(r => r.score);
      const vertexColors = radarItems.map(r =>

      );

      renderPlotWithFallback(plotDiv, [{
        type: 'scatterpolar',
        r: rVals.concat([rVals[0]]),
        theta: theta.concat([theta[0]]),
        fill: 'toself',
        fillcolor: theme.fillAlpha,
        line: { color: theme.teal, width: 2.2 },
        marker: { size: 8, color: vertexColors.concat([vertexColors[0]]) }
      }], {

        <tbody>

            <td>${escapeHtml(r.label)}</td>
            <td><strong>${escapeHtml(r.display)}</strong></td>
            <td>${renderCriticalStatusBadge(r.status) || '<span style="color:var(--text-secondary);">--</span>'}</td>
          </tr>`).join('')}
        </tbody>
      </table>`;
    }

    /* --- Viewer 2: Per-Residue pLDDT Confidence --- */
    function renderEmbeddedPlddt(box, data) {

      } else if (data && data.residue_plddt) {

        } else {

      renderPlotWithFallback(plotDiv, traces, {

      const entries = [];

          const rMatch = Array.isArray(ratios) ? ratios.find(r => r.off_target === ot.target || r.target === ot.target) : null;

          entries.push({
            target: ot.target || ot.name || 'Off-Target',
            ic50: ic,
            role: 'off_target',
            fold: fold,
            margin: (rMatch && (rMatch.margin_class || rMatch.classification)) || (fold >= 100 ? 'high (>100x)' : (fold >= 10 ? 'moderate (10-100x)' : 'narrow (<10x)'))

        if (entries.length > 0) {

            x: entries.map(e => e.target),
            y: entries.map(e => e.ic50),
            type: 'bar',
            marker: {
              color: entries.map(e =>

    /* --- 3D Structural Data Diagram Engine (3Dmol.js + Software 3D Fallback) --- */
    function canUseWebGL() {
      if (window.__FORCE_SOFTWARE_3D__) return false;
      if (typeof $3Dmol === 'undefined' || typeof $3Dmol.createViewer !== 'function') return false;
      try {
        const c = document.createElement('can' + 'vas');
        const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
        return !!(gl && typeof gl.getExtension === 'function');
      } catch (e) {
        return false;
      }
    }

    function parseStructureModelsToAtoms(models) {
      const theme = getThemeTokens();
      const atoms = [];
      const bonds = [];
      // 5-color palette mapped to CPK elements & roles
      const CPK_COLORS = {
        C: theme.teal,
        N: theme.indigo,
        O: theme.rose,
        S: theme.amber,
        P: theme.amber,
        F: theme.emerald,
        CL: theme.emerald,
        BR: theme.rose,
        H: theme.seriesMuted
      };

      (models || []).forEach((m, modelIdx) => {
        const raw = String(m.data || '');
        const fmt = (m.format || 'pdb').toLowerCase();
        const startIdx = atoms.length;

        if (fmt === 'sdf') {
          const lines = raw.split(/\r?\n/);
          let countsLineIdx = -1;
          for (let i = 0; i < Math.min(lines.length, 10); i++) {
            if (lines[i].includes('V2000') || lines[i].includes('V3000')) {
              countsLineIdx = i;
              break;
            }
          }
          if (countsLineIdx >= 0) {
            const parts = lines[countsLineIdx].trim().split(/\s+/);
            const nAtoms = parseInt(parts[0], 10) || 0;
            const nBonds = parseInt(parts[1], 10) || 0;
            for (let a = 0; a < nAtoms; a++) {
              const ln = lines[countsLineIdx + 1 + a] || '';
              const cols = ln.trim().split(/\s+/);
              if (cols.length >= 4) {
                const elem = (cols[3] || 'C').toUpperCase();
                atoms.push({
                  x: parseFloat(cols[0]) || 0,
                  y: parseFloat(cols[1]) || 0,
                  z: parseFloat(cols[2]) || 0,
                  elem: elem,
                  atomName: elem + (a + 1),
                  resn: m.label || 'LIG',
                  resi: 1,
                  b: 90,
                  modelIdx: modelIdx,
                  role: m.role || 'ligand',
                  color: elem === 'C' ? theme.indigo : (CPK_COLORS[elem] || theme.teal)
                });
              }
            }
            for (let b = 0; b < nBonds; b++) {
              const ln = lines[countsLineIdx + 1 + nAtoms + b] || '';
              const cols = ln.trim().split(/\s+/);
              if (cols.length >= 2) {
                const a1 = (parseInt(cols[0], 10) || 1) - 1 + startIdx;
                const a2 = (parseInt(cols[1], 10) || 1) - 1 + startIdx;
                const order = parseInt(cols[2], 10) || 1;
                if (atoms[a1] && atoms[a2]) bonds.push({ a1, a2, order, kind: 'covalent' });
              }
            }
          }
        } else if (fmt === 'cif') {
          const lines = raw.split(/\r?\n/);
          const headers = [];
          let inAtomLoop = false;
          lines.forEach(line => {
            const t = line.trim();
            if (t.startsWith('_atom_site.')) {
              inAtomLoop = true;
              headers.push(t.replace('_atom_site.', ''));
            } else if (inAtomLoop && (t.startsWith('ATOM ') || t.startsWith('HETATM '))) {
              const cols = t.split(/\s+/);
              const idxX = headers.indexOf('Cartn_x') >= 0 ? headers.indexOf('Cartn_x') : 7;
              const idxY = headers.indexOf('Cartn_y') >= 0 ? headers.indexOf('Cartn_y') : 8;
              const idxZ = headers.indexOf('Cartn_z') >= 0 ? headers.indexOf('Cartn_z') : 9;
              const idxElem = headers.indexOf('type_symbol') >= 0 ? headers.indexOf('type_symbol') : 2;
              const idxAtom = headers.indexOf('label_atom_id') >= 0 ? headers.indexOf('label_atom_id') : 3;
              const idxComp = headers.indexOf('label_comp_id') >= 0 ? headers.indexOf('label_comp_id') : 4;
              const idxSeq = headers.indexOf('label_seq_id') >= 0 ? headers.indexOf('label_seq_id') : 6;
              const idxB = headers.indexOf('B_iso_or_equiv') >= 0 ? headers.indexOf('B_iso_or_equiv') : 11;
              const elem = (cols[idxElem] || 'C').toUpperCase();
              const bVal = parseFloat(cols[idxB]) || 85;
              const plddtColor = bVal >= 90 ? theme.emerald : (bVal >= 70 ? theme.teal : (bVal >= 50 ? theme.amber : theme.rose));
              atoms.push({
                x: parseFloat(cols[idxX]) || 0,
                y: parseFloat(cols[idxY]) || 0,
                z: parseFloat(cols[idxZ]) || 0,
                elem: elem,
                atomName: cols[idxAtom] || elem,
                resn: cols[idxComp] || 'RES',
                resi: parseInt(cols[idxSeq], 10) || 1,
                b: bVal,
                modelIdx: modelIdx,
                role: m.role || 'receptor',
                color: elem === 'C' ? plddtColor : (CPK_COLORS[elem] || plddtColor)
              });
            }
          });
        } else {
          const lines = raw.split(/\r?\n/);
          let currentPose = 1;
          lines.forEach(line => {
            if (line.startsWith('MODEL')) {
              const mp = line.trim().split(/\s+/);
              currentPose = parseInt(mp[1], 10) || currentPose;
            }
            if ((line.startsWith('ATOM') || line.startsWith('HETATM')) && (currentPose === 1 || m.allPoses)) {
              const x = parseFloat(line.substring(30, 38));
              const y = parseFloat(line.substring(38, 46));
              const z = parseFloat(line.substring(46, 54));
              if (!isNaN(x) && !isNaN(y) && !isNaN(z)) {
                const atomName = line.substring(12, 16).trim() || 'C';
                const resn = line.substring(17, 20).trim() || 'RES';
                const resi = parseInt(line.substring(22, 26).trim(), 10) || 1;
                const bVal = parseFloat(line.substring(60, 66).trim()) || 80;
                const elemRaw = (line.substring(76, 78).trim() || atomName.replace(/[0-9]/g, '').slice(0, 1) || 'C').toUpperCase();
                const isLig = m.role === 'ligand' || resn === 'LIG' || resn === 'UNL';
                const plddtColor = bVal >= 90 ? theme.emerald : (bVal >= 70 ? theme.teal : (bVal >= 50 ? theme.amber : theme.rose));
                atoms.push({
                  x, y, z,
                  elem: elemRaw,
                  atomName,
                  resn,
                  resi,
                  b: bVal,
                  modelIdx,
                  role: isLig ? 'ligand' : 'receptor',
                  color: isLig
                    ? (elemRaw === 'C' ? theme.indigo : (CPK_COLORS[elemRaw] || theme.amber))
                    : (elemRaw === 'C' ? plddtColor : (CPK_COLORS[elemRaw] || theme.teal))
                });
              }
            }
          });
        }

        const endIdx = atoms.length;
        let prevCaIdx = -1;
        for (let i = startIdx; i < endIdx; i++) {
          if (atoms[i].atomName === 'CA') {
            if (prevCaIdx >= 0) {
              const dx = atoms[i].x - atoms[prevCaIdx].x;
              const dy = atoms[i].y - atoms[prevCaIdx].y;
              const dz = atoms[i].z - atoms[prevCaIdx].z;
              const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
              if (d <= 6.5) bonds.push({ a1: prevCaIdx, a2: i, order: 1, kind: 'backbone' });
            }
            prevCaIdx = i;
          }
          for (let j = i + 1; j < endIdx; j++) {
            const dx = atoms[i].x - atoms[j].x;
            const dy = atoms[i].y - atoms[j].y;
            const dz = atoms[i].z - atoms[j].z;
            const d2 = dx * dx + dy * dy + dz * dz;
            if (d2 > 0.16 && d2 <= 3.85) {
              bonds.push({ a1: i, a2: j, order: 1, kind: 'covalent' });
            }
          }
        }
      });

      return { atoms, bonds };
    }

    function renderSoftware3DMoleculeFallback(container, models, styleMode) {
      container.innerHTML = '';
      const parsed = parseStructureModelsToAtoms(models);
      const atoms = parsed.atoms;
      const bonds = parsed.bonds;

      if (atoms.length === 0) {
        container.innerHTML = '<div style="padding:18px;color:var(--text-secondary);">No 3D coordinates found.</div>';
        return null;
      }

      const surfEl = document.createElement('can' + 'vas');
      surfEl.style.width = '100%';
      surfEl.style.height = '100%';
      surfEl.style.display = 'block';
      surfEl.style.cursor = 'grab';
      container.appendChild(surfEl);

      let cx = 0, cy = 0, cz = 0;
      atoms.forEach(a => { cx += a.x; cy += a.y; cz += a.z; });
      cx /= atoms.length; cy /= atoms.length; cz /= atoms.length;
      let maxR = 1.0;
      atoms.forEach(a => {
        const d = Math.sqrt((a.x - cx) ** 2 + (a.y - cy) ** 2 + (a.z - cz) ** 2);
        if (d > maxR) maxR = d;
      });

      const state = {
        rotX: 0.35,
        rotY: -0.55,
        zoom: 1.0,
        style: styleMode || 'cartoon',
        dragging: false,
        lastX: 0,
        lastY: 0,
        hoverAtom: null
      };

      function project(a, w, h) {
        let x = a.x - cx, y = a.y - cy, z = a.z - cz;
        const cosY = Math.cos(state.rotY), sinY = Math.sin(state.rotY);
        const x1 = x * cosY + z * sinY;
        const z1 = -x * sinY + z * cosY;
        const cosX = Math.cos(state.rotX), sinX = Math.sin(state.rotX);
        const y2 = y * cosX - z1 * sinX;
        const z2 = y * sinX + z1 * cosX;

        const scale = (Math.min(w, h) * 0.38 * state.zoom) / Math.max(maxR, 2.5);
        const persp = 1 + (z2 / (maxR * 4.5));
        return {
          sx: w / 2 + x1 * scale * persp,
          sy: h / 2 - y2 * scale * persp,
          z: z2,
          scale: scale * persp
        };
      }

      function draw() {
        const theme = getThemeTokens();
        const rect = container.getBoundingClientRect();
        const w = Math.max(rect.width || 620, 360);
        const h = Math.max(rect.height || 430, 320);
        const dpr = window.devicePixelRatio || 1;
        if (surfEl.width !== Math.round(w * dpr) || surfEl.height !== Math.round(h * dpr)) {
          surfEl.width = Math.round(w * dpr);
          surfEl.height = Math.round(h * dpr);
        }
        const ctx = surfEl.getContext('2d');
        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.fillStyle = theme.surface;
        ctx.fillRect(0, 0, w, h);

        const proj = atoms.map(a => ({ atom: a, ...project(a, w, h) }));

        bonds.forEach(b => {
          const p1 = proj[b.a1], p2 = proj[b.a2];
          if (!p1 || !p2) return;
          if (b.kind === 'backbone' && state.style === 'stick') return;
          ctx.beginPath();
          ctx.moveTo(p1.sx, p1.sy);
          ctx.lineTo(p2.sx, p2.sy);
          if (b.kind === 'backbone') {
            ctx.strokeStyle = 'rgba(13, 148, 136, 0.78)';
            ctx.lineWidth = 3.8 * state.zoom;
          } else if (p1.atom.role === 'ligand' || p2.atom.role === 'ligand') {
            ctx.strokeStyle = 'rgba(79, 70, 229, 0.85)';
            ctx.lineWidth = (b.order > 1 ? 3.2 : 2.3) * state.zoom;
          } else {
            ctx.strokeStyle = 'rgba(13, 148, 136, 0.42)';
            ctx.lineWidth = 1.6 * state.zoom;
          }
          ctx.lineCap = 'round';
          ctx.stroke();
        });

        const sortedProj = proj.slice().sort((a, b) => a.z - b.z);
        sortedProj.forEach(p => {
          const a = p.atom;
          let rad = state.style === 'sphere' ? 8.0 : (a.role === 'ligand' ? 5.2 : (a.atomName === 'CA' ? 4.6 : 3.6));
          rad = Math.max(2.0, rad * state.zoom);

          ctx.beginPath();
          ctx.arc(p.sx, p.sy, rad, 0, Math.PI * 2);
          ctx.fillStyle = a.color;
          ctx.fill();
          ctx.lineWidth = 1;
          ctx.strokeStyle = theme.surface;
          ctx.stroke();

          if ((a.atomName === 'CA' || (a.role === 'receptor' && a.atomName === 'OD1')) && atoms.length <= 90) {
            ctx.font = '500 10px IBM Plex Mono, monospace';
            ctx.fillStyle = theme.textPrimary;
            ctx.fillText(`${a.resn}${a.resi}`, p.sx + rad + 3, p.sy + 3);
          }
        });

        ctx.font = '400 10.5px IBM Plex Mono, monospace';
        ctx.fillStyle = theme.textSecondary;
        ctx.fillText(`Structural Data Diagram (${atoms.length} atoms, ${bonds.length} bonds) -- Drag to rotate . Scroll to zoom`, 12, h - 12);

        if (state.hoverAtom) {
          const ha = state.hoverAtom;
          const label = `${ha.resn}${ha.resi} ${ha.atomName} (${ha.elem}) [${ha.x.toFixed(2)}, ${ha.y.toFixed(2)}, ${ha.z.toFixed(2)}]`;
          ctx.font = '500 11px IBM Plex Mono, monospace';
          const tw = ctx.measureText(label).width + 16;
          ctx.fillStyle = theme.bg;
          ctx.fillRect(12, 12, tw, 24);
          ctx.strokeStyle = theme.border;
          ctx.strokeRect(12, 12, tw, 24);
          ctx.fillStyle = theme.textPrimary;
          ctx.fillText(label, 20, 28);
        }
        ctx.restore();
      }

      surfEl.addEventListener('mousedown', e => {
        state.dragging = true;
        state.lastX = e.clientX;
        state.lastY = e.clientY;
        surfEl.style.cursor = 'grabbing';
      });
      window.addEventListener('mousemove', e => {
        if (state.dragging) {
          const dx = e.clientX - state.lastX;
          const dy = e.clientY - state.lastY;
          state.lastX = e.clientX;
          state.lastY = e.clientY;
          state.rotY += dx * 0.012;
          state.rotX += dy * 0.012;
          draw();
        }
      });
      window.addEventListener('mouseup', () => {
        state.dragging = false;
        surfEl.style.cursor = 'grab';
      });
      surfEl.addEventListener('mousemove', e => {
        if (state.dragging) return;
        const rect = surfEl.getBoundingClientRect();
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        const proj = atoms.map(a => ({ atom: a, ...project(a, rect.width, rect.height) }));
        let hit = null, bestD = 144;
        proj.forEach(p => {
          const d2 = (p.sx - mx) ** 2 + (p.sy - my) ** 2;
          if (d2 < bestD) { bestD = d2; hit = p.atom; }
        });
        if (hit !== state.hoverAtom) {
          state.hoverAtom = hit;
          draw();
        }
      });
      surfEl.addEventListener('wheel', e => {
        e.preventDefault();
        state.zoom = Math.max(0.4, Math.min(3.5, state.zoom * (e.deltaY < 0 ? 1.12 : 0.9)));
        draw();
      }, { passive: false });
      surfEl.addEventListener('dblclick', () => {
        state.rotX = 0.35;
        state.rotY = -0.55;
        state.zoom = 1.0;
        draw();
      });

      setTimeout(draw, 20);
      return {
        setStyleMode(mode) { state.style = mode; draw(); },
        render: draw
      };
    }

    /* --- Viewer 11: Structural Data Diagram (Protein 3D) --- */
    function renderEmbeddedStructure3D(box, ctrl, art) {
      const theme = getThemeTokens();
      if (ctrl) {
        ctrl.innerHTML = `
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
            <button class="mini-btn active" onclick="set3DStyle('cartoon')">Cartoon</button>
            <button class="mini-btn" onclick="set3DStyle('stick')">Stick</button>
            <button class="mini-btn" onclick="set3DStyle('sphere')">Sphere</button>
            <button class="mini-btn" onclick="toggle3DRenderEngine()">Renderer: ${window.__FORCE_SOFTWARE_3D__ ? 'Software 3D' : 'Auto'}</button>
          </div>
        `;
      }
      const mdiv = document.createElement('div');
      mdiv.className = 'mol3d-box';
      box.appendChild(mdiv);
      const fmt = art.name.toLowerCase().endsWith('.cif') ? 'cif' : 'pdb';
      const models = [{ data: String(art.data || ''), format: fmt, role: 'receptor' }];
      window.__ACTIVE_3D_MODELS__ = models;

      if (!canUseWebGL()) {
        window.__ACTIVE_3DMOL__ = null;
        window.__ACTIVE_SOFTWARE_3D__ = renderSoftware3DMoleculeFallback(mdiv, models, 'cartoon');
        return;
      }

      try {
        const viewer = $3Dmol.createViewer(mdiv, { backgroundColor: theme.surface });
        viewer.addModel(String(art.data || ''), fmt);
        // palette mapped to pLDDT confidence
        const plddtColorFunc = function(atom) {
          const b = atom.b || 0;
          return b >= 90 ? 0x059669 : (b >= 70 ? 0x0D9488 : (b >= 50 ? 0xD97706 : 0xE11D48));
        };
        viewer.setStyle({}, {
          cartoon: { colorfunc: plddtColorFunc },
          stick: { radius: 0.14, colorfunc: plddtColorFunc },
          sphere: { scale: 0.24, colorfunc: plddtColorFunc }
        });
        viewer.zoomTo();
        viewer.render();
        window.__ACTIVE_3DMOL__ = viewer;
        window.__ACTIVE_SOFTWARE_3D__ = null;
      } catch (e) {
        window.__ACTIVE_3DMOL__ = null;
        window.__ACTIVE_SOFTWARE_3D__ = renderSoftware3DMoleculeFallback(mdiv, models, 'cartoon');
      }
    }

    function set3DStyle(styleName) {
      if (window.__ACTIVE_SOFTWARE_3D__) {
        window.__ACTIVE_SOFTWARE_3D__.setStyleMode(styleName);
        return;
      }
      const v = window.__ACTIVE_3DMOL__;
      if (!v) return;
      const plddtColorFunc = function(atom) {
        const b = atom.b || 0;
        return b >= 90 ? 0x059669 : (b >= 70 ? 0x0D9488 : (b >= 50 ? 0xD97706 : 0xE11D48));
      };
      if (styleName === 'cartoon') {
        v.setStyle({}, {
          cartoon: { colorfunc: plddtColorFunc },
          stick: { radius: 0.12, colorfunc: plddtColorFunc },
          sphere: { scale: 0.22, colorfunc: plddtColorFunc }
        });
      } else {
        const spec = {};
        spec[styleName] = { colorfunc: plddtColorFunc };
        v.setStyle({}, spec);
      }
      v.render();
    }

    function toggle3DRenderEngine() {
      window.__FORCE_SOFTWARE_3D__ = !window.__FORCE_SOFTWARE_3D__;
      if (window.__ACTIVE_STUDIO_ART__) {
        mountEmbeddedViewer(window.__ACTIVE_STUDIO_ART__);
      }
    }

    /* --- Viewer 12: Structural Data Diagram (Docking Poses 3D) --- */
    function renderEmbeddedDocking3D(box, ctrl, art) {
      const theme = getThemeTokens();
      if (ctrl) {
        ctrl.innerHTML = `
          <div style="display:flex;gap:6px;align-items:center;">
            <button class="mini-btn" onclick="toggle3DRenderEngine()">Renderer: ${window.__FORCE_SOFTWARE_3D__ ? 'Software 3D' : 'Auto'}</button>
          </div>
        `;
      }
      const mdiv = document.createElement('div');
      mdiv.className = 'mol3d-box';
      box.appendChild(mdiv);

      const pairedRec = art.paired_files && art.paired_files.receptor ? getArtifactById(art.paired_files.receptor) : null;
      const pairedPoses = art.paired_files && art.paired_files.poses ? getArtifactById(art.paired_files.poses) : null;

      const models = [];
      if (art.name.endsWith('.receptor.pdbqt')) {
        models.push({ data: String(art.data || ''), format: 'pdbqt', role: 'receptor' });
        if (pairedPoses && pairedPoses.data) {
          models.push({ data: String(pairedPoses.data), format: 'pdbqt', role: 'ligand' });
        }
      } else {
        if (pairedRec && pairedRec.data) {
          models.push({ data: String(pairedRec.data), format: 'pdbqt', role: 'receptor' });
        }
        models.push({ data: String(art.data || ''), format: 'pdbqt', role: 'ligand' });
      }
      window.__ACTIVE_3D_MODELS__ = models;

      if (!canUseWebGL()) {
        window.__ACTIVE_3DMOL__ = null;
        window.__ACTIVE_SOFTWARE_3D__ = renderSoftware3DMoleculeFallback(mdiv, models, 'stick');
        return;
      }

      try {
        const viewer = $3Dmol.createViewer(mdiv, { backgroundColor: theme.surface });
        const recStyle = {
          cartoon: { color: theme.teal, opacity: 0.78 },
          stick: { radius: 0.14, color: theme.teal }
        };
        const ligStyle = {
          stick: { radius: 0.22, color: theme.indigo },
          sphere: { scale: 0.28, color: theme.amber }
        };

        if (art.name.endsWith('.receptor.pdbqt')) {
          viewer.addModel(String(art.data || ''), 'pdbqt');
          viewer.setStyle({ model: 0 }, recStyle);
          if (pairedPoses && pairedPoses.data) {
            viewer.addModel(String(pairedPoses.data), 'pdbqt');
            viewer.setStyle({ model: 1 }, ligStyle);
          }
        } else {
          if (pairedRec && pairedRec.data) {
            viewer.addModel(String(pairedRec.data), 'pdbqt');
            viewer.setStyle({ model: 0 }, recStyle);
          }
          viewer.addModel(String(art.data || ''), 'pdbqt');
          viewer.setStyle({ model: pairedRec ? 1 : 0 }, ligStyle);
        }
        viewer.zoomTo();
        viewer.render();
        window.__ACTIVE_3DMOL__ = viewer;
        window.__ACTIVE_SOFTWARE_3D__ = null;
      } catch (e) {
        window.__ACTIVE_3DMOL__ = null;
        window.__ACTIVE_SOFTWARE_3D__ = renderSoftware3DMoleculeFallback(mdiv, models, 'stick');
      }
    }

    /* --- Viewer 13: Structural Data Diagram (3D SDF Conformer) --- */
    function renderEmbeddedSdf3D(box, ctrl, art) {
      const theme = getThemeTokens();
      if (ctrl) {
        ctrl.innerHTML = `
          <div style="display:flex;gap:6px;align-items:center;">
            <button class="mini-btn" onclick="toggle3DRenderEngine()">Renderer: ${window.__FORCE_SOFTWARE_3D__ ? 'Software 3D' : 'Auto'}</button>
          </div>
        `;
      }
      const mdiv = document.createElement('div');
      mdiv.className = 'mol3d-box';
      box.appendChild(mdiv);
      const models = [{ data: String(art.data || ''), format: 'sdf', role: 'ligand', label: art.name.replace(/\.3d\.sdf$/i, '') }];
      window.__ACTIVE_3D_MODELS__ = models;

      if (!canUseWebGL()) {
        window.__ACTIVE_3DMOL__ = null;
        window.__ACTIVE_SOFTWARE_3D__ = renderSoftware3DMoleculeFallback(mdiv, models, 'stick');
        return;
      }

      try {
        const viewer = $3Dmol.createViewer(mdiv, { backgroundColor: theme.surface });
        viewer.addModel(String(art.data || ''), 'sdf');
        const cpkColorFunc = function(atom) {
          const el = String(atom.elem || 'C').toUpperCase();
          if (el === 'O') return 0xE11D48;
          if (el === 'N') return 0x4F46E5;
          if (el === 'S' || el === 'P') return 0xD97706;
          if (el === 'F' || el === 'CL') return 0x059669;
          return 0x0D9488;
        };
        viewer.setStyle({}, { stick: { radius: 0.16, colorfunc: cpkColorFunc }, sphere: { scale: 0.28, colorfunc: cpkColorFunc } });
        viewer.zoomTo();
        viewer.render();
        window.__ACTIVE_3DMOL__ = viewer;
        window.__ACTIVE_SOFTWARE_3D__ = null;
      } catch (e) {
        window.__ACTIVE_3DMOL__ = null;
        window.__ACTIVE_SOFTWARE_3D__ = renderSoftware3DMoleculeFallback(mdiv, models, 'stick');
      }
    }

    /* --- Viewer 14: Generic JSON Tree Viewer --- */
    function renderEmbeddedJsonTree(box, data) {
      const pre = document.createElement('pre');
      pre.className = 'mono';
      pre.style.margin = '0';
      pre.style.fontSize = '11.5px';
      pre.style.color = 'var(--text-primary)';
      pre.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
      box.appendChild(pre);
    }

    /* =========================================================================
     * 4. LIVE TELEMETRY CONSOLE, DEEP-NAVIGATION, DIFFERENTIAL DOM & SSE STREAM
     * ========================================================================= */
    let currentWorkspaceMode = 'split';
    let currentTeleCategory = 'all';
    let currentTeleSearch = '';
    let telePaused = false;
    let telePendingCount = 0;
    let unreadDiscoveryCount = 0;
    let unreadTelemetryCount = 0;
    let deferredGraphRender = false;
    window.__PKDE_PREV_SIGS__ = {};

    function _updateBadge(id, count) {
      const el = document.getElementById(id);
      if (!el) return;
      if (count > 0) {
        el.textContent = count > 99 ? '99+' : `+${count}`;
        el.classList.add('visible');
      } else {
        el.textContent = '0';
        el.classList.remove('visible');
      }
    }

    function setWorkspaceMode(mode) {
      currentWorkspaceMode = mode;
      document.body.setAttribute('data-mode', mode);
      const ws = document.getElementById('main-workspace');
      ws.classList.remove('mode-agentic', 'mode-science', 'mode-telemetry');
      if (mode === 'agentic') ws.classList.add('mode-agentic');
      if (mode === 'science') ws.classList.add('mode-science');
      if (mode === 'telemetry') ws.classList.add('mode-telemetry');

      if (mode === 'science' || mode === 'split') {
        unreadDiscoveryCount = 0;
        _updateBadge('badge-discovery-new', 0);
      }
      if (mode === 'telemetry') {
        unreadTelemetryCount = 0;
        _updateBadge('badge-telemetry-new', 0);
        renderTelemetryFullView();
      }

      document.querySelectorAll('.mode-btn').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-mode') === mode);
      });
      setTimeout(() => {
        if (mode === 'split' || mode === 'agentic') fitGraphToScreen();
        if ((mode === 'split' || mode === 'science') && window.__ACTIVE_STUDIO_ART__) {
          const studioEl = document.getElementById('scitab-studio');
          if (studioEl && studioEl.style.display !== 'none') {
            window.dispatchEvent(new Event('resize'));
          }
        }
        window.dispatchEvent(new Event('resize'));
      }, 50);
    }

    function setTelemetryDrawerState(state) {
      const drawer = document.getElementById('telemetry-drawer');
      if (!drawer) return;
      drawer.setAttribute('data-drawer-state', state);
      const btnTicker = document.getElementById('btn-tele-ticker');
      const btnConsole = document.getElementById('btn-tele-console');
      if (btnTicker) btnTicker.classList.toggle('active', state === 'ticker');
      if (btnConsole) btnConsole.classList.toggle('active', state === 'console');
      if (state === 'console') {
        unreadTelemetryCount = 0;
        _updateBadge('badge-telemetry-new', 0);
      }
      setTimeout(() => window.dispatchEvent(new Event('resize')), 170);
    }

    function setTelemetryFilter(cat) {
      currentTeleCategory = cat;
      renderTelemetryConsole(true);
      renderTelemetryFullView(true);
    }

    function setTelemetrySearch(q) {
      currentTeleSearch = String(q || '').trim().toLowerCase();
      const s1 = document.getElementById('tele-drawer-search');
      const s2 = document.getElementById('tele-full-search');
      if (s1 && s1.value !== q) s1.value = q;
      if (s2 && s2.value !== q) s2.value = q;
      renderTelemetryConsole(true);
      renderTelemetryFullView(true);
    }

    function _setTelePausedState(paused) {
      telePaused = Boolean(paused);
      const p1 = document.getElementById('tele-drawer-pause-pill');
      const p2 = document.getElementById('tele-full-pause-pill');
      const label = telePendingCount > 0
        ? `PAUSED (${telePendingCount} new)`
        : 'PAUSED';
      [p1, p2].forEach(el => {
        if (!el) return;
        el.textContent = label;
        el.classList.toggle('visible', telePaused);
      });
    }

    function resumeTelemetryStream() {
      telePaused = false;
      telePendingCount = 0;
      _setTelePausedState(false);
      renderTelemetryConsole(true);
      renderTelemetryFullView(true);
      ['tele-drawer-stream', 'tele-full-stream'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.scrollTop = el.scrollHeight;
      });
    }

    function _teleTagClass(tag, level) {
      const t = String(tag || '').toUpperCase();
      if (level === 'error' || t.includes('ERR')) return 'tag-error';
      return '';
    }

    function _formatTeleTime(ts) {
      const s = String(ts || '');
      const m = s.match(/T(\d{2}:\d{2}:\d{2})/);
      if (m) return m[1];
      if (s.length >= 8) return s.slice(-8);
      return '--:--:--';
    }

    function _matchesTeleFilter(m) {
      if (currentTeleCategory && currentTeleCategory !== 'all') {
        const cat = String(m.category || 'agent').toLowerCase();
        if (currentTeleCategory === 'agents' && !['prompt', 'agent', 'comm'].includes(cat)) return false;
        if (currentTeleCategory === 'tools' && cat !== 'tool') return false;
        if (currentTeleCategory === 'findings' && cat !== 'finding') return false;
        if (currentTeleCategory === 'gates' && !['gate', 'lease'].includes(cat)) return false;
      }
      if (currentTeleSearch) {
        const hay = `${m.tag || ''} ${m.sender || ''} ${m.recipient || ''} ${m.summary || ''} ${m.work_order_id || ''}`.toLowerCase();
        if (!hay.includes(currentTeleSearch)) return false;
      }
      return true;
    }

    function _buildTeleFiltersHtml(messages) {
      const counts = {
        all: messages.length,
        agents: messages.filter(m => ['prompt', 'agent', 'comm'].includes(m.category)).length,
        tools: messages.filter(m => m.category === 'tool').length,
        findings: messages.filter(m => m.category === 'finding').length,
        gates: messages.filter(m => ['gate', 'lease'].includes(m.category)).length
      };
      const items = [
        { id: 'all', label: `All (${counts.all})` },
        { id: 'agents', label: `Agents (${counts.agents})` },
        { id: 'tools', label: `Tools (${counts.tools})` },
        { id: 'findings', label: `Findings (${counts.findings})` },
        { id: 'gates', label: `Gates (${counts.gates})` }
      ];
      return items.map(it =>
        `<button class="mini-btn ${currentTeleCategory === it.id ? 'active' : ''}" onclick="setTelemetryFilter('${it.id}')">${escapeHtml(it.label)}</button>`
      ).join('');
    }

    function _buildTeleRowsHtml(filtered) {
      if (filtered.length === 0) {
        return `<div style="color:var(--text-secondary);padding:8px 14px;">No matching events.</div>`;
      }
      return filtered.map(m => {
        const tag = m.tag || 'AGENT';
        const tagCls = _teleTagClass(tag, m.level);
        const lvlCls = m.level ? `level-${escapeHtml(m.level)}` : '';
        const timeStr = _formatTeleTime(m.timestamp);
        const actLabel = m.action_label || 'Inspect';
        return `
          <div class="tele-row ${lvlCls}" onclick="navigateTelemetryEvent('${escapeHtml(m.id || '')}')">
            <span class="tele-time">${escapeHtml(timeStr)}</span>
            <span class="tele-tag ${tagCls}">${escapeHtml(tag)}</span>
            <span class="tele-route">${escapeHtml(m.sender || 'system')} -&gt; ${escapeHtml(m.recipient || 'pkde')}</span>
            <span class="tele-summary">${escapeHtml(m.summary || '')}</span>
            <span class="tele-action">${escapeHtml(actLabel)}</span>
          </div>
        `;
      }).join('');
    }

    function renderTelemetryConsole(forceRender) {
      const bundle = window.__PKDE_BUNDLE__ || {};
      const messages = (bundle.agent_system && bundle.agent_system.messages) || [];
      const countEl = document.getElementById('tele-drawer-count');
      if (countEl) countEl.textContent = String(messages.length);

      const tickerEl = document.getElementById('tele-ticker-preview');
      if (tickerEl) {
        if (messages.length > 0) {
          const latest = messages[messages.length - 1];
          tickerEl.innerHTML = `<span class="tele-tag ${_teleTagClass(latest.tag, latest.level)}" style="margin-right:6px;">${escapeHtml(latest.tag || 'EVENT')}</span><strong>${escapeHtml(latest.sender)} -&gt; ${escapeHtml(latest.recipient)}:</strong> ${escapeHtml(latest.summary)}`;
          tickerEl.onclick = () => navigateTelemetryEvent(latest.id || '');
        } else {
          tickerEl.textContent = 'No events recorded.';
        }
      }

      const filtersEl = document.getElementById('tele-drawer-filters');
      if (filtersEl) filtersEl.innerHTML = _buildTeleFiltersHtml(messages);

      if (telePaused && !forceRender) {
        telePendingCount += 1;
        _setTelePausedState(true);
        return;
      }

      const streamEl = document.getElementById('tele-drawer-stream');
      if (!streamEl) return;
      const wasAtBottom = (streamEl.scrollHeight - streamEl.scrollTop - streamEl.clientHeight) < 36;
      const filtered = messages.filter(_matchesTeleFilter);
      streamEl.innerHTML = _buildTeleRowsHtml(filtered);
      if (wasAtBottom || forceRender) {
        streamEl.scrollTop = streamEl.scrollHeight;
      }
    }

    function renderTelemetryFullView(forceRender) {
      const bundle = window.__PKDE_BUNDLE__ || {};
      const messages = (bundle.agent_system && bundle.agent_system.messages) || [];
      const nodes = (bundle.agent_system && bundle.agent_system.nodes) || [];
      const findings = (bundle.science && bundle.science.findings) || [];
      const artifacts = (bundle.science && bundle.science.artifacts) || [];

      const countEl = document.getElementById('tele-full-count');
      if (countEl) countEl.textContent = `(${messages.length})`;

      const filtersEl = document.getElementById('tele-full-filters');
      if (filtersEl) filtersEl.innerHTML = _buildTeleFiltersHtml(messages);

      if (!telePaused || forceRender) {
        const streamEl = document.getElementById('tele-full-stream');
        if (streamEl) {
          const wasAtBottom = (streamEl.scrollHeight - streamEl.scrollTop - streamEl.clientHeight) < 40;
          const filtered = messages.filter(_matchesTeleFilter);
          streamEl.innerHTML = _buildTeleRowsHtml(filtered);
          if (wasAtBottom || forceRender) {
            streamEl.scrollTop = streamEl.scrollHeight;
          }
        }
      }

      const boardEl = document.getElementById('tele-full-board');
      if (!boardEl) return;

      const activeAgentsHtml = nodes.map(n => `
        <div class="check-row" style="cursor:pointer;" onclick="setWorkspaceMode('split'); selectAgentNode('${escapeHtml(n.id)}');">
          <div>
            <strong style="color:var(--text-primary);">${escapeHtml(n.name)}</strong>
            <div style="font-size:10px;color:var(--text-secondary);">${escapeHtml(n.work_order_id ? n.work_order_id + '-r' + (n.revision || 1) : n.role)}</div>
          </div>
          ${renderCriticalStatusBadge(n.state)}
        </div>
      `).join('');

      const recentFindingsHtml = findings.length === 0
        ? `<div style="color:var(--text-secondary);font-size:11.5px;">No findings recorded.</div>`
        : findings.slice().reverse().slice(0, 6).map(f => `
          <div class="check-row" style="cursor:pointer;" onclick="setWorkspaceMode('split'); openFindingByPath('${escapeHtml(f.source_path)}');">
            <div>
              <strong>${escapeHtml(f.title)}</strong>
              <div style="font-size:10px;color:var(--text-secondary);">${escapeHtml(f.source_path)}</div>
            </div>
            ${renderCriticalStatusBadge(f.state)}
          </div>
        `).join('');

      const recentArtifactsHtml = artifacts.length === 0
        ? `<div style="color:var(--text-secondary);font-size:11.5px;">No artifacts recorded.</div>`
        : artifacts.slice().reverse().slice(0, 8).map(a => `
          <div class="check-row" style="cursor:pointer;" onclick="setWorkspaceMode('split'); openArtifactByPath('${escapeHtml(a.rel_path)}');">
            <div>
              <strong>${escapeHtml(a.name)}</strong>
              <div style="font-size:10px;color:var(--text-secondary);">${escapeHtml(a.artifact_class)} . ${escapeHtml(a.domain_studio || a.viewer_type)}</div>
            </div>
            ${renderCriticalStatusBadge(a.verdict)}
          </div>
        `).join('');

      boardEl.innerHTML = `
        <div class="tele-board-card">
          <h3><span>Agent Lanes (${nodes.length})</span></h3>
          ${activeAgentsHtml}
        </div>
        <div class="tele-board-card">
          <h3><span>Findings (${findings.length})</span></h3>
          ${recentFindingsHtml}
        </div>
        <div class="tele-board-card">
          <h3><span>Artifacts (${artifacts.length})</span></h3>
          ${recentArtifactsHtml}
        </div>
      `;
    }

    function _flashElement(el) {
      if (!el) return;
      el.classList.remove('tele-highlight-flash');
      void el.offsetWidth;
      el.classList.add('tele-highlight-flash');
    }

    function _resetOuterScrollLocks() {
      if (typeof window.scrollTo === 'function') window.scrollTo(0, 0);
      if (document.documentElement) document.documentElement.scrollTop = 0;
      if (document.body) document.body.scrollTop = 0;
      const ws = document.getElementById('main-workspace');
      if (ws) ws.scrollTop = 0;
    }

    function _scrollWithinContainer(containerEl, targetEl, alignCenter) {
      _resetOuterScrollLocks();
      if (!containerEl) return;
      if (!targetEl || targetEl === containerEl) {
        containerEl.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      const cRect = containerEl.getBoundingClientRect();
      const tRect = targetEl.getBoundingClientRect();
      let desiredTop = containerEl.scrollTop + (tRect.top - cRect.top) - 12;
      if (alignCenter) {
        desiredTop = containerEl.scrollTop + (tRect.top - cRect.top) - Math.max(12, (cRect.height - tRect.height) / 2);
      }
      containerEl.scrollTo({ top: Math.max(0, desiredTop), behavior: 'smooth' });
    }

    function navigateTelemetryEvent(evId) {
      const bundle = window.__PKDE_BUNDLE__ || {};
      const messages = (bundle.agent_system && bundle.agent_system.messages) || [];
      const ev = messages.find(m => m.id === evId) || messages[messages.length - 1];
      if (!ev) return;

      const kind = ev.target_kind || 'agent';
      const tid = String(ev.target_id || '');
      const tag = String(ev.tag || '').toUpperCase();

      if (kind === 'agent') {
        if (currentWorkspaceMode === 'science' || currentWorkspaceMode === 'telemetry') {
          setWorkspaceMode('split');
        }
        selectAgentNode(tid || 'science-program-lead');
        _resetOuterScrollLocks();
        _flashElement(document.getElementById('dock-inspector'));
      } else if (kind === 'finding') {
        if (currentWorkspaceMode === 'agentic' || currentWorkspaceMode === 'telemetry') {
          setWorkspaceMode('split');
        }
        openFindingByPath(tid);
        _resetOuterScrollLocks();
        _flashElement(document.getElementById('finding-reader-box'));
      } else if (kind === 'artifact') {
        if (currentWorkspaceMode === 'agentic' || currentWorkspaceMode === 'telemetry') {
          setWorkspaceMode('split');
        }
        openArtifactByPath(tid);
        _resetOuterScrollLocks();
        _flashElement(document.getElementById('active-viewer-box'));
      } else if (kind === 'relay') {
        if (currentWorkspaceMode === 'agentic' || currentWorkspaceMode === 'telemetry') {
          setWorkspaceMode('split');
        }
        switchSciTab('overview');
        const overviewPane = document.getElementById('scitab-overview');
        const relayCard = document.getElementById('overview-relays-card');
        _scrollWithinContainer(overviewPane, relayCard, true);
        _flashElement(relayCard || overviewPane);
      } else {
        if (currentWorkspaceMode === 'agentic' || currentWorkspaceMode === 'telemetry') {
          setWorkspaceMode('split');
        }
        switchSciTab('overview');
        const overviewPane = document.getElementById('scitab-overview');
        let targetCard = document.getElementById('overview-prompt-card');
        if (tid.startsWith('program-state/') || tag === 'STATE') {
          targetCard = document.getElementById('overview-pstate-card') || targetCard;
        } else if (tid.startsWith('executive/') || tag === 'EXEC') {
          targetCard = document.getElementById('overview-exec-card') || targetCard;
        }
        _scrollWithinContainer(overviewPane, targetCard, false);
        _flashElement(targetCard || overviewPane);
      }
    }

    function switchDockTab(tab) {
      ['inspector', 'messages', 'roles', 'retros'].forEach(t => {
        const el = document.getElementById('dock-' + t);
        if (el) el.style.display = (t === tab) ? 'block' : 'none';
      });
      document.querySelectorAll('.subtab-btn').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-dock') === tab);
      });
    }

    function switchSciTab(tab) {
      ['overview', 'findings', 'studio'].forEach(t => {
        document.getElementById('scitab-' + t).style.display = (t === tab) ? 'block' : 'none';
      });
      document.querySelectorAll('.sci-tab').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-scitab') === tab);
      });
      if (tab === 'studio' && window.__ACTIVE_STUDIO_ART__) {
        const box = document.getElementById('active-viewer-box');
        if (box && box.children.length === 0) {
          mountEmbeddedViewer(window.__ACTIVE_STUDIO_ART__);
        } else {
          window.dispatchEvent(new Event('resize'));
        }
      }
    }

    let currentThemeMode = 'dark';

    function resolveSystemTheme() {
      try {
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          return 'dark';
        }
        const env = (window.__PKDE_BUNDLE__ && window.__PKDE_BUNDLE__.agent_system && window.__PKDE_BUNDLE__.agent_system.environment) || {};
        if (env.system_theme === 'dark' || env.system_theme === 'light') {
          return env.system_theme;
        }
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          return 'light';
        }
      } catch (_e) {}
      return 'dark';
    }

    function setThemeMode(mode, skipRender) {
      const validMode = ['light', 'dark', 'system'].includes(mode) ? mode : 'dark';
      currentThemeMode = validMode;
      const html = document.documentElement;
      const prevTheme = html.getAttribute('data-theme');
      const effective = validMode === 'system' ? resolveSystemTheme() : validMode;
      html.setAttribute('data-theme-mode', validMode);
      html.setAttribute('data-theme', effective);
      ['light', 'dark', 'system'].forEach(m => {
        const btn = document.getElementById('theme-btn-' + m);
        if (btn) {
          const isActive = m === validMode;
          btn.classList.toggle('active', isActive);
          btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        }
      });
      try {
        window.localStorage.setItem('pkde-theme-mode', validMode);
      } catch (_e) {}
      if (!skipRender && prevTheme !== effective) {
        renderAgentGraph();
        if (window.__ACTIVE_STUDIO_ART__) {
          mountEmbeddedViewer(window.__ACTIVE_STUDIO_ART__);
        }
      }
    }

    function toggleTheme() {
      const order = ['light', 'dark', 'system'];
      const idx = order.indexOf(currentThemeMode);
      const next = order[(idx + 1) % order.length];
      setThemeMode(next);
    }

    function renderMathIn(el) {
      if (typeof renderMathInElement === 'function' && el) {
        try {
          renderMathInElement(el, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false }
            ],
            throwOnError: false
          });
        } catch (_e) {}
      }
    }

    function refreshAllFromBundle(isLiveUpdate) {
      const bundle = window.__PKDE_BUNDLE__;
      if (!bundle) return;
      const prog = bundle.program || {};
      const m = prog.summary_metrics || {};
      const sigs = window.__PKDE_PREV_SIGS__;

      document.getElementById('hdr-program-name').textContent = prog.name || 'PkDE Program';
      document.getElementById('hdr-stage').textContent = prog.stage || 'Stage 0-1';
      document.getElementById('kpi-agents').textContent = `${m.n_agents || 0} / ${m.n_work_orders || 0}`;
      document.getElementById('kpi-validation').textContent = `${m.validation_pass_rate ?? 100}%`;
      document.getElementById('kpi-artifacts').textContent = String(m.n_artifacts || 0);
      document.getElementById('kpi-findings').textContent = String(m.n_findings || 0);
      document.getElementById('kpi-relays').textContent = `${m.n_relays_addressed || 0} / ${m.n_relays || 0}`;

      const nodes = (bundle.agent_system && bundle.agent_system.nodes) || [];
      const leases = (bundle.agent_system && bundle.agent_system.leases) || [];
      const messages = (bundle.agent_system && bundle.agent_system.messages) || [];
      const retros = (bundle.agent_system && bundle.agent_system.retrospectives) || [];
      const sci = bundle.science || {};
      const findings = sci.findings || [];
      const artifacts = sci.artifacts || [];

      const nodesSig = JSON.stringify(nodes.map(n => [n.id, n.state, n.parentId, n.validation && n.validation.result, n.correction_cycle])) + JSON.stringify(leases);
      if (!isLiveUpdate || sigs.nodes !== nodesSig) {
        const prevNodeCount = sigs.nodeCount || 0;
        sigs.nodes = nodesSig;
        sigs.nodeCount = nodes.length;
        if (isDragging) {
          deferredGraphRender = true;
        } else {
          renderAgentGraph();
          if (isLiveUpdate && nodes.length > prevNodeCount && prevNodeCount > 0) {
            fitGraphToScreen();
          }
        }
        renderInspector();
      }

      const msgsSig = `${messages.length}:${messages.length ? messages[messages.length - 1].id : ''}`;
      if (!isLiveUpdate || sigs.msgs !== msgsSig) {
        const prevMsgCount = sigs.msgCount || 0;
        const deltaMsgs = Math.max(0, messages.length - prevMsgCount);
        sigs.msgs = msgsSig;
        sigs.msgCount = messages.length;
        renderMessagesAndRoles();
        renderInspector();
        renderTelemetryConsole(!isLiveUpdate);
        if (currentWorkspaceMode === 'telemetry') {
          renderTelemetryFullView(!isLiveUpdate);
        } else if (isLiveUpdate && deltaMsgs > 0) {
          const drawer = document.getElementById('telemetry-drawer');
          if (drawer && drawer.getAttribute('data-drawer-state') === 'ticker') {
            unreadTelemetryCount += deltaMsgs;
            _updateBadge('badge-telemetry-new', unreadTelemetryCount);
          }
        }
      }

      const retrosSig = JSON.stringify(retros.map(r => [r.source_path, r.updated_at]));
      if (!isLiveUpdate || sigs.retros !== retrosSig) {
        sigs.retros = retrosSig;
        renderRetrosAndEnv();
      }

      const overviewSig = JSON.stringify([
        prog.user_prompt,
        sci.executive && sci.executive.html,
        sci.mandatory_relays,
        sci.triage_and_gates,
        (sci.program_state || []).map(p => [p.name, p.html && p.html.length])
      ]);
      if (!isLiveUpdate || sigs.overview !== overviewSig) {
        sigs.overview = overviewSig;
        renderOverviewTab();
      }

      const findingsListSig = JSON.stringify(findings.map(f => [f.id, f.state, f.revision, (f.source_citations || []).length]));
      const activeFindingObj = findings.find(f => f.id === selectedFindingId) || findings[0];
      const activeFindingSig = activeFindingObj ? `${activeFindingObj.id}:${activeFindingObj.state}:${(activeFindingObj.html || '').length}` : 'none';
      if (!isLiveUpdate || sigs.findingsList !== findingsListSig || sigs.activeFinding !== activeFindingSig) {
        const prevFindingsCount = sigs.findingsCount || 0;
        const deltaFindings = Math.max(0, findings.length - prevFindingsCount);
        const onlyListChanged = isLiveUpdate && sigs.activeFinding === activeFindingSig && sigs.findingsList !== findingsListSig && prevFindingsCount > 0;
        sigs.findingsList = findingsListSig;
        sigs.activeFinding = activeFindingSig;
        sigs.findingsCount = findings.length;
        if (onlyListChanged) {
          renderFindingsNavOnly();
        } else {
          renderFindingsTab();
        }
        if (isLiveUpdate && deltaFindings > 0 && (currentWorkspaceMode === 'agentic' || currentWorkspaceMode === 'telemetry')) {
          unreadDiscoveryCount += deltaFindings;
          _updateBadge('badge-discovery-new', unreadDiscoveryCount);
        }
      }

      const studioListSig = JSON.stringify(artifacts.map(a => [a.id, a.verdict, a.sha256]));
      const activeArtObj = artifacts.find(a => a.id === selectedArtifactId) || artifacts[0];
      const activeArtSig = activeArtObj ? `${activeArtObj.id}:${activeArtObj.sha256 || ''}:${activeArtObj.verdict || ''}` : 'none';
      if (!isLiveUpdate || sigs.studioList !== studioListSig || sigs.activeArt !== activeArtSig) {
        const prevArtCount = sigs.artCount || 0;
        const deltaArt = Math.max(0, artifacts.length - prevArtCount);
        const onlyListChanged = isLiveUpdate && sigs.activeArt === activeArtSig && sigs.studioList !== studioListSig && prevArtCount > 0;
        sigs.studioList = studioListSig;
        sigs.activeArt = activeArtSig;
        sigs.artCount = artifacts.length;
        if (onlyListChanged) {
          renderStudioListOnly();
        } else {
          renderStudioTab();
        }
        if (isLiveUpdate && deltaArt > 0 && (currentWorkspaceMode === 'agentic' || currentWorkspaceMode === 'telemetry')) {
          unreadDiscoveryCount += deltaArt;
          _updateBadge('badge-discovery-new', unreadDiscoveryCount);
        }
      }
    }

    let __pkdeRafPending = false;
    let __pkdeLatestBundle = null;
    function scheduleLiveRefresh(newBundle) {
      __pkdeLatestBundle = newBundle;
      if (!__pkdeRafPending) {
        __pkdeRafPending = true;
        window.requestAnimationFrame(() => {
          __pkdeRafPending = false;
          if (__pkdeLatestBundle) {
            window.__PKDE_BUNDLE__ = __pkdeLatestBundle;
            refreshAllFromBundle(true);
          }
        });
      }
    }

    (function initInteractions() {
      const stage = document.getElementById('graph-stage');
      stage.addEventListener('mousedown', (e) => {
        if (e.target.closest('.agent-node-group')) return;
        isDragging = true;
        dragStartX = e.clientX - panX;
        dragStartY = e.clientY - panY;
      });
      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        panX = e.clientX - dragStartX;
        panY = e.clientY - dragStartY;
        applySvgTransform();
      });
      window.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          if (deferredGraphRender) {
            deferredGraphRender = false;
            renderAgentGraph();
          }
        }
      });
      stage.addEventListener('wheel', (e) => {
        e.preventDefault();
        zoomGraph(e.deltaY < 0 ? 1.1 : 0.9, e.clientX, e.clientY);
      }, { passive: false });

      window.addEventListener('keydown', (e) => {
        if (['INPUT', 'TEXTAREA', 'SELECT'].includes((e.target && e.target.tagName) || '')) return;
        if (e.key === 't' || e.key === 'T') toggleOrientation();
        if (e.key === 'f' || e.key === 'F') fitGraphToScreen();
      });

      ['tele-drawer-stream', 'tele-full-stream'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('mouseenter', () => {
          _setTelePausedState(true);
        });
        el.addEventListener('mouseleave', () => {
          const atBottom = (el.scrollHeight - el.scrollTop - el.clientHeight) < 36;
          if (atBottom) {
            resumeTelemetryStream();
          }
        });
        el.addEventListener('scroll', () => {
          const atBottom = (el.scrollHeight - el.scrollTop - el.clientHeight) < 36;
          if (!atBottom) {
            _setTelePausedState(true);
          } else if (telePaused) {
            resumeTelemetryStream();
          }
        });
      });
    })();

    let __pkdeEventSource = null;
    let __pkdeReconnectTimer = null;
    function initLiveSseIfAvailable() {
      if (!window.location.protocol.startsWith('http')) return;
      if (__pkdeEventSource) {
        try { __pkdeEventSource.close(); } catch (_e) {}
        __pkdeEventSource = null;
      }
      try {
        const es = new EventSource('/api/stream');
        __pkdeEventSource = es;
        es.onopen = () => {
          const b = document.getElementById('conn-badge');
          if (b) b.classList.remove('error');
        };
        es.onmessage = (ev) => {
          try {
            const msg = JSON.parse(ev.data);
            if (msg.type === 'bundle_updated' && msg.bundle) {
              scheduleLiveRefresh(msg.bundle);
            }
          } catch (_e) {}
        };
        es.onerror = () => {
          const b = document.getElementById('conn-badge');
          if (b) b.classList.add('error');
          const txt = document.getElementById('conn-text');
          if (txt) txt.textContent = 'SSE DISCONNECTED';
          try { es.close(); } catch (_e) {}
          __pkdeEventSource = null;
          if (!__pkdeReconnectTimer) {
            __pkdeReconnectTimer = setTimeout(() => {
              __pkdeReconnectTimer = null;
              initLiveSseIfAvailable();
            }, 1500);
          }
        };
      } catch (_e) {}
    }

    window.addEventListener('DOMContentLoaded', () => {
      try {
        const savedThemeMode = window.localStorage.getItem('pkde-theme-mode');
        if (savedThemeMode && ['light', 'dark', 'system'].includes(savedThemeMode)) {
          setThemeMode(savedThemeMode, true);
        }
      } catch (_e) {}
      try {
        if (window.matchMedia) {
          const mq = window.matchMedia('(prefers-color-scheme: dark)');
          const onSchemeChange = () => {
            if (currentThemeMode === 'system') {
              setThemeMode('system');
            }
          };
          if (typeof mq.addEventListener === 'function') {
            mq.addEventListener('change', onSchemeChange);
          } else if (typeof mq.addListener === 'function') {
            mq.addListener(onSchemeChange);
          }
        }
      } catch (_e) {}
      refreshAllFromBundle(false);
      setTimeout(fitGraphToScreen, 60);
      initLiveSseIfAvailable();
    });
  </script>
</body>
</html>
