<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PkDE Scientific Evaluation Dashboard -- default-program">
  <title>PkDE Evaluation Dashboard -- default-program</title>
  <!-- Typography: DM Sans, Instrument Serif, IBM Plex Mono -->
  <!-- Scientific & Math Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/3dmol@2.4.2/build/3Dmol-min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --font-sans: 'DM Sans', 'Geist Sans', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-mono: 'IBM Plex Mono', 'Geist Mono', monospace;
    }

    :root[data-theme="dark"] {
      --bg-app: #0D0E11;
      --bg-panel: #16171D;
      --bg-card: #16171D;
      --bg-card-hover: #1E2028;
      --bg-elevated: #0D0E11;
      --border-color: #292A30;
      --border-subtle: #292A30;
      --text-primary: #ECE8E2;
      --text-secondary: #9A9895;
      --text-muted: #9A9895;
      --accent-primary: #ECE8E2;
      --accent-secondary: #9A9895;
      --status-critical: #EF4444;
      --status-warning: #F59E0B;
      --status-critical-bg: rgba(239, 68, 68, 0.12);
      --status-warning-bg: rgba(245, 158, 11, 0.12);
    }

    :root[data-theme="light"] {
      --bg-app: #FAFAF9;
      --bg-panel: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-card-hover: #F5F5F4;
      --bg-elevated: #FAFAF9;
      --border-color: #E7E5E4;
      --border-subtle: #E7E5E4;
      --text-primary: #1C1917;
      --text-secondary: #787774;
      --text-muted: #787774;
      --accent-primary: #1C1917;
      --accent-secondary: #787774;
      --status-critical: #DC2626;
      --status-warning: #D97706;
      --status-critical-bg: rgba(220, 38, 38, 0.08);
      --status-warning-bg: rgba(217, 119, 6, 0.08);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: var(--font-sans);
      background: var(--bg-app);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    code, pre, .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    /* Top Bar */
    .topbar {
      height: 54px;
      flex-shrink: 0;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 16px;
      z-index: 20;
    }
    .brand-group {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }
    .brand-mark {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      padding: 2px 6px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      flex-shrink: 0;
    }
    .brand-title {
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 0;
    }
    .brand-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .stage-pill {
      padding: 2px 7px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      background: var(--bg-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }

    /* Flat Bento KPI Strip */
    .kpi-strip {
      display: flex;
      align-items: center;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-card);
      overflow-x: auto;
    }
    .kpi-chip {
      padding: 4px 12px;
      display: flex;
      flex-direction: column;
      min-width: 78px;
      border-right: 1px solid var(--border-color);
    }
    .kpi-chip:last-child {
      border-right: none;
    }
    .kpi-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }
    .kpi-val {
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .mode-switcher {
      display: inline-flex;
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 2px;
    }
    .mode-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .mode-btn:hover {
      color: var(--text-primary);
    }
    .mode-btn.active {
      background: var(--text-primary);
      color: var(--bg-card);
    }
    .theme-switcher {
      display: inline-flex;
      align-items: center;
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }
    .theme-icon-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      width: 26px;
      height: 24px;
      padding: 0;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, color 0.12s;
    }
    .theme-icon-btn:hover {
      color: var(--text-primary);
    }
    .theme-icon-btn.active {
      background: var(--text-primary);
      color: var(--bg-card);
    }
    .theme-icon-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .badge-counter {
      display: none;
      align-items: center;
      justify-content: center;
      min-width: 16px;
      height: 15px;
      padding: 0 4px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      background: var(--border-color);
      color: var(--text-primary);
    }
    .badge-counter.visible {
      display: inline-flex;
    }
    .icon-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: 6px;
      width: 32px;
      height: 32px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.12s;
    }
    .icon-btn:hover {
      background: var(--bg-card-hover);
    }

    /* Connection error banner (hidden unless error state) */
    .conn-badge {
      display: none;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--status-warning);
      background: var(--status-warning-bg);
      color: var(--status-warning);
    }
    .conn-badge.error {
      display: inline-flex;
    }

    /* Main Split Workspace */
    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 46%) minmax(0, 54%);
      grid-template-rows: minmax(0, 1fr);
      min-height: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    .workspace.mode-agentic { grid-template-columns: minmax(0, 1fr); }
    .workspace.mode-agentic .right-pane { display: none; }
    .workspace.mode-science { grid-template-columns: minmax(0, 1fr); }
    .workspace.mode-science .left-pane { display: none; }
    .workspace.mode-telemetry { grid-template-columns: minmax(0, 1fr); }
    .workspace.mode-telemetry .left-pane,
    .workspace.mode-telemetry .right-pane { display: none; }
    .workspace.mode-telemetry .telemetry-view { display: grid; }
    body[data-mode="telemetry"] .telemetry-drawer { display: none; }

    /* Left Pane: Operations & Node Map */
    .left-pane {
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg-app);
    }
    .pane-header {
      height: 40px;
      padding: 0 14px;
      flex-shrink: 0;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .pane-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .mini-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-family: var(--font-sans);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }
    .mini-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
    }
    .mini-btn.active {
      background: var(--text-primary);
      color: var(--bg-card);
      border-color: var(--text-primary);
    }

    /* SVG Lineage Graph Stage */
    .graph-stage {
      flex: 1;
      min-height: 160px;
      position: relative;
      overflow: hidden;
      background-color: var(--bg-app);
      cursor: grab;
    }
    .graph-stage:active { cursor: grabbing; }
    #lineage-svg { width: 100%; height: 100%; display: block; user-select: none; }

    .lease-overlay {
      position: absolute;
      top: 8px;
      left: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      pointer-events: none;
    }
    .lease-pill {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 3px 8px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-secondary);
    }
    :root[data-theme="light"] .lease-pill {
      background: #FFFFFF;
      color: #1C1917;
      border-color: #E7E5E4;
    }
    .lease-pill.held {
      border-color: var(--status-warning);
      color: var(--status-warning);
      background: var(--status-warning-bg);
    }

    /* Agent Bottom Bento Dock */
    .agent-bottom-dock {
      height: 45%;
      min-height: 175px;
      flex-shrink: 0;
      border-top: 1px solid var(--border-color);
      background: var(--bg-panel);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .subtab-bar {
      height: 36px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 6px;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-panel);
    }
    .subtab-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      padding: 7px 10px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .subtab-btn:hover {
      color: var(--text-primary);
    }
    .subtab-btn.active {
      color: var(--text-primary);
      font-weight: 600;
      border-bottom-color: var(--text-primary);
    }
    .dock-body {
      flex: 1;
      overflow-y: auto;
      padding: 0;
      font-size: 12px;
      min-height: 0;
    }

    /* Flat Bento Grid Layout inside Inspector & Retros (No card-in-card nesting) */
    .bento-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100%;
    }
    .bento-cell {
      padding: 12px 14px;
      border-right: 1px solid var(--border-color);
      background: var(--bg-panel);
    }
    .bento-cell:last-child {
      border-right: none;
    }
    .bento-cell h4 {
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
    }
    .skill-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .skill-pill {
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-family: var(--font-mono);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }
    .checks-list {
      display: flex;
      flex-direction: column;
    }
    .check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid var(--border-color);
      font-family: var(--font-mono);
      font-size: 11px;
    }
    .check-row:last-child {
      border-bottom: none;
    }
    .badge-warn {
      color: var(--status-warning);
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 10.5px;
    }
    .badge-fail {
      color: var(--status-critical);
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 10.5px;
    }
    .text-subtle-meta {
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 10.5px;
    }

    /* Message Stream (Flat rows separated by thin 1px dividers) */
    .msg-list {
      display: flex;
      flex-direction: column;
    }
    .msg-item {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border-color);
      font-size: 11.5px;
      background: var(--bg-panel);
    }
    .msg-item.warn {
      border-left: 2px solid var(--status-warning);
    }
    .msg-item.error {
      border-left: 2px solid var(--status-critical);
    }
    .msg-meta {
      display: flex;
      justify-content: space-between;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 10.5px;
      margin-bottom: 3px;
    }
    .msg-route {
      font-family: var(--font-mono);
      color: var(--text-primary);
      font-weight: 600;
    }

    /* Right Pane: Discovery & Findings */
    .right-pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg-app);
    }
    .sci-tabs {
      height: 40px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 8px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
    }
    .sci-tab {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .sci-tab:hover {
      color: var(--text-primary);
    }
    .sci-tab.active {
      color: var(--text-primary);
      font-weight: 600;
      border-bottom-color: var(--text-primary);
    }
    .sci-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      min-height: 0;
      width: 100%;
    }

    /* Flat Bento Sections & Monospaced Tables */
    .sci-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .sci-section h3 {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }
    .sci-section h3 code {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-secondary);
    }
    .bento-subdivider {
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }
    .bento-subdivider:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    /* Tabular Data: Monospaced font + thin horizontal dividers only */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 11.5px;
    }
    .data-table th,
    .data-table td {
      padding: 7px 10px;
      border-bottom: 1px solid var(--border-color);
      border-left: none;
      border-right: none;
      text-align: left;
      vertical-align: top;
      color: var(--text-primary);
    }
    .data-table th {
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: transparent;
    }
    .data-table tr:last-child td {
      border-bottom: none;
    }
    .data-table tr:hover td {
      background: var(--bg-card-hover);
    }

    /* Flat Metric Strip inside Studios */
    .metric-bento-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 14px;
    }
    .metric-bento-item {
      padding: 10px 12px;
      border-right: 1px solid var(--border-color);
    }
    .metric-bento-item:last-child {
      border-right: none;
    }
    .metric-bento-val {
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }
    .metric-bento-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .metric-bento-sub {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Findings Reader */
    .findings-layout {
      display: grid;
      grid-template-columns: minmax(230px, 260px) minmax(0, 1fr);
      gap: 14px;
      min-height: 360px;
      width: 100%;
    }
    .findings-nav {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow-y: auto;
      min-width: 220px;
    }
    .finding-nav-item {
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border-color);
      transition: background 0.12s;
    }
    .finding-nav-item:last-child {
      border-bottom: none;
    }
    .finding-nav-item:hover {
      background: var(--bg-card-hover);
    }
    .finding-nav-item.active {
      background: var(--bg-card-hover);
      border-left: 2px solid var(--text-primary);
    }
    .finding-reader {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 18px 22px;
      overflow-y: auto;
      line-height: 1.65;
      font-size: 13.5px;
      min-width: 0;
    }
    .finding-reader h1,
    .finding-reader h2,
    .finding-reader h3 {
      color: var(--text-primary);
      margin-top: 1.1em;
      font-weight: 600;
    }
    .finding-reader h1 {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 400;
      margin-top: 0;
    }
    .finding-reader table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 12px;
    }
    .finding-reader th,
    .finding-reader td {
      border-bottom: 1px solid var(--border-color);
      border-left: none;
      border-right: none;
      border-top: none;
      padding: 6px 10px;
      text-align: left;
    }
    .finding-reader th {
      color: var(--text-secondary);
      font-weight: 500;
      text-transform: uppercase;
      font-size: 10.5px;
    }
    .finding-reader pre {
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 11.5px;
    }

    /* Interactive {source:} and Relay Citations */
    .pkde-source-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-family: var(--font-mono);
      cursor: pointer;
      margin: 0 2px;
      vertical-align: baseline;
      background: var(--bg-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }
    .pkde-source-badge:hover {
      color: var(--text-primary);
      border-color: var(--text-primary);
    }
    .pkde-source-badge.warn {
      background: var(--status-warning-bg);
      color: var(--status-warning);
      border-color: var(--status-warning);
    }
    .pkde-source-badge.failed {
      background: var(--status-critical-bg);
      color: var(--status-critical);
      border-color: var(--status-critical);
    }
    .pkde-relay-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 7px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }

    /* Interactive Viewers Studio */
    .studio-layout {
      display: grid;
      grid-template-columns: minmax(230px, 260px) minmax(0, 1fr);
      gap: 14px;
      min-height: 360px;
      width: 100%;
    }
    .artifact-list-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow-y: auto;
      max-height: calc(100vh - 150px);
      min-width: 220px;
    }
    .artifact-item {
      padding: 9px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border-color);
      font-size: 12px;
      transition: background 0.12s;
    }
    .artifact-item:last-child {
      border-bottom: none;
    }
    .artifact-item:hover {
      background: var(--bg-card-hover);
    }
    .artifact-item.active {
      background: var(--bg-card-hover);
      border-left: 2px solid var(--text-primary);
    }
    .studio-stage {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      min-width: 0;
      width: 100%;
    }
    .viewer-stage-box {
      width: 100%;
      min-height: 410px;
      position: relative;
      background: var(--bg-card);
      color: var(--text-primary);
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      overflow: hidden;
      padding: 10px 0;
    }
    .mol3d-box {
      width: 100%;
      height: 430px;
      position: relative;
      background: var(--bg-card);
      border-radius: 6px;
    }
    .provenance-tabs {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      margin-bottom: 8px;
    }
    .prov-json-box {
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      max-height: 240px;
      overflow: auto;
      white-space: pre-wrap;
      color: var(--text-primary);
    }

    /* Critical / Error Status Indicators Only */
    .status-alert {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status-alert.critical {
      background: var(--status-critical-bg);
      color: var(--status-critical);
      border: 1px solid var(--status-critical);
    }
    .status-alert.warning {
      background: var(--status-warning-bg);
      color: var(--status-warning);
      border: 1px solid var(--status-warning);
    }

    /* Live Telemetry Console (Persistent Bottom Drawer + 4th Full-Screen View) */
    .telemetry-drawer {
      flex-shrink: 0;
      border-top: 1px solid var(--border-color);
      background: var(--bg-panel);
      display: flex;
      flex-direction: column;
      z-index: 18;
      transition: height 0.16s ease;
    }
    .telemetry-drawer[data-drawer-state="ticker"] { height: 38px; }
    .telemetry-drawer[data-drawer-state="console"] { height: 195px; }
    .telemetry-drawer[data-drawer-state="ticker"] .tele-drawer-body { display: none; }
    .telemetry-drawer[data-drawer-state="console"] .tele-ticker-preview { display: none; }

    .tele-bar {
      height: 37px;
      flex-shrink: 0;
      padding: 0 14px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .tele-bar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
      overflow: hidden;
    }
    .tele-title {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-primary);
      flex-shrink: 0;
    }
    .tele-ticker-preview {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
    }
    .tele-ticker-preview:hover {
      color: var(--text-primary);
    }
    .tele-filters {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: nowrap;
      overflow-x: auto;
    }
    .tele-search {
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      width: 145px;
      font-family: var(--font-mono);
    }
    .tele-pause-pill {
      display: none;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      background: var(--status-warning-bg);
      color: var(--status-warning);
      border: 1px solid var(--status-warning);
      cursor: pointer;
      white-space: nowrap;
    }
    .tele-pause-pill.visible { display: inline-flex; }

    .tele-drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 0;
      font-family: var(--font-mono);
      font-size: 11.5px;
      display: flex;
      flex-direction: column;
    }
    .tele-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 14px;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-panel);
      cursor: pointer;
      transition: background 0.12s;
      min-width: 0;
    }
    .tele-row:hover {
      background: var(--bg-card-hover);
    }
    .tele-row.level-warn {
      border-left: 2px solid var(--status-warning);
    }
    .tele-row.level-error {
      border-left: 2px solid var(--status-critical);
    }
    .tele-time {
      color: var(--text-secondary);
      font-size: 10.5px;
      flex-shrink: 0;
    }
    .tele-tag {
      font-size: 9.5px;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      flex-shrink: 0;
      min-width: 64px;
      text-align: center;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      background: var(--bg-elevated);
    }
    .tag-error {
      background: var(--status-critical-bg);
      color: var(--status-critical);
      border-color: var(--status-critical);
    }
    .tele-route {
      color: var(--text-primary);
      font-weight: 600;
      flex-shrink: 0;
      font-size: 11px;
    }
    .tele-summary {
      color: var(--text-secondary);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tele-action {
      font-size: 10px;
      color: var(--text-secondary);
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    /* 4th Full-Screen View: Telemetry & Live Status Board */
    .telemetry-view {
      display: none;
      grid-template-columns: minmax(0, 62%) minmax(0, 38%);
      grid-template-rows: minmax(0, 1fr);
      min-height: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-app);
    }
    .tele-full-left {
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      background: var(--bg-panel);
    }
    .tele-full-right {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      overflow-y: auto;
      padding: 14px;
      gap: 14px;
      background: var(--bg-app);
    }
    .tele-board-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px 14px;
    }
    .tele-board-card h3 {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }
    .tele-highlight-flash {
      animation: teleFlash 1.2s ease-out;
    }
    @keyframes teleFlash {
      0% { box-shadow: 0 0 0 2px var(--text-primary); }
      100% { box-shadow: 0 0 0 0 transparent; }
    }
  </style>
</head>

  <script>
    /* =========================================================================
     * 0. THEME & DATA VISUALIZATION PALETTE HELPERS
     * ========================================================================= */
    function getThemeTokens() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      // Dynamic Data Visualization & Color Palette
      const viz = {
        teal: '#0D9488',     // Vibrant Teal: Primary data series, healthy nodes, structural bonds, baseline metrics
        amber: '#D97706',    // Energetic Amber: Secondary data series, warnings, dynamic connections, medium intensity
        indigo: '#4F46E5',   // Vivid Indigo: Comparison series, distinct molecular groups, specialized network nodes
        emerald: '#059669',  // Functional Emerald: Success metrics, active/positive data, stable system states
        rose: '#E11D48',     // Deep Rose: Negative trends, high-priority anomalies, critical cluster highlights
        palette: ['#0D9488', '#4F46E5', '#059669', '#D97706', '#E11D48'],
        tealAlpha: 'rgba(13, 148, 136, 0.22)',
        indigoAlpha: 'rgba(79, 70, 229, 0.20)'
      };
      if (isLight) {
        return Object.assign({}, viz, {
          isLight: true,
          bg: '#FAFAF9',
          surface: '#FFFFFF',
          border: '#E7E5E4',
          textPrimary: '#1C1917',
          textSecondary: '#787774',
          seriesPrimary: '#0D9488',
          seriesSecondary: '#4F46E5',
          seriesTertiary: '#059669',
          seriesWarning: '#D97706',
          seriesDanger: '#E11D48',
          seriesMuted: '#787774',
          fillAlpha: 'rgba(13, 148, 136, 0.22)',
          critical: '#E11D48',
          warning: '#D97706',
          monoScale: ['#0D9488', '#4F46E5', '#059669', '#D97706', '#E11D48']
        });
      }
      return Object.assign({}, viz, {
        isLight: false,
        bg: '#0D0E11',
        surface: '#16171D',
        border: '#292A30',
        textPrimary: '#ECE8E2',
        textSecondary: '#9A9895',
        seriesPrimary: '#0D9488',
        seriesSecondary: '#4F46E5',
        seriesTertiary: '#059669',
        seriesWarning: '#D97706',
        seriesDanger: '#E11D48',
        seriesMuted: '#9A9895',
        fillAlpha: 'rgba(13, 148, 136, 0.24)',
        critical: '#E11D48',
        warning: '#D97706',
        monoScale: ['#0D9488', '#4F46E5', '#059669', '#D97706', '#E11D48']
      });
    }

    function isCriticalState(st) {
      const s = String(st || '').toLowerCase();
      return ['validation_failed', 'failed', 'scientifically_rejected', 'fail', 'error', 'unacceptable', 'unaddressed'].includes(s);
    }

    function isWarningState(st) {
      const s = String(st || '').toLowerCase();
      return ['warn', 'pass_with_warnings', 'marginal', 'flag', 'held', 'narrow'].some(k => s.includes(k));
    }

    function renderCriticalStatusBadge(st, customLabel) {
      if (isCriticalState(st)) {
        return `<span class="status-alert critical">${escapeHtml(customLabel || st)}</span>`;
      }
      if (isWarningState(st)) {
        return `<span class="status-alert warning">${escapeHtml(customLabel || st)}</span>`;
      }
      return '';
    }

    function agentNodeColor(agent, theme) {
      if (!agent) return theme.teal;
      const crit = isCriticalState(agent.state) || (agent.validation && agent.validation.result === 'fail');
      if (crit) return theme.rose;
      const warn = isWarningState(agent.state) || agent.correction_cycle > 0;
      if (warn) return theme.amber;
      const role = String(agent.role || agent.id || '').toLowerCase();
      const cat = String(agent.category || '').toLowerCase();
      if (role.includes('science-program-lead') || role.includes('head-of-discovery') || cat.includes('leadership') || cat.includes('orchestrator')) {
        return theme.indigo;
      }
      if (role.includes('hypex') || cat.includes('hypothesis')) {
        return theme.amber;
      }
      if (role.includes('operations-controller') || role.includes('validator') || role.includes('reviewer') || role.includes('bootstrapper') || role.includes('curator') || cat.includes('governance') || cat.includes('operations')) {
        return theme.emerald;
      }
      return theme.teal;
    }

    /* =========================================================================
     * 1. INTERACTIVE RELATIONSHIP NODE MAP ENGINE
     * ========================================================================= */
    const NODE_W = 180;
    const NODE_H = 72;
    const GAP_X = 28;
    const GAP_Y = 52;
    const H_GAP_X = 60;
    const H_GAP_Y = 22;
    const PAD = 32;

    let currentOrientation = 'vertical';
    let collapsedIds = new Set();
    let selectedNodeId = null;
    let selectedFindingId = null;
    let selectedArtifactId = null;
    let currentMsgFilter = 'all';
    let forceRawJsonMode = false;
    let panX = 20, panY = 20, scale = 1.0;
    let isDragging = false, dragStartX = 0, dragStartY = 0;

    function compareIds(a, b) {
      return a < b ? -1 : a > b ? 1 : 0;
    }

    function edgeEndpoints(orientation, parent, child) {
      if (orientation === 'horizontal') {
        return {
          x1: parent.px + NODE_W,
          y1: parent.py + NODE_H / 2,
          x2: child.px,
          y2: child.py + NODE_H / 2
        };
      }
      return {
        x1: parent.px + NODE_W / 2,
        y1: parent.py + NODE_H,
        x2: child.px + NODE_W / 2,
        y2: child.py
      };
    }

    function buildLineageForest(agents) {
      const byId = new Map();
      for (const agent of agents) {
        byId.set(agent.id, { agent, children: [], x: 0, depth: 0 });
      }
      const roots = [];
      for (const node of byId.values()) {
        const pid = node.agent.parentId;
        const parent = pid ? byId.get(pid) : undefined;
        if (parent && parent !== node) {
          parent.children.push(node);
        } else {
          roots.push(node);
        }
      }
      const byName = (a, b) =>
        (a.agent.name || '').localeCompare(b.agent.name || '') || compareIds(a.agent.id, b.agent.id);
      for (const node of byId.values()) node.children.sort(byName);
      roots.sort(byName);

      const visited = new Set();
      const visit = (node, depth) => {
        if (visited.has(node.agent.id)) return;
        visited.add(node.agent.id);
        node.depth = depth;
        node.children = node.children.filter(c => !visited.has(c.agent.id));
        for (const child of node.children) visit(child, depth + 1);
      };
      for (const root of roots) visit(root, 0);
      return roots;
    }

    function layoutForest(roots, orientation) {
      let nextLeafSlot = 0;
      const assignSlots = (node) => {
        if (collapsedIds.has(node.agent.id) || node.children.length === 0) {
          node.x = nextLeafSlot++;
          return;
        }
        for (const child of node.children) assignSlots(child);
        node.x = (node.children[0].x + node.children[node.children.length - 1].x) / 2;
      };
      for (const r of roots) {
        assignSlots(r);
        nextLeafSlot += 0.4;
      }

      const nodes = [];
      const posById = new Map();
      const collect = (node) => {
        const vx = PAD + node.x * (NODE_W + GAP_X);
        const vy = PAD + node.depth * (NODE_H + GAP_Y);
        const px = orientation === 'horizontal' ? (PAD + node.depth * (NODE_W + H_GAP_X)) : vx;
        const py = orientation === 'horizontal' ? (PAD + node.x * (NODE_H + H_GAP_Y)) : vy;
        const positioned = { agent: node.agent, px, py };
        nodes.push(positioned);
        posById.set(node.agent.id, positioned);
        if (!collapsedIds.has(node.agent.id)) {
          for (const c of node.children) collect(c);
        }
      };
      for (const r of roots) collect(r);

      const edges = [];
      for (const n of nodes) {
        const pid = n.agent.parentId;
        if (pid && posById.has(pid)) {
          const p = posById.get(pid);
          edges.push({
            ...edgeEndpoints(orientation, p, n),
            parentId: pid,
            childId: n.agent.id,
            state: n.agent.state,
            childAgent: n.agent
          });
        }
      }

      let maxX = PAD + NODE_W, maxY = PAD + NODE_H;
      for (const n of nodes) {
        maxX = Math.max(maxX, n.px + NODE_W + PAD);
        maxY = Math.max(maxY, n.py + NODE_H + PAD);
      }
      return { nodes, edges, width: maxX, height: maxY };
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function stateColor(st) {
      const theme = getThemeTokens();
      if (isCriticalState(st)) return theme.rose;
      if (isWarningState(st)) return theme.amber;
      return theme.teal;
    }

    function applySvgTransform() {
      const vp = document.getElementById('lineage-viewport');
      if (vp) vp.setAttribute('transform', `translate(${panX},${panY}) scale(${scale})`);
    }

    function zoomGraph(factor, clientX, clientY) {
      const stage = document.getElementById('graph-stage');
      const oldScale = scale;
      const newScale = Math.max(0.25, Math.min(2.5, oldScale * factor));
      if (stage && newScale !== oldScale) {
        const rect = stage.getBoundingClientRect();
        const cx = (typeof clientX === 'number') ? (clientX - rect.left) : (rect.width / 2);
        const cy = (typeof clientY === 'number') ? (clientY - rect.top) : (rect.height / 2);
        const ratio = newScale / oldScale;
        panX = cx - (cx - panX) * ratio;
        panY = cy - (cy - panY) * ratio;
      }
      scale = newScale;
      applySvgTransform();
    }

    function fitGraphToScreen() {
      const stage = document.getElementById('graph-stage');
      const bundle = window.__PKDE_BUNDLE__;
      if (!stage || !bundle) return;
      const roots = buildLineageForest(bundle.agent_system.nodes || []);
      const layout = layoutForest(roots, currentOrientation);
      const sw = stage.clientWidth || 600;
      const sh = stage.clientHeight || 360;
      const sx = sw / Math.max(layout.width, 200);
      const sy = sh / Math.max(layout.height, 200);
      scale = Math.max(0.35, Math.min(1.15, Math.min(sx, sy) * 0.92));
      panX = Math.max(12, (sw - layout.width * scale) / 2);
      panY = Math.max(12, (sh - layout.height * scale) / 2);
      applySvgTransform();
    }

    function toggleOrientation() {
      currentOrientation = currentOrientation === 'vertical' ? 'horizontal' : 'vertical';
      renderAgentGraph();
      fitGraphToScreen();
    }

    function renderAgentGraph() {
      const bundle = window.__PKDE_BUNDLE__;
      const theme = getThemeTokens();
      const nodesData = (bundle.agent_system && bundle.agent_system.nodes) || [];
      document.getElementById('graph-node-count').textContent = `${nodesData.length} nodes`;

      // Only surface lease pills if a resource lease is actively held/contended
      const leases = (bundle.agent_system && bundle.agent_system.leases) || [];
      const heldLeases = leases.filter(l => l.state === 'held');
      const leaseOverlay = document.getElementById('lease-overlay');
      if (heldLeases.length === 0) {
        leaseOverlay.innerHTML = '';
      } else {
        leaseOverlay.innerHTML = heldLeases.map(l =>
          `<span class="lease-pill held">Lease ${escapeHtml(l.resource)}: HELD (${escapeHtml(l.holder_agent || l.work_order_id || '')})</span>`
        ).join('');
      }

      const roots = buildLineageForest(nodesData);
      const layout = layoutForest(roots, currentOrientation);
      const vp = document.getElementById('lineage-viewport');
      let svgParts = [];

      // Draw cubic Bezier edges using semi-transparent node colors
      for (const e of layout.edges) {
        const edgeCol = agentNodeColor(e.childAgent, theme);
        let d;
        if (currentOrientation === 'horizontal') {
          const mx = (e.x1 + e.x2) / 2;
          d = `M ${e.x1} ${e.y1} C ${mx} ${e.y1}, ${mx} ${e.y2}, ${e.x2} ${e.y2}`;
        } else {
          const my = (e.y1 + e.y2) / 2;
          d = `M ${e.x1} ${e.y1} C ${e.x1} ${my}, ${e.x2} ${my}, ${e.x2} ${e.y2}`;
        }
        svgParts.push(
          `<path d="${d}" fill="none" stroke="${edgeCol}" stroke-width="1.65" stroke-opacity="0.55" />`
        );
      }

      // Draw category/state-colored agent nodes from the 5-color palette
      for (const n of layout.nodes) {
        const a = n.agent;
        const isSelected = a.id === selectedNodeId;
        const crit = isCriticalState(a.state) || (a.validation && a.validation.result === 'fail');
        const warn = !crit && (isWarningState(a.state) || a.correction_cycle > 0);
        const nodeCol = agentNodeColor(a, theme);
        const strokeCol = (isSelected || crit || warn) ? nodeCol : nodeCol;
        const strokeOp = (isSelected || crit || warn) ? '1.0' : '0.65';
        const strokeW = isSelected ? 2.2 : ((crit || warn) ? 1.8 : 1.25);
        const titleShort = (a.name || a.id).slice(0, 24);
        const woBadge = a.work_order_id ? `${a.work_order_id}${a.revision ? '-r' + a.revision : ''}` : (a.category || 'Agent');
        const skillsCount = (a.injected_skills || []).length;
        const errorFlag = crit ? ' . FAIL' : (warn ? ' . WARN' : '');

        svgParts.push(`
          <g class="agent-node-group" transform="translate(0,0)" style="cursor:pointer" onclick="selectAgentNode('${escapeHtml(a.id)}')">
            <rect x="${n.px}" y="${n.py}" width="${NODE_W}" height="${NODE_H}" rx="6"
                  fill="${theme.surface}" stroke="${strokeCol}" stroke-opacity="${strokeOp}" stroke-width="${strokeW}" />
            <rect x="${n.px}" y="${n.py}" width="5" height="${NODE_H}" rx="3" fill="${nodeCol}" />
            <text x="${n.px + 14}" y="${n.py + 23}" fill="${theme.textPrimary}" font-family="DM Sans, sans-serif" font-size="11.5" font-weight="600">${escapeHtml(titleShort)}</text>
            <text x="${n.px + 14}" y="${n.py + 42}" fill="${nodeCol}" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600">${escapeHtml(woBadge)}${escapeHtml(errorFlag)}</text>
            <text x="${n.px + 14}" y="${n.py + 58}" fill="${theme.textSecondary}" font-family="IBM Plex Mono, monospace" font-size="9.5">${skillsCount} skills${a.run_id ? ' . ' + escapeHtml(a.run_id) : ''}</text>
          </g>
        `);
      }

      vp.innerHTML = svgParts.join('');
      applySvgTransform();
    }

    function selectAgentNode(nodeId) {
      selectedNodeId = nodeId;
      renderAgentGraph();
      renderInspector();
      switchDockTab('inspector');
    }

    function renderInspector() {
      const bundle = window.__PKDE_BUNDLE__;
      const nodes = (bundle.agent_system && bundle.agent_system.nodes) || [];
      const node = nodes.find(n => n.id === selectedNodeId) || nodes.find(n => n.work_order_id) || nodes[1] || nodes[0];
      const container = document.getElementById('dock-inspector');
      if (!node) {
        container.innerHTML = '<div style="padding:14px;color:var(--text-secondary)">No agent nodes available.</div>';
        return;
      }
      selectedNodeId = node.id;

      const wasCtxOpen = Boolean(container.querySelector('details[data-ctx-snap]') && container.querySelector('details[data-ctx-snap]').open);

      const skillsHtml = (node.injected_skills || []).map(s =>
        `<span class="skill-pill">${escapeHtml(s)}</span>`
      ).join('') || '<span style="color:var(--text-muted)">None</span>';

      const all10 = (bundle.agent_system && bundle.agent_system.all_10_checks) || [];
      const val = node.validation;
      const checkMap = {};
      if (val && Array.isArray(val.checks)) {
        val.checks.forEach(c => { checkMap[c.name] = c; });
      }

      // Only render status indicators on failed or warning checks; normal checks show quiet metric detail
      const checksHtml = all10.map((chk, idx) => {
        const rec = checkMap[chk.name];
        const res = rec ? (rec.result || rec.status || 'skip') : 'skip';
        const isFail = res === 'fail';
        const isWarn = res === 'pass_with_warnings' || res === 'warn';
        const statusIndicator = isFail
          ? `<span class="badge-fail">FAIL</span>`
          : (isWarn ? `<span class="badge-warn">WARN</span>` : `<span class="text-subtle-meta">${escapeHtml(chk.kind)}</span>`);
        return `
          <div class="check-row">
            <span>${idx + 1}. <code>${escapeHtml(chk.name)}</code></span>
            ${statusIndicator}
          </div>
        `;
      }).join('');

      const delivHtml = (node.deliverables || []).map(d => {
        const isFinding = d.startsWith('findings/') && d.endsWith('.md');
        const isRaw = d.startsWith('raw/');
        const clickAttr = isFinding
          ? `onclick="openFindingByPath('${escapeHtml(d)}')" style="cursor:pointer;text-decoration:underline;"`
          : (isRaw ? `onclick="openArtifactByPath('${escapeHtml(d)}')" style="cursor:pointer;text-decoration:underline;"` : '');
        return `<div ${clickAttr} class="mono" style="font-size:11px;padding:2px 0;">${escapeHtml(d)}</div>`;
      }).join('') || '<div style="color:var(--text-muted)">None</div>';

      const failureBanner = (node.failure_class || node.failure_detail)
        ? `<div style="margin:6px 0;padding:6px 8px;border-radius:6px;background:var(--status-critical-bg);border:1px solid var(--status-critical);font-size:11px;color:var(--status-critical);">
             <strong>Failure:</strong> <code>${escapeHtml(node.failure_class || 'error')}</code> ${escapeHtml(node.failure_detail || '')}
           </div>`
        : '';

      const ctx = node.context_snapshot;
      let ctxHtml = '';
      if (ctx) {
        const links = ctx.artifact_links || [];
        const linksHtml = links.map(lk => {
          const p = typeof lk === 'string' ? lk : (lk.path || lk.rel_path || JSON.stringify(lk));
          return `<span class="skill-pill">${escapeHtml(p)}</span>`;
        }).join(' ');
        ctxHtml = `
          <details data-ctx-snap="1" ${wasCtxOpen ? 'open' : ''} style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border-color);font-size:11px;">
            <summary style="cursor:pointer;font-weight:500;color:var(--text-secondary);">
              Context Snapshot (<code>${escapeHtml(String(ctx.hash || '').slice(0, 12))}</code>)
            </summary>
            <div style="margin-top:6px;display:flex;flex-direction:column;gap:4px;" class="mono">
              <div>SHA-256: <code>${escapeHtml(ctx.hash || '-')}</code></div>
              ${links.length ? `<div>Links: ${linksHtml}</div>` : ''}
            </div>
          </details>
        `;
      }

      const allMsgs = (bundle.agent_system && bundle.agent_system.messages) || [];
      const nodeRoleRef = `pkde-${node.role}`;
      const nodeMsgs = allMsgs.filter(m =>
        m.sender === node.id || m.recipient === node.id ||
        m.sender === nodeRoleRef || m.recipient === nodeRoleRef ||
        (node.work_order_id && m.work_order_id === node.work_order_id) ||
        m.target_id === node.id
      ).slice(-4).reverse();
      const recentCommsHtml = nodeMsgs.length > 0 ? `
        <div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border-color);">
          <h4>Recent Communications (${nodeMsgs.length})</h4>
          <div style="display:flex;flex-direction:column;gap:4px;">
            ${nodeMsgs.map(m => `
              <div style="font-size:10.5px;padding:4px 0;border-bottom:1px solid var(--border-color);cursor:pointer;" onclick="navigateTelemetryEvent('${escapeHtml(m.id || '')}')">
                <span class="mono" style="font-weight:600;">${escapeHtml(m.sender)} -&gt; ${escapeHtml(m.recipient)}</span>: ${escapeHtml(m.summary)}
              </div>
            `).join('')}
          </div>
        </div>
      ` : '';

      const critBadge = renderCriticalStatusBadge(node.state);
      const corrBadge = node.correction_cycle ? `<span class="status-alert warning">Retries: ${escapeHtml(node.correction_cycle)}</span>` : '';

      container.innerHTML = `
        <div class="bento-split">
          <div class="bento-cell">
            <h4>Agent Identity</h4>
            <div style="font-size:13px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px;">
              <span>${escapeHtml(node.name)}</span>
              ${critBadge}
              ${corrBadge}
            </div>
            <div class="mono" style="color:var(--text-secondary);font-size:11px;margin-bottom:8px;">
              ${escapeHtml(node.role)}${node.work_order_id ? ` . ${escapeHtml(node.work_order_id)}-r${escapeHtml(node.revision || 1)}` : ''}${node.run_id ? ` . ${escapeHtml(node.run_id)}` : ''}
            </div>
            ${failureBanner}
            <div style="font-size:11.5px;margin-bottom:10px;color:var(--text-secondary);">${escapeHtml(node.decision_question || node.description || '')}</div>
            <h4>Skills</h4>
            <div class="skill-pills" style="margin-bottom:10px;">${skillsHtml}</div>
            <h4>Deliverables</h4>
            <div>${delivHtml}</div>
            ${ctxHtml}
            ${recentCommsHtml}
          </div>
          <div class="bento-cell">
            <h4>10-Check Validation Matrix ${val && val.result === 'fail' ? '<span class="status-alert critical">FAIL</span>' : ''}</h4>
            <div class="checks-list">${checksHtml}</div>
          </div>
        </div>
      `;
    }

    function setMsgFilter(filter) {
      currentMsgFilter = filter;
      renderMessagesAndRoles();
    }

    function matchesMsgFilter(m, filter) {
      if (!filter || filter === 'all') return true;
      const t = String(m.type || '').toLowerCase();
      if (filter === 'dispatch') return t.includes('dispatch') || t.includes('work_order') || t.includes('run') || t.includes('agent_message') || t.includes('prompt');
      if (filter === 'tools') return t.includes('tool_phase') || t.includes('tool_started') || t.includes('tool_completed') || t.includes('tool_failed');
      if (filter === 'validation') return t.includes('validation') || t.includes('correction') || t.includes('accepted') || t.includes('rejected') || t.includes('finding') || t.includes('state');
      if (filter === 'leases') return t.includes('lease');
      return true;
    }

    function renderMessagesAndRoles() {
      const bundle = window.__PKDE_BUNDLE__;
      const messages = (bundle.agent_system && bundle.agent_system.messages) || [];
      document.getElementById('msg-count').textContent = String(messages.length);

      const msgContainer = document.getElementById('dock-messages');
      const filtered = messages.filter(m => matchesMsgFilter(m, currentMsgFilter));
      const filterBtns = [
        { id: 'all', label: `All (${messages.length})` },
        { id: 'dispatch', label: 'Dispatches' },
        { id: 'tools', label: 'Tools' },
        { id: 'validation', label: 'Gates' },
        { id: 'leases', label: 'Leases' }
      ].map(f => `<button class="mini-btn ${currentMsgFilter === f.id ? 'active' : ''}" onclick="setMsgFilter('${f.id}')">${escapeHtml(f.label)}</button>`).join(' ');

      if (messages.length === 0) {
        msgContainer.innerHTML = '<div style="padding:14px;color:var(--text-secondary)">No events recorded.</div>';
      } else {
        msgContainer.innerHTML = `
          <div style="display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--border-color);align-items:center;">
            ${filterBtns}
          </div>
          <div class="msg-list">
            ${filtered.slice().reverse().map(m => {
              const actionBtn = m.action_label
                ? `<button class="mini-btn" style="padding:1px 6px;font-size:10px;" onclick="navigateTelemetryEvent('${escapeHtml(m.id || '')}')">${escapeHtml(m.action_label)}</button>`
                : '';
              return `
                <div class="msg-item ${escapeHtml(m.level || 'info')}">
                  <div class="msg-meta">
                    <span class="msg-route">[${escapeHtml(m.tag || 'EVENT')}] ${escapeHtml(m.sender)} -&gt; ${escapeHtml(m.recipient)}</span>
                    <span style="display:inline-flex;align-items:center;gap:6px;"><code>${escapeHtml(m.type)}</code> . ${escapeHtml(m.timestamp || '')} ${actionBtn}</span>
                  </div>
                  <div style="color:var(--text-secondary);">${escapeHtml(m.summary)}</div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      const roles = Object.values((bundle.agent_system && bundle.agent_system.roles_catalog) || {});
      const rolesContainer = document.getElementById('dock-roles');
      rolesContainer.innerHTML = `
        <table class="data-table">
          <thead><tr><th>Role</th><th>Category</th><th>Skills</th></tr></thead>
          <tbody>
            ${roles.map(r => `
              <tr>
                <td><strong>pkde-${escapeHtml(r.role)}</strong><br><span style="color:var(--text-secondary);font-size:10.5px;">${escapeHtml(r.description)}</span></td>
                <td>${escapeHtml(r.category)}</td>
                <td><div class="skill-pills">${(r.skills || []).map(s => `<span class="skill-pill">${escapeHtml(s)}</span>`).join('')}</div></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function renderRetrosAndEnv() {
      const bundle = window.__PKDE_BUNDLE__;
      const retros = (bundle.agent_system && bundle.agent_system.retrospectives) || [];
      const env = (bundle.agent_system && bundle.agent_system.environment) || {};
      const retroCountEl = document.getElementById('retro-count');
      if (retroCountEl) retroCountEl.textContent = String(retros.length);

      const container = document.getElementById('dock-retros');
      if (!container) return;

      const cli = env.cli_binaries || {};
      const libs = env.python_libraries || {};
      const creds = env.api_credentials || {};

      // Only flag missing/unconfigured dependencies; normal items render as plain monospaced tokens
      const renderEnvItems = (obj) => Object.keys(obj).map(k => {
        const info = obj[k] || {};
        const ok = Boolean(info.available || info.configured);
        return `<span class="skill-pill">${escapeHtml(k)}${!ok ? ' <span class="badge-warn">[MISSING]</span>' : ''}</span>`;
      }).join(' ');

      const retrosHtml = retros.length === 0
        ? `<div style="color:var(--text-secondary);font-size:11.5px;">No retrospectives recorded.</div>`
        : retros.map(r => `
            <div class="bento-subdivider">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                <strong style="font-size:12px;">${escapeHtml(r.title)}</strong>
                <code style="font-size:10px;color:var(--text-secondary);">${escapeHtml(r.source_path)}</code>
              </div>
              <div style="font-size:11.5px;line-height:1.5;color:var(--text-secondary);">${r.html}</div>
            </div>
          `).join('');

      container.innerHTML = `
        <div class="bento-split">
          <div class="bento-cell">
            <h4>Retrospectives</h4>
            ${retrosHtml}
          </div>
          <div class="bento-cell">
            <h4>Environment${env.bootstrap_ready === false ? ' <span class="status-alert warning">INCOMPLETE</span>' : ''}</h4>
            <div style="margin-bottom:8px;"><div style="font-size:10.5px;color:var(--text-secondary);margin-bottom:4px;">CLI Binaries</div><div class="skill-pills">${renderEnvItems(cli)}</div></div>
            <div style="margin-bottom:8px;"><div style="font-size:10.5px;color:var(--text-secondary);margin-bottom:4px;">Python Libraries</div><div class="skill-pills">${renderEnvItems(libs)}</div></div>
            <div><div style="font-size:10.5px;color:var(--text-secondary);margin-bottom:4px;">API Credentials</div><div class="skill-pills">${renderEnvItems(creds)}</div></div>
          </div>
        </div>
      `;

    function showProvPane(which, btnEl) {
      const art = window.__ACTIVE_STUDIO_ART__;
      if (!art) return;

        btnEl.parentElement.querySelectorAll('.mini-btn').forEach(b => b.classList.remove('active'));

    function mountEmbeddedViewer(art) {
      const box = document.getElementById('active-viewer-box');
      const ctrl = document.getElementById('active-viewer-controls');
      if (!box) return;
      box.innerHTML = '';
      if (ctrl) ctrl.innerHTML = '';

      const vtype = art.viewer_type;
      const studio = art.domain_studio || (vtype !== 'json' ? vtype : null);
      const data = art.data;
      const ana = art.analysis || {};

      if (ctrl && studio && !['structure_3d', 'docking_3d', 'sdf_3d'].includes(vtype)) {
        ctrl.innerHTML = `
          <div style="display:flex;gap:6px;align-items:center;">
            <button class="mini-btn ${!forceRawJsonMode ? 'active' : ''}" onclick="toggleStudioRawMode(false)">Visual</button>
            <button class="mini-btn ${forceRawJsonMode ? 'active' : ''}" onclick="toggleStudioRawMode(true)">Raw JSON</button>
          </div>
        `;
      }

      try {
        if (forceRawJsonMode) {
          renderEmbeddedJsonTree(box, data);
          return;
        }
        if (vtype === 'admet' || studio === 'admet') {
          renderEmbeddedAdmet(box, data, ana);
        } else if (vtype === 'plddt' || studio === 'plddt') {
          renderEmbeddedPlddt(box, data);
        } else if (vtype === 'pae' || studio === 'pae') {
          renderEmbeddedPae(box, data, art.name);
        } else if (vtype === 'constraint' || studio === 'constraint') {
          renderEmbeddedConstraint(box, data, art.name, ana);
        } else if (vtype === 'expression' || studio === 'expression') {
          renderEmbeddedExpression(box, data, art.name);
        } else if (vtype === 'pockets' || studio === 'pockets') {
          renderEmbeddedPockets(box, data);
        } else if (vtype === 'docking_scores' || studio === 'docking_scores') {
          renderEmbeddedDockingScores(box, data);
        } else if (vtype === 'contacts' || studio === 'contacts') {
          renderEmbeddedContacts(box, data, art.name);
        } else if (vtype === 'tournament' || studio === 'tournament') {
          renderEmbeddedTournament(box, data, ana);
        } else if (vtype === 'brics' || studio === 'brics') {
          renderEmbeddedBrics(box, data, ana);
        } else if (studio === 'pk_studio') {
          renderEmbeddedPkStudio(box, data, ana, art.name);
        } else if (studio === 'bioactivity_studio') {
          renderEmbeddedBioactivityStudio(box, data, ana, art.name);
        } else if (studio === 'tox_studio') {
          renderEmbeddedToxStudio(box, data, ana, art.name);
        } else if (studio === 'medchem_studio') {
          renderEmbeddedMedChemStudio(box, data, ana, art.name);
        } else if (studio === 'omics_studio') {
          renderEmbeddedOmicsStudio(box, data, ana, art.name);
        } else if (studio === 'competitive_studio') {
          renderEmbeddedCompetitiveStudio(box, data, ana, art.name);
        } else if (vtype === 'structure_3d') {
          renderEmbeddedStructure3D(box, ctrl, art);
        } else if (vtype === 'docking_3d') {
          renderEmbeddedDocking3D(box, ctrl, art);
        } else if (vtype === 'sdf_3d') {
          renderEmbeddedSdf3D(box, ctrl, art);
        } else {
          renderEmbeddedJsonTree(box, data);
        }
      } catch (err) {
        box.innerHTML = `<div style="color:var(--status-critical);padding:12px;">Viewer render error: ${escapeHtml(err.message)}</div>`;
      }
    }

    /* --- Theme-Aware Dynamic Data Visualization Plot Helper (Plotly.js + SVG Fallback) --- */
    function interpolateHexColor(hex1, hex2, t) {
      const c1 = parseInt(hex1.replace('#', ''), 16);
      const c2 = parseInt(hex2.replace('#', ''), 16);
      const r1 = (c1 >> 16) & 255, g1 = (c1 >> 8) & 255, b1 = c1 & 255;
      const r2 = (c2 >> 16) & 255, g2 = (c2 >> 8) & 255, b2 = c2 & 255;
      const r = Math.round(r1 + (r2 - r1) * t);
      const g = Math.round(g1 + (g2 - g1) * t);
      const b = Math.round(b1 + (b2 - b1) * t);
      return `rgb(${r},${g},${b})`;
    }

    function heatmapSampleColor(ratio, theme, invertHot) {
      const r = Math.max(0, Math.min(1, invertHot ? (1 - ratio) : ratio));
      const baseBg = theme.isLight ? '#F5F5F4' : '#1E2028';
      // Multi-stop vibrant gradient: soft desaturated base -> Vibrant Teal (#0D9488) -> Vivid Indigo (#4F46E5) -> Deep Rose (#E11D48)
      if (r < 0.45) {
        return interpolateHexColor(baseBg, theme.teal, r / 0.45);
      }
      if (r < 0.80) {
        return interpolateHexColor(theme.teal, theme.indigo, (r - 0.45) / 0.35);
      }
      return interpolateHexColor(theme.indigo, theme.rose, (r - 0.80) / 0.20);
    }

    function renderPlotWithFallback(container, traces, layout, config) {
      if (!container) return;
      const theme = getThemeTokens();
      const baseLayout = Object.assign({}, layout || {}, {
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)',
        colorway: theme.palette,
        font: { family: 'IBM Plex Mono, monospace', size: 11, color: theme.textPrimary },
        xaxis: Object.assign({
          gridcolor: theme.border,
          linecolor: theme.border,
          zerolinecolor: theme.border,
          tickfont: { color: theme.textSecondary },
          titlefont: { color: theme.textSecondary }
        }, (layout && layout.xaxis) || {}),
        yaxis: Object.assign({
          gridcolor: theme.border,
          linecolor: theme.border,
          zerolinecolor: theme.border,
          tickfont: { color: theme.textSecondary },
          titlefont: { color: theme.textSecondary }
        }, (layout && layout.yaxis) || {})
      });
      if (baseLayout.polar) {
        baseLayout.polar = Object.assign({
          bgcolor: 'rgba(0,0,0,0)',
          angularaxis: { gridcolor: theme.border, linecolor: theme.border, tickfont: { color: theme.textSecondary } },
          radialaxis: Object.assign({ gridcolor: theme.border, linecolor: theme.border, tickfont: { color: theme.textSecondary } }, baseLayout.polar.radialaxis || {})
        }, baseLayout.polar);

      if (baseLayout.title) {
