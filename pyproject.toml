[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pde-agent-plugin"
version = "0.3.0"
description = "Pharmakon Discovery Engine (PDE) Agent Plugin, Domain Skills, Interactive Scientific Dashboard, and MCP Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "mistune>=3.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "numpy>=1.26",
    "zstandard>=0.22",
    "jsonpath-ng>=1.6",
    "httpx>=0.28.1",
    "mcp>=1.2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
science = [
    "rdkit>=2024.3.1",
    "gemmi>=0.7",
    "pubchempy>=1.0.4",
    "biopython>=1.84",
    "scipy>=1.12",
    "scikit-learn>=1.3",
    "networkx>=3.0",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
pde = "pde.cli:main"
pde-mcp = "pde_plugin.mcp_server:main"
pde-build-targets = "pde_plugin.build_targets:main"

[tool.hatch.build.targets.wheel]
packages = ["pde_plugin", "tools/pde"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "tools", "tools/vendor/hypex"]
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
