    function parseStructureModelsToAtoms(models) {
      const atoms = [];
      const bonds = [];
      const CPK_COLORS = {
        C: '#334155', N: '#2563eb', O: '#dc2626', S: '#d97706', P: '#ea580c',
        F: '#16a34a', CL: '#16a34a', BR: '#991b1b', H: '#94a3b8'
      };

      (models || []).forEach((m, modelIdx) => {
        const raw = String(m.data || '');
        const fmt = (m.format || 'pdb').toLowerCase();
        const startIdx = atoms.length;

        if (fmt === 'sdf') {
          const lines = raw.split(/\r?\n/);
          let countsLineIdx = -1;
          for (let i = 0; i < Math.min(lines.length, 10); i++) {
            if (lines[i].includes('V2000') || lines[i].includes('V3000')) {
              countsLineIdx = i;
              break;
            }
          }
          if (countsLineIdx >= 0) {
            const parts = lines[countsLineIdx].trim().split(/\s+/);
            const nAtoms = parseInt(parts[0], 10) || 0;
            const nBonds = parseInt(parts[1], 10) || 0;
            for (let a = 0; a < nAtoms; a++) {
              const ln = lines[countsLineIdx + 1 + a] || '';
              const cols = ln.trim().split(/\s+/);
              if (cols.length >= 4) {
                const elem = (cols[3] || 'C').toUpperCase();
                atoms.push({
                  x: parseFloat(cols[0]) || 0,
                  y: parseFloat(cols[1]) || 0,
                  z: parseFloat(cols[2]) || 0,
                  elem: elem,
                  atomName: elem + (a + 1),
                  resn: m.label || 'LIG',
                  resi: 1,
                  b: 90,
                  modelIdx: modelIdx,
                  role: m.role || 'ligand',
                  color: m.role === 'ligand' && elem === 'C' ? '#16a34a' : (CPK_COLORS[elem] || '#475569')
                });
              }
            }
            for (let b = 0; b < nBonds; b++) {
              const ln = lines[countsLineIdx + 1 + nAtoms + b] || '';
              const cols = ln.trim().split(/\s+/);
              if (cols.length >= 2) {
                const a1 = (parseInt(cols[0], 10) || 1) - 1 + startIdx;
                const a2 = (parseInt(cols[1], 10) || 1) - 1 + startIdx;
                const order = parseInt(cols[2], 10) || 1;
                if (atoms[a1] && atoms[a2]) bonds.push({ a1, a2, order, kind: 'covalent' });
              }
            }
          }
        } else if (fmt === 'cif') {
          const lines = raw.split(/\r?\n/);
          const headers = [];
          let inAtomLoop = false;
          lines.forEach(line => {
            const t = line.trim();
            if (t.startsWith('_atom_site.')) {
              inAtomLoop = true;
              headers.push(t.replace('_atom_site.', ''));
            } else if (inAtomLoop && (t.startsWith('ATOM ') || t.startsWith('HETATM '))) {
              const cols = t.split(/\s+/);
              const idxX = headers.indexOf('Cartn_x') >= 0 ? headers.indexOf('Cartn_x') : 7;
              const idxY = headers.indexOf('Cartn_y') >= 0 ? headers.indexOf('Cartn_y') : 8;
              const idxZ = headers.indexOf('Cartn_z') >= 0 ? headers.indexOf('Cartn_z') : 9;
              const idxElem = headers.indexOf('type_symbol') >= 0 ? headers.indexOf('type_symbol') : 2;
              const idxAtom = headers.indexOf('label_atom_id') >= 0 ? headers.indexOf('label_atom_id') : 3;
              const idxComp = headers.indexOf('label_comp_id') >= 0 ? headers.indexOf('label_comp_id') : 4;
              const idxSeq = headers.indexOf('label_seq_id') >= 0 ? headers.indexOf('label_seq_id') : 6;
              const idxB = headers.indexOf('B_iso_or_equiv') >= 0 ? headers.indexOf('B_iso_or_equiv') : 11;
              const elem = (cols[idxElem] || 'C').toUpperCase();
              const bVal = parseFloat(cols[idxB]) || 85;
              const plddtCol = bVal >= 90 ? '#0053d6' : (bVal >= 70 ? '#38bdf8' : (bVal >= 50 ? '#eab308' : '#f97316'));
              atoms.push({
                x: parseFloat(cols[idxX]) || 0,
                y: parseFloat(cols[idxY]) || 0,
                z: parseFloat(cols[idxZ]) || 0,
                elem: elem,
                atomName: cols[idxAtom] || elem,
                resn: cols[idxComp] || 'RES',
                resi: parseInt(cols[idxSeq], 10) || 1,
                b: bVal,
                modelIdx: modelIdx,
                role: m.role || 'receptor',
                color: elem === 'C' ? plddtCol : (CPK_COLORS[elem] || plddtCol)
              });
            }
          });
        } else {
          // PDB or PDBQT
          const lines = raw.split(/\r?\n/);
          let currentPose = 1;
          lines.forEach(line => {
            if (line.startsWith('MODEL')) {
              const mp = line.trim().split(/\s+/);
              currentPose = parseInt(mp[1], 10) || currentPose;
            }
            if ((line.startsWith('ATOM') || line.startsWith('HETATM')) && (currentPose === 1 || m.allPoses)) {
              const x = parseFloat(line.substring(30, 38));
              const y = parseFloat(line.substring(38, 46));
              const z = parseFloat(line.substring(46, 54));
              if (!isNaN(x) && !isNaN(y) && !isNaN(z)) {
                const atomName = line.substring(12, 16).trim() || 'C';
                const resn = line.substring(17, 20).trim() || 'RES';
                const resi = parseInt(line.substring(22, 26).trim(), 10) || 1;
                const bVal = parseFloat(line.substring(60, 66).trim()) || 80;
                const elemRaw = (line.substring(76, 78).trim() || atomName.replace(/[0-9]/g, '').slice(0, 1) || 'C').toUpperCase();
                const isLig = m.role === 'ligand' || resn === 'LIG' || resn === 'UNL';
                atoms.push({
                  x, y, z,
                  elem: elemRaw,
                  atomName,
                  resn,
                  resi,
                  b: bVal,
                  modelIdx,
                  role: isLig ? 'ligand' : 'receptor',
                  color: isLig ? (elemRaw === 'C' ? '#16a34a' : (CPK_COLORS[elemRaw] || '#16a34a'))
                               : (elemRaw === 'C' ? '#0284c7' : (CPK_COLORS[elemRaw] || '#64748b'))
                });
              }
            }
          });
        }

        // Infer covalent & C-alpha trace bonds for this model if not already populated from SDF
        const endIdx = atoms.length;
        let prevCaIdx = -1;
        for (let i = startIdx; i < endIdx; i++) {
          if (atoms[i].atomName === 'CA') {
            if (prevCaIdx >= 0) {
              const dx = atoms[i].x - atoms[prevCaIdx].x;
              const dy = atoms[i].y - atoms[prevCaIdx].y;
              const dz = atoms[i].z - atoms[prevCaIdx].z;
              const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
              if (d <= 6.5) bonds.push({ a1: prevCaIdx, a2: i, order: 1, kind: 'backbone' });
            }
            prevCaIdx = i;
          }
          for (let j = i + 1; j < endIdx; j++) {
            const dx = atoms[i].x - atoms[j].x;
            const dy = atoms[i].y - atoms[j].y;
            const dz = atoms[i].z - atoms[j].z;
            const d2 = dx * dx + dy * dy + dz * dz;
            if (d2 > 0.16 && d2 <= 3.85) {
              bonds.push({ a1: i, a2: j, order: 1, kind: 'covalent' });
            }
          }
        }
      });

      return { atoms, bonds };
    }

    function renderCanvas3DMoleculeFallback(container, models, styleMode) {
      container.innerHTML = '';
      const parsed = parseStructureModelsToAtoms(models);
      const atoms = parsed.atoms;
      const bonds = parsed.bonds;

      if (atoms.length === 0) {
        container.innerHTML = '<div style="padding:18px;color:#64748b;">No 3D coordinates found in artifact payload.</div>';
        return null;
      }

      const canvas = document.createElement('canvas');
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      canvas.style.display = 'block';
      canvas.style.cursor = 'grab';
      container.appendChild(canvas);

      // Compute centroid & radius
      let cx = 0, cy = 0, cz = 0;
      atoms.forEach(a => { cx += a.x; cy += a.y; cz += a.z; });
      cx /= atoms.length; cy /= atoms.length; cz /= atoms.length;
      let maxR = 1.0;
      atoms.forEach(a => {
        const d = Math.sqrt((a.x - cx) ** 2 + (a.y - cy) ** 2 + (a.z - cz) ** 2);
        if (d > maxR) maxR = d;
      });

      const state = {
        rotX: 0.35,
        rotY: -0.55,
        zoom: 1.0,
        style: styleMode || 'cartoon',
        dragging: false,
        lastX: 0,
        lastY: 0,
        hoverAtom: null
      };

      function project(a, w, h) {
        let x = a.x - cx, y = a.y - cy, z = a.z - cz;
        // Rotate Y then X
        const cosY = Math.cos(state.rotY), sinY = Math.sin(state.rotY);
        const x1 = x * cosY + z * sinY;
        const z1 = -x * sinY + z * cosY;
        const cosX = Math.cos(state.rotX), sinX = Math.sin(state.rotX);
        const y2 = y * cosX - z1 * sinX;
        const z2 = y * sinX + z1 * cosX;

        const scale = (Math.min(w, h) * 0.38 * state.zoom) / Math.max(maxR, 2.5);
        const persp = 1 + (z2 / (maxR * 4.5));
        return {
          sx: w / 2 + x1 * scale * persp,
          sy: h / 2 - y2 * scale * persp,
          z: z2,
          scale: scale * persp
        };
      }

      function draw() {
        const rect = container.getBoundingClientRect();
        const w = Math.max(rect.width || 620, 360);
        const h = Math.max(rect.height || 440, 320);
        const dpr = window.devicePixelRatio || 1;
        if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
        }
        const ctx = canvas.getContext('2d');
        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);

        const proj = atoms.map(a => ({ atom: a, ...project(a, w, h) }));

        // Draw bonds & backbone trace
        bonds.forEach(b => {
          const p1 = proj[b.a1], p2 = proj[b.a2];
          if (!p1 || !p2) return;
          if (b.kind === 'backbone' && state.style === 'stick') return;
          ctx.beginPath();
          ctx.moveTo(p1.sx, p1.sy);
          ctx.lineTo(p2.sx, p2.sy);
          if (b.kind === 'backbone') {
            ctx.strokeStyle = 'rgba(2, 132, 199, 0.55)';
            ctx.lineWidth = 4.2 * state.zoom;
          } else if (p1.atom.role === 'ligand' || p2.atom.role === 'ligand') {
            ctx.strokeStyle = '#16a34a';
            ctx.lineWidth = (b.order > 1 ? 3.4 : 2.5) * state.zoom;
          } else {
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1.8 * state.zoom;
          }
          ctx.lineCap = 'round';
          ctx.stroke();
        });

        // Sort atoms back-to-front by z
        const sortedProj = proj.slice().sort((a, b) => a.z - b.z);
        sortedProj.forEach(p => {
          const a = p.atom;
          let rad = state.style === 'sphere' ? 8.5 : (a.role === 'ligand' ? 5.2 : (a.atomName === 'CA' ? 4.8 : 3.8));
          rad = Math.max(2.2, rad * state.zoom);

          ctx.beginPath();
          ctx.arc(p.sx, p.sy, rad, 0, Math.PI * 2);
          ctx.fillStyle = a.color;
          ctx.fill();
          ctx.lineWidth = 1;
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();

          // Label key pocket residues or CA atoms
          if ((a.atomName === 'CA' || (a.role === 'receptor' && a.atomName === 'OD1')) && atoms.length <= 90) {
            ctx.font = '600 10px Inter, system-ui, sans-serif';
            ctx.fillStyle = '#0f172a';
            ctx.fillText(`${a.resn}${a.resi}`, p.sx + rad + 3, p.sy + 3);
          }
        });

        // HUD footer
        ctx.font = '500 11px Inter, system-ui, sans-serif';
        ctx.fillStyle = '#475569';
        ctx.fillText(`Interactive 3D Canvas (${atoms.length} atoms, ${bonds.length} bonds) — Drag to rotate · Scroll to zoom · Double-click to reset`, 12, h - 12);

        if (state.hoverAtom) {
          const ha = state.hoverAtom;
          const label = `${ha.resn}${ha.resi} ${ha.atomName} (${ha.elem}) [${ha.x.toFixed(2)}, ${ha.y.toFixed(2)}, ${ha.z.toFixed(2)}]`;
          ctx.font = '600 11.5px Inter, system-ui, sans-serif';
          const tw = ctx.measureText(label).width + 16;
          ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
          ctx.fillRect(12, 12, tw, 24);
          ctx.fillStyle = '#ffffff';
          ctx.fillText(label, 20, 28);
        }
        ctx.restore();
      }

      canvas.addEventListener('mousedown', e => {
        state.dragging = true;
        state.lastX = e.clientX;
        state.lastY = e.clientY;
        canvas.style.cursor = 'grabbing';
      });
      window.addEventListener('mousemove', e => {
        if (state.dragging) {
          const dx = e.clientX - state.lastX;
          const dy = e.clientY - state.lastY;
          state.lastX = e.clientX;
          state.lastY = e.clientY;
          state.rotY += dx * 0.012;
          state.rotX += dy * 0.012;
          draw();
        }
      });
      window.addEventListener('mouseup', () => {
        state.dragging = false;
        canvas.style.cursor = 'grab';
      });
      canvas.addEventListener('mousemove', e => {
        if (state.dragging) return;
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        const proj = atoms.map(a => ({ atom: a, ...project(a, rect.width, rect.height) }));
        let hit = null, bestD = 144;
        proj.forEach(p => {
          const d2 = (p.sx - mx) ** 2 + (p.sy - my) ** 2;
          if (d2 < bestD) { bestD = d2; hit = p.atom; }
        });
        if (hit !== state.hoverAtom) {
          state.hoverAtom = hit;
          draw();
        }
      });
      canvas.addEventListener('wheel', e => {
        e.preventDefault();
        state.zoom = Math.max(0.4, Math.min(3.5, state.zoom * (e.deltaY < 0 ? 1.12 : 0.9)));
        draw();
      }, { passive: false });
      canvas.addEventListener('dblclick', () => {
        state.rotX = 0.35;
        state.rotY = -0.55;
        state.zoom = 1.0;
        draw();
      });

      setTimeout(draw, 20);
      return {
        setStyleMode(mode) { state.style = mode; draw(); },
        render: draw
      };
    }

    /* --- Viewer 11: 3D Protein Structure Studio (3Dmol.js + Canvas2D Fallback) --- */
    function renderEmbeddedStructure3D(box, ctrl, art) {
      if (ctrl) {
        ctrl.innerHTML = `
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <span style="font-size:12px;color:var(--text-secondary);">Style:</span>
            <button class="mini-btn active" onclick="set3DStyle('cartoon')">Cartoon + Pocket (pLDDT)</button>
            <button class="mini-btn" onclick="set3DStyle('stick')">Stick</button>
            <button class="mini-btn" onclick="set3DStyle('sphere')">Sphere</button>
            <button class="mini-btn" onclick="toggle3DRenderEngine()" title="Switch between WebGL (3Dmol.js) and Software Canvas 3D">Engine: ${window.__FORCE_CANVAS_3D__ ? 'Canvas 3D' : 'Auto (WebGL/Canvas)'}</button>
          </div>
        `;
      }
      const mdiv = document.createElement('div');
      mdiv.className = 'mol3d-box';
      box.appendChild(mdiv);
      const fmt = art.name.toLowerCase().endsWith('.cif') ? 'cif' : 'pdb';
      const models = [{ data: String(art.data || ''), format: fmt, role: 'receptor' }];
      window.__ACTIVE_3D_MODELS__ = models;

      if (!canUseWebGL()) {
        window.__ACTIVE_3DMOL__ = null;
        window.__ACTIVE_CANVAS_3D__ = renderCanvas3DMoleculeFallback(mdiv, models, 'cartoon');
        return;
      }

      try {
        const viewer = $3Dmol.createViewer(mdiv, { backgroundColor: 'white' });
        viewer.addModel(String(art.data || ''), fmt);
        const plddtColor = function(atom) {
          const b = atom.b || 0;
          if (b >= 90) return 0x0053D6;
          if (b >= 70) return 0x65CBF3;
          if (b >= 50) return 0xFFDB13;
          return 0xFF7D45;
        };
        viewer.setStyle({}, {
          cartoon: { colorfunc: plddtColor },
          stick: { radius: 0.14, colorfunc: plddtColor },
          sphere: { scale: 0.24, colorfunc: plddtColor }
        });
        viewer.zoomTo();
        viewer.render();
        window.__ACTIVE_3DMOL__ = viewer;
        window.__ACTIVE_CANVAS_3D__ = null;
      } catch (e) {
        console.warn('3Dmol WebGL viewer failed, switching to Canvas2D 3D fallback:', e);
        window.__ACTIVE_3DMOL__ = null;
        window.__ACTIVE_CANVAS_3D__ = renderCanvas3DMoleculeFallback(mdiv, models, 'cartoon');
      }
    }

    function set3DStyle(styleName) {
      if (window.__ACTIVE_CANVAS_3D__) {
        window.__ACTIVE_CANVAS_3D__.setStyleMode(styleName);
        return;
      }
      const v = window.__ACTIVE_3DMOL__;
      if (!v) return;
      if (styleName === 'cartoon') {
        v.setStyle({}, {
          cartoon: { colorscheme: 'chainHetatm' },
          stick: { radius: 0.12, colorscheme: 'chainHetatm' },
          sphere: { scale: 0.22, colorscheme: 'chainHetatm' }
        });
      } else {
        const spec = {};
        spec[styleName] = { colorscheme: 'chainHetatm' };
        v.setStyle({}, spec);
      }
      v.render();
    }

    function toggle3DRenderEngine() {
      window.__FORCE_CANVAS_3D__ = !window.__FORCE_CANVAS_3D__;
      if (window.__ACTIVE_STUDIO_ART__) {
        mountEmbeddedViewer(window.__ACTIVE_STUDIO_ART__);
      }
    }

    /* --- Viewer 12: 3D Docking Poses Studio (3Dmol.js + Canvas2D Fallback) --- */
    function renderEmbeddedDocking3D(box, ctrl, art) {
      if (ctrl) {
        ctrl.innerHTML = `
          <div style="display:flex;gap:8px;align-items:center;">
            <span style="font-size:12px;color:var(--text-secondary);">Docking Complex:</span>
            <button class="mini-btn" onclick="toggle3DRenderEngine()">Engine: ${window.__FORCE_CANVAS_3D__ ? 'Canvas 3D' : 'Auto (WebGL/Canvas)'}</button>
          </div>
        `;
      }
      const mdiv = document.createElement('div');
      mdiv.className = 'mol3d-box';
      box.appendChild(mdiv);

      const pairedRec = art.paired_files && art.paired_files.receptor ? getArtifactById(art.paired_files.receptor) : null;
      const pairedPoses = art.paired_files && art.paired_files.poses ? getArtifactById(art.paired_files.poses) : null;

      const models = [];
      if (art.name.endsWith('.receptor.pdbqt')) {
        models.push({ data: String(art.data || ''), format: 'pdbqt', role: 'receptor' });
        if (pairedPoses && pairedPoses.data) {
          models.push({ data: String(pairedPoses.data), format: 'pdbqt', role: 'ligand' });
        }
      } else {
        if (pairedRec && pairedRec.data) {
          models.push({ data: String(pairedRec.data), format: 'pdbqt', role: 'receptor' });
        }
        models.push({ data: String(art.data || ''), format: 'pdbqt', role: 'ligand' });
      }
      window.__ACTIVE_3D_MODELS__ = models;

      if (!canUseWebGL()) {
        window.__ACTIVE_3DMOL__ = null;
        window.__ACTIVE_CANVAS_3D__ = renderCanvas3DMoleculeFallback(mdiv, models, 'stick');
        return;
      }

      try {
        const viewer = $3Dmol.createViewer(mdiv, { backgroundColor: 'white' });
        const recStyle = {
          cartoon: { color: '#8899aa', opacity: 0.7 },
          stick: { radius: 0.14, colorscheme: 'cyanCarbon' },
          sphere: { scale: 0.25, colorscheme: 'cyanCarbon' }
        };
        const ligStyle = {
          stick: { radius: 0.22, colorscheme: 'greenCarbon' },
          sphere: { scale: 0.28, colorscheme: 'greenCarbon' }
        };

        if (art.name.endsWith('.receptor.pdbqt')) {
          viewer.addModel(String(art.data || ''), 'pdbqt');
          viewer.setStyle({ model: 0 }, recStyle);
          if (pairedPoses && pairedPoses.data) {
            viewer.addModel(String(pairedPoses.data), 'pdbqt');
            viewer.setStyle({ model: 1 }, ligStyle);
          }
        } else {
          if (pairedRec && pairedRec.data) {
            viewer.addModel(String(pairedRec.data), 'pdbqt');
            viewer.setStyle({ model: 0 }, recStyle);
          }
          viewer.addModel(String(art.data || ''), 'pdbqt');
          viewer.setStyle({ model: pairedRec ? 1 : 0 }, ligStyle);
        }
        viewer.zoomTo();
        viewer.render();
        window.__ACTIVE_3DMOL__ = viewer;
        window.__ACTIVE_CANVAS_3D__ = null;
      } catch (e) {
        console.warn('3Dmol docking viewer failed, switching to Canvas2D 3D fallback:', e);
        window.__ACTIVE_3DMOL__ = null;
        window.__ACTIVE_CANVAS_3D__ = renderCanvas3DMoleculeFallback(mdiv, models, 'stick');
      }
    }

    function setWorkspaceMode(mode) {
      const ws = document.getElementById('main-workspace');
      ws.classList.remove('mode-agentic', 'mode-science');
      if (mode === 'agentic') ws.classList.add('mode-agentic');
      if (mode === 'science') ws.classList.add('mode-science');
      document.querySelectorAll('.mode-btn').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-mode') === mode);
      });
      setTimeout(() => {
        if (mode !== 'science') fitGraphToScreen();
        if (mode !== 'agentic' && window.__ACTIVE_STUDIO_ART__) {
          const studioEl = document.getElementById('scitab-studio');
          if (studioEl && studioEl.style.display !== 'none') {
            mountEmbeddedViewer(window.__ACTIVE_STUDIO_ART__);
          }
        }
        window.dispatchEvent(new Event('resize'));
      }, 50);
    }

    function switchDockTab(tab) {
      ['inspector', 'messages', 'roles', 'retros'].forEach(t => {
        const el = document.getElementById('dock-' + t);
        if (el) el.style.display = (t === tab) ? 'block' : 'none';
      });
      document.querySelectorAll('.subtab-btn').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-dock') === tab);
      });

      ['overview', 'findings', 'studio'].forEach(t => {
        document.getElementById('scitab-' + t).style.display = (t === tab) ? 'block' : 'none';
      });
      document.querySelectorAll('.sci-tab').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-scitab') === tab);
      });
      if (tab === 'studio' && window.__ACTIVE_STUDIO_ART__) {
        mountEmbeddedViewer(window.__ACTIVE_STUDIO_ART__);
      }

      const html = document.documentElement;

      html.setAttribute('data-theme', next);
      const sun = document.getElementById('theme-icon-sun');

    // Pan & Zoom mouse handlers on SVG stage
    (function initGraphInteractions() {
      const stage = document.getElementById('graph-stage');
      stage.addEventListener('mousedown', (e) => {
        if (e.target.closest('.agent-node-group')) return;
        isDragging = true;
        dragStartX = e.clientX - panX;
        dragStartY = e.clientY - panY;
      });
      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        panX = e.clientX - dragStartX;
        panY = e.clientY - dragStartY;
        applySvgTransform();
      });
      window.addEventListener('mouseup', () => { isDragging = false; });
      stage.addEventListener('wheel', (e) => {
        e.preventDefault();
        zoomGraph(e.deltaY < 0 ? 1.1 : 0.9, e.clientX, e.clientY);
      }, { passive: false });

      window.addEventListener('keydown', (e) => {
        if (['INPUT', 'TEXTAREA', 'SELECT'].includes((e.target && e.target.tagName) || '')) return;
        if (e.key === 't' || e.key === 'T') toggleOrientation();
        if (e.key === 'f' || e.key === 'F') fitGraphToScreen();
      });
    })();

    // Connect to Live SSE (/api/stream) if served via `pde dashboard serve`
    function initLiveSseIfAvailable() {
      if (window.location.protocol.startsWith('http')) {
        try {
          const es = new EventSource('/api/stream');
          es.onopen = () => {
            const b = document.getElementById('conn-badge');
            b.classList.add('live');
            document.getElementById('conn-text').textContent = 'LIVE SSE';
          };
          es.onmessage = (ev) => {
            try {
              const msg = JSON.parse(ev.data);
              if (msg.type === 'bundle_updated' && msg.bundle) {
                window.__PDE_BUNDLE__ = msg.bundle;
                refreshAllFromBundle();
              }
            } catch (_e) {}
          };
          es.onerror = () => {
            es.close();
          };
        } catch (_e) {}
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      refreshAllFromBundle();
      setTimeout(fitGraphToScreen, 60);
      initLiveSseIfAvailable();
    });
  </script>
</body>
</html>
