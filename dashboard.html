-001-r1)\n\n## Summary\nExecuted human genetic constraint and normal tissue transcriptomic profiling for `WO-001-r1`. KRAS exhibits extreme loss-of-function intolerance in gnomAD with pLI of 0.98 {source: raw/genomics/KRAS.gnomad-constraint.json $.constraint.pLI} and LOEUF of 0.24 {source: raw/genomics/KRAS.gnomad-constraint.json $.constraint.loeuf}.\n\n## Key Findings\n- **Missense & LoF Constraint**: Missense Z-score is 3.42 {source: raw/genomics/KRAS.gnomad-constraint.json $.constraint.mis_z}, confirming strong purifying selection.\n- **Oncology Driver Evidence**: Pancreatic adenocarcinoma association score is 0.94 {source: raw/genomics/KRAS.gnomad-constraint.json $.disease_associations[0].overall_score}.\n- **Normal Tissue Expression (GTEx)**: Peak expression occurs in Colon - Transverse at 48.5 {source: raw/gtex/KRAS.tissue.json $.max_tpm} TPM and Pancreas at 22.4 {source: raw/gtex/KRAS.tissue.json $.tissues[3].median_tpm} TPM.\n- **Relay: `ESSENTIAL_GENE_WT_SPARING_REQUIRED`** — Medicinal chemistry and docking must enforce >=50x G12D over WT selectivity.\n- **Relay: `GI_MUCOSA_WT_EXPRESSION_MONITOR`** — Preclinical toxicology must monitor GI mucosa.\n\n## Verdict\n**GO WITH CAUTION** — Proceed with non-covalent Switch-II pocket inhibitors specifically engaging Asp12.\n\n## Evidence\n- [KRAS gnomAD Constraint](../../raw/genomics/KRAS.gnomad-constraint.json)\n- [KRAS GTEx Expression](../../raw/gtex/KRAS.tissue.json)\n\n## Implications\nWild-type KRAS sparing is the primary design constraint for Stage 2 hit-to-lead.\n", "html": "<h1>KRAS Genetic Constraint &amp; Tissue Expression Assessment (WO-001-r1)<\/h1>\n<h2>Summary<\/h2>\n<p>Executed human genetic constraint and normal tissue transcriptomic profiling for <code>WO-001-r1<\/code>. KRAS exhibits extreme loss-of-function intolerance in gnomAD with pLI of 0.98 <span class=\"pde-source-badge verified\" title=\"{source: raw/genomics/KRAS.gnomad-constraint.json $.constraint.pLI} — OK: values match within tolerance | actual=0.98\" data-source-path=\"raw/genomics/KRAS.gnomad-constraint.json\"><span class=\"badge-icon\">[PASS]<\/span> KRAS.gnomad-constraint.json $.constraint.pLI<\/span> and LOEUF of 0.24 <span class=\"pde-source-badge verified\" title=\"{source: raw/genomics/KRAS.gnomad-constraint.json $.constraint.loeuf} — OK: values match within tolerance | actual=0.24\" data-source-path=\"raw/genomics/KRAS.gnomad-constraint.json\"><span class=\"badge-icon\">[PASS]<\/span> KRAS.gnomad-constraint.json $.constraint.loeuf<\/span>.<\/p>\n<h2>Key Findings<\/h2>\n<ul>\n<li><strong>Missense &amp; LoF Constraint<\/strong>: Missense Z-score is 3.42 <span class=\"pde-source-badge verified\" title=\"{source: raw/genomics/KRAS.gnomad-constraint.json $.constraint.mis_z} — OK: values match within tolerance | actual=3.42\" data-source-path=\"raw/genomics/KRAS.gnomad-constraint.json\"><span class=\"badge-icon\">[PASS]<\/span> KRAS.gnomad-constraint.json $.constraint.mis_z<\/span>, confirming strong purifying selection.<\/li>\n<li><strong>Oncology Driver Evidence<\/strong>: Pancreatic adenocarcinoma association score is 0.94 <span class=\"pde-source-badge verified\" title=\"{source: raw/genomics/KRAS.gnomad-constraint.json $.disease_associations[0].overall_score} — OK: values match within tolerance | actual=0.94\" data-source-path=\"raw/genomics/KRAS.gnomad-constraint.json\"><span class=\"badge-icon\">[PASS]<\/span> KRAS.gnomad-constraint.json $.disease_associations[0].overall_score<\/span>.<\/li>\n<li><strong>Normal Tissue Expression (GTEx)<\/strong>: Peak expression occurs in Colon - Transverse at 48.5 <span class=\"pde-source-badge verified\" title=\"{source: raw/gtex/KRAS.tissue.json $.max_tpm} — OK: values match within tolerance | actual=48.5\" data-source-path=\"raw/gtex/KRAS.tissue.json\"><span class=\"badge-icon\">[PASS]<\/span> KRAS.tissue.json $.max_tpm<\/span> TPM and Pancreas at 22.4 <span class=\"pde-source-badge verified\" title=\"{source: raw/gtex/KRAS.tissue.json $.tissues[3].m     let currentOrientation = 'vertical'; // 'vertical' | 'horizontal'
    let collapsedIds = new Set();
    let selectedNodeId = null;
    let selectedFindingId = null;
    let selectedArtifactId = null;
    let currentMsgFilter = 'all';
    let forceRawJsonMode = false;
    let panX = 20, panY = 20, scale = 1.0;
    let isDragging = false, dragStartX = 0, dragStartY = 0;

    function compareIds(a, b) {
      return a < b ? -1 : a > b ? 1 : 0;
    }

    function edgeEndpoints(orientation, parent, child) {
      if (orientation === 'horizontal') {
        return {
          x1: parent.px + NODE_W,
          y1: parent.py + NODE_H / 2,
          x2: child.px,
          y2: child.py + NODE_H / 2
        };
      }
      return {
        x1: parent.px + NODE_W / 2,
        y1: parent.py + NODE_H,
        x2: child.px + NODE_W / 2,
        y2: child.py
      };
    }

    function buildLineageForest(agents) {
      const byId = new Map();
      for (const agent of agents) {
        byId.set(agent.id, { agent, children: [], x: 0, depth: 0 });
      }
      const roots = [];
      for (const node of byId.values()) {
        const pid = node.agent.parentId;
        const parent = pid ? byId.get(pid) : undefined;
        if (parent && parent !== node) {
          parent.children.push(node);
        } else {
          roots.push(node);
        }
      }
      const byName = (a, b) =>
        (a.agent.name || '').localeCompare(b.agent.name || '') || compareIds(a.agent.id, b.agent.id);
      for (const node of byId.values()) node.children.sort(byName);
      roots.sort(byName);

      const visited = new Set();
      const visit = (node, depth) => {
        if (visited.has(node.agent.id)) return;
        visited.add(node.agent.id);
        node.depth = depth;
        node.children = node.children.filter(c => !visited.has(c.agent.id));
        for (const child of node.children) visit(child, depth + 1);
      };
      for (const root of roots) visit(root, 0);
      return roots;
    }

    function layoutForest(roots, orientation) {
      let nextLeafSlot = 0;
      const assignSlots = (node) => {
        if (collapsedIds.has(node.agent.id) || node.children.length === 0) {
          node.x = nextLeafSlot++;
          return;
        }
        for (const child of node.children) assignSlots(child);
        node.x = (node.children[0].x + node.children[node.children.length - 1].x) / 2;
      };
      for (const r of roots) {
        assignSlots(r);
        nextLeafSlot += 0.4;
      }

      const nodes = [];
      const posById = new Map();
      const collect = (node) => {
        const vx = PAD + node.x * (NODE_W + GAP_X);
        const vy = PAD + node.depth * (NODE_H + GAP_Y);
        const px = orientation === 'horizontal' ? (PAD + node.depth * (NODE_W + H_GAP_X)) : vx;
        const py = orientation === 'horizontal' ? (PAD + node.x * (NODE_H + H_GAP_Y)) : vy;
        const positioned = { agent: node.agent, px, py };
        nodes.push(positioned);
        posById.set(node.agent.id, positioned);
        if (!collapsedIds.has(node.agent.id)) {
          for (const c of node.children) collect(c);
        }
      };
      for (const r of roots) collect(r);

      const edges = [];
      for (const n of nodes) {
        const pid = n.agent.parentId;
        if (pid && posById.has(pid)) {
          const p = posById.get(pid);
          edges.push({
            ...edgeEndpoints(orientation, p, n),
            parentId: pid,
            childId: n.agent.id,
            state: n.agent.state
          });
        }
      }

      let maxX = PAD + NODE_W, maxY = PAD + NODE_H;
      for (const n of nodes) {
        maxX = Math.max(maxX, n.px + NODE_W + PAD);
        maxY = Math.max(maxY, n.py + NODE_H + PAD);
      }
      return { nodes, edges, width: maxX, height: maxY };
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function stateColor(st) {
      const s = String(st || '').toLowerCase();
      if (['scientifically_accepted', 'mechanically_validated', 'succeeded', 'pass', 'passed', 'active', 'published'].includes(s)) return '#10b981';
      if (['running', 'in_progress', 'starting', 'under_scientific_review', 'fast_path'].includes(s)) return '#38bdf8';
      if (['validation_failed', 'failed', 'scientifically_rejected', 'fail'].includes(s)) return '#f43f5e';
      if (['queued', 'committed', 'proposed', 'warn', 'pass_with_warnings'].includes(s)) return '#f59e0b';
      return '#64748b';
    }

    function applySvgTransform() {
      const vp = document.getElementById('lineage-viewport');
      if (vp) vp.setAttribute('transform', `translate(${panX},${panY}) scale(${scale})`);
    }

    function zoomGraph(factor, clientX, clientY) {
      const stage = document.getElementById('graph-stage');
      const oldScale = scale;
      const newScale = Math.max(0.25, Math.min(2.5, oldScale * factor));
      if (stage && newScale !== oldScale) {
        const rect = stage.getBoundingClientRect();
        const cx = (typeof clientX === 'number') ? (clientX - rect.left) : (rect.width / 2);
        const cy = (typeof clientY === 'number') ? (clientY - rect.top) : (rect.height / 2);
        const ratio = newScale / oldScale;
        panX = cx - (cx - panX) * ratio;
        panY = cy - (cy - panY) * ratio;
      }
      scale = newScale;
      applySvgTransform();
    }

    function fitGraphToScreen() {
      const stage = document.getElementById('graph-stage');
      const bundle = window.__PDE_BUNDLE__;
      if (!stage || !bundle) return;
      const roots = buildLineageForest(bundle.agent_system.nodes || []);
      const layout = layoutForest(roots, currentOrientation);
      const sw = stage.clientWidth || 600;
      const sh = stage.clientHeight || 360;
      const sx = sw / Math.max(layout.width, 200);
      const sy = sh / Math.max(layout.height, 200);
      scale = Math.max(0.35, Math.min(1.15, Math.min(sx, sy) * 0.92));
      panX = Math.max(12, (sw - layout.width * scale) / 2);
      panY = Math.max(12, (sh - layout.height * scale) / 2);
      applySvgTransform();
    }

    function toggleOrientation() {
      currentOrientation = currentOrientation === 'vertical' ? 'horizontal' : 'vertical';
      renderAgentGraph();
      fitGraphToScreen();
    }

    function renderAgentGraph() {
      const bundle = window.__PDE_BUNDLE__;
      const nodesData = (bundle.agent_system && bundle.agent_system.nodes) || [];
      document.getElementById('graph-node-count').textContent = `(${nodesData.length} nodes)`;

      // Render active resource leases
      const leases = (bundle.agent_system && bundle.agent_system.leases) || [];
      const leaseOverlay = document.getElementById('lease-overlay');
      if (leases.length === 0) {
        leaseOverlay.innerHTML = `<span class="lease-pill">Leases: af3 (free) · hypex-supervisor (free)</span>`;
      } else {
        leaseOverlay.innerHTML = leases.map(l =>
          `<span class="lease-pill ${l.state === 'held' ? 'held' : ''}">Lease ${escapeHtml(l.resource)}: ${escapeHtml(l.state)} (${escapeHtml(l.holder_agent || l.work_order_id || '')})</span>`
        ).join('');
      }

      const roots = buildLineageForest(nodesData);
      const layout = layoutForest(roots, currentOrientation);
      const vp = document.getElementById('lineage-viewport');
      let svgParts = [];

      // Draw cubic Bezier edges
      for (const e of layout.edges) {
        const col = stateColor(e.state);
        let d;
        if (currentOrientation === 'horizontal') {
          const mx = (e.x1 + e.x2) / 2;
          d = `M ${e.x1} ${e.y1} C ${mx} ${e.y1}, ${mx} ${e.y2}, ${e.x2} ${e.y2}`;
        } else {
          const my = (e.y1 + e.y2) / 2;
          d = `M ${e.x1} ${e.y1} C ${e.x1} ${my}, ${e.x2} ${my}, ${e.x2} ${e.y2}`;
        }
        svgParts.push(
          `<path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-opacity="0.75" />`
        );
      }

      // Draw agent cards
      for (const n of layout.nodes) {
        const a = n.agent;
        const col = stateColor(a.state);
        const isSelected = a.id === selectedNodeId;
        const strokeW = isSelected ? 2.8 : 1.5;
        const strokeCol = isSelected ? '#38bdf8' : col;
        const isRunning = ['running', 'in_progress', 'starting'].includes(String(a.state).toLowerCase());
        const titleShort = (a.name || a.id).slice(0, 23);
        const woBadge = a.work_order_id ? `${a.work_order_id}${a.revision ? '-r' + a.revision : ''}` : (a.category || 'Agent');
        const skillsCount = (a.injected_skills || []).length;

        let pulseRect = '';
        if (isRunning) {
          pulseRect = `<rect x="${n.px - 3}" y="${n.py - 3}" width="${NODE_W + 6}" height="${NODE_H + 6}" rx="10" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2" opacity="0.8"/>`;
        }

        svgParts.push(`
          <g class="agent-node-group" transform="translate(0,0)" style="cursor:pointer" onclick="selectAgentNode('${escapeHtml(a.id)}')">
            ${pulseRect}
            <rect x="${n.px}" y="${n.py}" width="${NODE_W}" height="${NODE_H}" rx="8"
                  fill="var(--bg-card)" stroke="${strokeCol}" stroke-width="${strokeW}" />
            <rect x="${n.px}" y="${n.py}" width="5" height="${NODE_H}" rx="3" fill="${col}" />
            <circle cx="${n.px + 16}" cy="${n.py + 18}" r="4.5" fill="${col}" />
            <text x="${n.px + 26}" y="${n.py + 22}" fill="var(--text-primary)" font-size="11.5" font-weight="700">${escapeHtml(titleShort)}</text>
            <text x="${n.px + 14}" y="${n.py + 41}" fill="var(--text-secondary)" font-size="10" font-family="monospace">${escapeHtml(woBadge)} · ${escapeHtml(String(a.state || 'idle'))}</text>
            <text x="${n.px + 14}" y="${n.py + 60}" fill="var(--accent-blue)" font-size="9.5">${skillsCount} skills${a.validation ? ' · 10-check ' + a.validation.result.toUpperCase() : ''}</text>
          </g>
        `);
      }

      vp.innerHTML = svgParts.join('');
      applySvgTransform();
    }

    function selectAgentNode(nodeId) {
      selectedNodeId = nodeId;
      renderAgentGraph();
      renderInspector();
      switchDockTab('inspector');
    }

    function renderInspector() {
      const bundle = window.__PDE_BUNDLE__;
      const nodes = (bundle.agent_system && bundle.agent_system.nodes) || [];
      const node = nodes.find(n => n.id === selectedNodeId) || nodes.find(n => n.work_order_id) || nodes[1] || nodes[0];
      const container = document.getElementById('dock-inspector');
      if (!node) {
        container.innerHTML = '<div style="color:var(--text-secondary)">No agent nodes available.</div>';
        return;
      }
      selectedNodeId = node.id;

      const skillsHtml = (node.injected_skills || []).map(s =>
        `<span class="skill-pill">${escapeHtml(s)}</span>`
      ).join('') || '<span style="color:var(--text-muted)">None</span>';

      const all10 = (bundle.agent_system && bundle.agent_system.all_10_checks) || [];
      const val = node.validation;
      const checkMap = {};
      if (val && Array.isArray(val.checks)) {
        val.checks.forEach(c => { checkMap[c.name] = c; });
      }

      const checksHtml = all10.map((chk, idx) => {
        const rec = checkMap[chk.name];
        const res = rec ? (rec.result || rec.status || 'skip') : 'skip';
        const cls = res === 'pass' ? 'badge-pass' : (res === 'pass_with_warnings' || res === 'warn' ? 'badge-warn' : (res === 'fail' ? 'badge-fail' : 'badge-skip'));
        const detailText = rec && rec.detail ? `<div style="font-size:10px;color:var(--text-secondary);margin-top:2px;grid-column:1 / -1;">${escapeHtml(rec.detail)}</div>` : '';
        return `
          <div class="check-row" style="flex-wrap:wrap;" title="Defect class: ${escapeHtml(chk.kind)}${rec && rec.detail ? ' — ' + escapeHtml(rec.detail) : ''}">
            <span>${idx + 1}. <code>${escapeHtml(chk.name)}</code> <span style="font-size:9.5px;color:var(--text-muted);">(${escapeHtml(chk.kind)})</span></span>
            <span class="${cls}">${escapeHtml(res.toUpperCase())}</span>
            ${detailText}
          </div>
        `;
      }).join('');

      const delivHtml = (node.deliverables || []).map(d => {
        const isFinding = d.startsWith('findings/') && d.endsWith('.md');
        const isRaw = d.startsWith('raw/');
        const clickAttr = isFinding
          ? `onclick="openFindingByPath('${escapeHtml(d)}')" style="cursor:pointer;color:var(--accent-blue);text-decoration:underline;"`
          : (isRaw ? `onclick="openArtifactByPath('${escapeHtml(d)}')" style="cursor:pointer;color:var(--accent-blue);text-decoration:underline;"` : '');
        return `<div ${clickAttr}>- <code>${escapeHtml(d)}</code></div>`;
      }).join('') || '<div style="color:var(--text-muted)">No deliverables declared</div>';

      const deps = node.dependencies || [];
      const depsHtml = deps.length > 0
        ? `<div style="font-size:11px;margin-bottom:6px;"><strong>Dependencies:</strong> ${deps.map(d => `<span class="stage-pill">${escapeHtml(d)}</span>`).join(' ')}</div>`
        : '';

      const criteria = node.acceptance_criteria || [];
      const criteriaHtml = criteria.length > 0
        ? `<div style="margin-top:6px;"><h4>Acceptance Criteria (${criteria.length})</h4><ul style="margin:2px 0 6px 16px;padding:0;font-size:11px;color:var(--text-secondary);">${criteria.map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ul></div>`
        : '';

      const failureBanner = (node.failure_class || node.failure_detail)
        ? `<div style="margin:6px 0;padding:6px 8px;border-radius:4px;background:rgba(244,63,94,0.12);border:1px solid #f43f5e;font-size:11px;color:#fda4af;">
             <strong>Failure Class:</strong> <code>${escapeHtml(node.failure_class || 'error')}</code> ${escapeHtml(node.failure_detail || '')}
           </div>`
        : '';

      const ctx = node.context_snapshot;
      let ctxHtml = '';
      if (ctx) {
        const links = ctx.artifact_links || [];
        const linksHtml = links.map(lk => {
          const p = typeof lk === 'string' ? lk : (lk.path || lk.rel_path || JSON.stringify(lk));
          const isF = String(p).startsWith('findings/');
          const isR = String(p).startsWith('raw/');
          const click = isF ? `onclick="openFindingByPath('${escapeHtml(p)}')" style="cursor:pointer;color:var(--accent-blue);"`
                            : (isR ? `onclick="openArtifactByPath('${escapeHtml(p)}')" style="cursor:pointer;color:var(--accent-blue);"` : '');
          return `<span class="skill-pill" ${click}>${escapeHtml(p)}</span>`;
        }).join(' ');
        ctxHtml = `
          <details style="margin-top:8px;padding:6px 8px;background:var(--bg-primary);border:1px solid var(--border-subtle);border-radius:6px;font-size:11px;">
            <summary style="cursor:pointer;font-weight:700;color:var(--accent-blue);">
              Dispatch Context Snapshot (<code>${escapeHtml(ctx.work_order_id || node.work_order_id)}-r${escapeHtml(ctx.revision || node.revision || 1)}</code>) · SHA-256: <code>${escapeHtml(String(ctx.hash || '').slice(0, 12))}…</code>
            </summary>
            <div style="margin-top:6px;display:flex;flex-direction:column;gap:4px;">
              <div><strong>Assembled:</strong> ${escapeHtml(ctx.assembled_at || '—')} · <strong>Full Hash:</strong> <code>${escapeHtml(ctx.hash || '—')}</code></div>
              ${links.length ? `<div><strong>Input Artifact Links (${links.length}):</strong> <div class="skill-pills" style="margin-top:2px;">${linksHtml}</div></div>` : ''}
              ${ctx.program_summary_excerpt ? `<div><strong>Program Summary Excerpt:</strong><div style="color:var(--text-secondary);margin-top:2px;white-space:pre-wrap;max-height:90px;overflow-y:auto;">${escapeHtml(ctx.program_summary_excerpt)}</div></div>` : ''}
            </div>
          </details>
        `;
      }

      container.innerHTML = `
        <div class="inspector-grid">
          <div class="inspector-card">
            <h4>Agent &amp; Work-Order Identity</h4>
            <div style="font-size:13px;font-weight:700;margin-bottom:4px;">${escapeHtml(node.name)}</div>
            <div style="color:var(--text-secondary);margin-bottom:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;">
              <span>Role: <code>${escapeHtml(node.role)}</code></span>
              <span>· State: <span class="status-pill st-${escapeHtml(node.state)}">${escapeHtml(node.state)}</span></span>
              ${node.work_order_id ? `<span>· WO: <code>${escapeHtml(node.work_order_id)}-r${escapeHtml(node.revision || 1)}</code></span>` : ''}
              ${node.run_id ? `<span>· Run: <code>${escapeHtml(node.run_id)}</code> (Attempt #${escapeHtml(node.attempt || 1)})</span>` : ''}
              ${node.correction_cycle ? `<span class="badge-warn" title="Mechanical correction loops executed">Correction Cycle: ${escapeHtml(node.correction_cycle)}</span>` : ''}
            </div>
            ${failureBanner}
            ${depsHtml}
            <div style="font-size:11.5px;margin-bottom:8px;"><strong>Decision Question:</strong> ${escapeHtml(node.decision_question || node.description || '')}</div>
            <h4>Injected Skills</h4>
            <div class="skill-pills" style="margin-bottom:8px;">${skillsHtml}</div>
            <h4>Deliverables</h4>
            <div style="font-size:11px;">${delivHtml}</div>
            ${criteriaHtml}
            ${ctxHtml}
          </div>
          <div class="inspector-card">
            <h4>10-Check Mechanical Validation Gate ${val ? `(${escapeHtml(val.result.toUpperCase())})` : '(Orchestrator / N/A)'}</h4>
            <div class="checks-grid">${checksHtml}</div>
          </div>
        </div>
      `;
    }

    function setMsgFilter(filter) {
      currentMsgFilter = filter;
      renderMessagesAndRoles();
    }

    function matchesMsgFilter(m, filter) {
      if (!filter || filter === 'all') return true;
      const t = String(m.type || '').toLowerCase();
      if (filter === 'dispatch') return t.includes('dispatch') || t.includes('work_order') || t.includes('run');
      if (filter === 'tools') return t.includes('tool_phase');
      if (filter === 'validation') return t.includes('validation') || t.includes('correction') || t.includes('accepted') || t.includes('rejected');
      if (filter === 'leases') return t.includes('lease');
      return true;
    }

    function renderMessagesAndRoles() {
      const bundle = window.__PDE_BUNDLE__;
      const messages = (bundle.agent_system && bundle.agent_system.messages) || [];
      document.getElementById('msg-count').textContent = String(messages.length);

      const msgContainer = document.getElementById('dock-messages');
      const filtered = messages.filter(m => matchesMsgFilter(m, currentMsgFilter));
      const filterBtns = [
        { id: 'all', label: `All (${messages.length})` },
        { id: 'dispatch', label: 'Dispatches & Runs' },
        { id: 'tools', label: 'Phase 1/2 Tools' },
        { id: 'validation', label: '10-Check & Retries' },
        { id: 'leases', label: 'Leases' }
      ].map(f => `<button class="mini-btn ${currentMsgFilter === f.id ? 'active' : ''}" onclick="setMsgFilter('${f.id}')">${escapeHtml(f.label)}</button>`).join(' ');

      if (messages.length === 0) {
        msgContainer.innerHTML = '<div style="color:var(--text-secondary)">No inter-agent events recorded yet.</div>';
      } else {
        msgContainer.innerHTML = `
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center;">
            <span style="font-size:11px;color:var(--text-secondary);">Filter:</span>
            ${filterBtns}
          </div>
          <div class="msg-list">
            ${filtered.slice().reverse().map(m => {
              const hasDetail = m.detail && typeof m.detail === 'object' && Object.keys(m.detail).length > 0;
              const detailHtml = hasDetail
                ? `<details style="margin-top:4px;font-size:10.5px;"><summary style="cursor:pointer;color:var(--accent-blue);">Inspect event payload</summary><pre style="margin:4px 0 0;padding:6px;background:var(--bg-primary);border-radius:4px;overflow-x:auto;">${escapeHtml(JSON.stringify(m.detail, null, 2))}</pre></details>`
                : '';
              return `
                <div class="msg-item ${escapeHtml(m.level || 'info')}">
                  <div class="msg-meta">
                    <span class="msg-route">${escapeHtml(m.sender)} → ${escapeHtml(m.recipient)}</span>
                    <span><code>${escapeHtml(m.type)}</code> · ${escapeHtml(m.timestamp || '')}</span>
                  </div>
                  <div>${escapeHtml(m.summary)}</div>
                  ${detailHtml}
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      const roles = Object.values((bundle.agent_system && bundle.agent_system.roles_catalog) || {});
      const rolesContainer = document.getElementById('dock-roles');
      rolesContainer.innerHTML = `
        <table class="data-table">
          <thead><tr><th>Role (pde-&lt;role&gt;)</th><th>Category</th><th>Assigned Skills</th></tr></thead>
          <tbody>
            ${roles.map(r => `
              <tr>
                <td><strong><code>pde-${escapeHtml(r.role)}</code></strong><br><span style="color:var(--text-secondary);font-size:11px;">${escapeHtml(r.description)}</span></td>
                <td>${escapeHtml(r.category)}</td>
                <td><div class="skill-pills">${(r.skills || []).map(s => `<span class="skill-pill">${escapeHtml(s)}</span>`).join('')}</div></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function renderRetrosAndEnv() {
      const bundle = window.__PDE_BUNDLE__;
      const retros = (bundle.agent_system && bundle.agent_system.retrospectives) || [];
      const env = (bundle.agent_system && bundle.agent_system.environment) || {};
      const retroCountEl = document.getElementById('retro-count');
      if (retroCountEl) retroCountEl.textContent = String(retros.length);

      const container = document.getElementById('dock-retros');
      if (!container) return;

      const cli = env.cli_binaries || {};
      const libs = env.python_libraries || {};
      const creds = env.api_credentials || {};

      const renderBadges = (obj) => Object.keys(obj).map(k => {
        const info = obj[k] || {};
        const ok = Boolean(info.available || info.configured);
        const cls = ok ? 'badge-pass' : 'badge-warn';
        const statusText = ok ? 'READY' : 'OPTIONAL/MISSING';
        return `<span class="check-row" style="display:inline-flex;gap:6px;padding:3px 8px;margin:2px;"><code>${escapeHtml(k)}</code> <span class="${cls}">${statusText}</span></span>`;
      }).join('');

      const retrosHtml = retros.length === 0
        ? `<div style="color:var(--text-secondary);font-size:11.5px;">No subagent retrospectives recorded in <code>retrospectives/*.md</code> yet.</div>`
        : retros.map(r => `
            <div style="background:var(--bg-primary);border:1px solid var(--border-subtle);border-radius:6px;padding:8px 10px;margin-bottom:8px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                <strong style="color:var(--accent-blue);font-size:12px;">${escapeHtml(r.title)} (<code>${escapeHtml(r.source_path)}</code>)</strong>
                <span style="font-size:10px;color:var(--text-muted);">${escapeHtml(r.updated_at || '')}</span>
              </div>
              <div style="font-size:11.5px;line-height:1.45;">${r.html}</div>
            </div>
          `).join('');

    function openArtifactByPath(relPath) {
      const bundle = window.__PDE_BUNDLE__;
      const artifacts = (bundle.science && bundle.science.artifacts) || [];
      // Match direct artifact or parent artifact if .analysis.json was cited
      let target = artifacts.find(a => a.rel_path === relPath);
      if (!target) {
        const base = relPath.replace(/\.(analysis|meta)\.json$/i, '');
        target = artifacts.find(a => a.rel_path.startsWith(base));
      }
      if (target) {
        selectedArtifactId = target.id;
        switchSciTab('studio');
        renderStudioTab();
      }

    function toggleStudioRawMode(rawMode) {
      forceRawJsonMode = Boolean(rawMode);

        mountEmbeddedViewer(window.__ACTIVE_STUDIO_ART__);

    function showProvPane(which, btnEl) {
      const art = window.__ACTIVE_STUDIO_ART__;
      if (!art) return;
      if (btnEl && btnEl.parentElement) {
        btnEl.parentElement.querySelectorAll('.mini-btn').forEach(b => b.classList.remove('active'));
        btnEl.classList.add('active');
      }
      const box = document.getElementById('prov-pane-content');
      if (!box) return;
      let payload;
      if (which === 'analysis') payload = art.analysis || { info: 'No Phase-2 .analysis.json record present for this artifact.' };
      else if (which === 'meta') payload = art.meta || { info: 'No .meta.json sidecar present for this artifact.' };
      else payload = art.data;
      box.textContent = typeof payload === 'string' ? payload : JSON.stringify(payload, null, 2);
    }

    function getArtifactById(relPath) {
      const arts = (window.__PDE_BUNDLE__.science && window.__PDE_BUNDLE__.science.artifacts) || [];
      return arts.find(a => a.rel_path === relPath);

    function mountEmbeddedViewer(art) {
      const box = document.getElementById('active-viewer-box');
      const ctrl = document.getElementById('active-viewer-controls');
      if (!box) return;
      box.innerHTML = '';
      if (ctrl) ctrl.innerHTML = '';

      const vtype = art.viewer_type;
      const studio = art.domain_studio || (vtype !== 'json' ? vtype : null);
      const data = art.data;
      const ana = art.analysis || {};

      // Render Visual Studio <-> Raw JSON toggle for any non-3D JSON studio
      if (ctrl && studio && !['structure_3d', 'docking_3d', 'sdf_3d'].includes(vtype)) {
        ctrl.innerHTML = `
          <div style="display:flex;gap:6px;align-items:center;">
            <span style="font-size:11.5px;color:var(--text-secondary);">View Mode:</span>
            <button class="mini-btn ${!forceRawJsonMode ? 'active' : ''}" onclick="toggleStudioRawMode(false)">Visual Studio (${escapeHtml(studio)})</button>
            <button class="mini-btn ${forceRawJsonMode ? 'active' : ''}" onclick="toggleStudioRawMode(true)">Raw JSON Tree</button>
          </div>
        `;
      }

      try {
        if (forceRawJsonMode) {
          renderEmbeddedJsonTree(box, data);
          return;
        }
        if (vtype === 'admet' || studio === 'admet') {
          renderEmbeddedAdmet(box, data, ana);
        } else if (vtype === 'plddt' || studio === 'plddt') {
          renderEmbeddedPlddt(box, data);
        } else if (vtype === 'pae' || studio === 'pae') {
          renderEmbeddedPae(box, data, art.name);
        } else if (vtype === 'constraint' || studio === 'constraint') {
          renderEmbeddedConstraint(box, data, art.name, ana);
        } else if (vtype === 'expression' || studio === 'expression') {
          renderEmbeddedExpression(box, data, art.name);
        } else if (vtype === 'pockets' || studio === 'pockets') {
          renderEmbeddedPockets(box, data);
        } else if (vtype === 'docking_scores' || studio === 'docking_scores') {
          renderEmbeddedDockingScores(box, data);
        } else if (vtype === 'contacts' || studio === 'contacts') {
          renderEmbeddedContacts(box, data, art.name);
        } else if (vtype === 'tournament' || studio === 'tournament') {
          renderEmbeddedTournament(box, data, ana);
        } else if (vtype === 'brics' || studio === 'brics') {
          renderEmbeddedBrics(box, data, ana);
        } else if (studio === 'pk_studio') {
          renderEmbeddedPkStudio(box, data, ana, art.name);
        } else if (studio === 'bioactivity_studio') {
          renderEmbeddedBioactivityStudio(box, data, ana, art.name);
        } else if (studio === 'tox_studio') {
          renderEmbeddedToxStudio(box, data, ana, art.name);
        } else if (studio === 'medchem_studio') {
          renderEmbeddedMedChemStudio(box, data, ana, art.name);
        } else if (studio === 'omics_studio') {
          renderEmbeddedOmicsStudio(box, data, ana, art.name);
        } else if (studio === 'competitive_studio') {
          renderEmbeddedCompetitiveStudio(box, data, ana, art.name);
        } else if (vtype === 'structure_3d') {
          renderEmbeddedStructure3D(box, ctrl, art);
        } else if (vtype === 'docking_3d') {
          renderEmbeddedDocking3D(box, ctrl, art);
        } else if (vtype === 'sdf_3d') {
          renderEmbeddedSdf3D(box, ctrl, art);
        } else {
          renderEmbeddedJsonTree(box, data);
        }
      } catch (err) {
        box.innerHTML = `<div style="color:#dc2626;padding:12px;">Viewer render error: ${escapeHtml(err.message)}</div>`;
      }

    /* --- Cross-Platform Plot Helper (Plotly.js with Built-In SVG Fallback) --- */
    function renderPlotWithFallback(container, traces, layout, config) {
      if (!container) return;
      if (typeof Plotly !== 'undefined' && typeof Plotly.newPlot === 'function') {
        try {
          Plotly.newPlot(container, traces, layout || {}, config || { responsive: true });
          return;
        } catch (e) {
          console.warn('Plotly.newPlot failed, using built-in SVG fallback:', e);
        }
      }
      renderSvgChartFallback(container, traces || [], layout || {});
    }

    function renderSvgChartFallback(container, traces, layout) {
      const trace = traces[0] || {};
      const title = (layout && layout.title && (layout.title.text || layout.title)) || '';
      const w = Math.max(container.clientWidth || 640, 480);
      const h = Math.max(parseInt(container.style.height, 10) || 340, 240);

      if (trace.type === 'scatterpolar') {
        const rArr = (trace.r || []).slice(0, -1);
        const tArr = (trace.theta || []).slice(0, -1);
        const maxR = (layout.polar && layout.polar.radialaxis && layout.polar.radialaxis.range && layout.polar.radialaxis.range[1]) || 3.4;
        const cx = w / 2, cy = h / 2 + 10, rad = Math.min(w, h) * 0.34;
        const n = Math.max(rArr.length, 1);
        const pts = rArr.map((rv, i) => {
          const ang = -Math.PI / 2 + (2 * Math.PI * i) / n;
          const dist = Math.max(0, Math.min(1, rv / maxR)) * rad;
          return [cx + dist * Math.cos(ang), cy + dist * Math.sin(ang), tArr[i] || '', rv];
        });
        const poly = pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
        const rings = [0.33, 0.66, 1.0].map(f => `<circle cx="${cx}" cy="${cy}" r="${(rad * f).toFixed(1)}" fill="none" stroke="#cbd5e1" stroke-dasharray="3,3"/>`).join('');
        const axes = pts.map((p, i) => {
          const ang = -Math.PI / 2 + (2 * Math.PI * i) / n;
          const ex = cx + rad * Math.cos(ang), ey = cy + rad * Math.sin(ang);
          const lx = cx + (rad + 26) * Math.cos(ang), ly = cy + (rad + 18) * Math.sin(ang);
          return `<line x1="${cx}" y1="${cy}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="#cbd5e1"/>
                  <text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#334155" font-weight="600">${escapeHtml(String(p[2]))}</text>`;
        }).join('');
        const dots = pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="5" fill="#2563eb" stroke="#fff" stroke-width="1.5"><title>${escapeHtml(String(p[2]))}: ${p[3]}</title></circle>`).join('');
        container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;background:#ffffff;border-radius:6px;">
          <text x="${w / 2}" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">${escapeHtml(String(title))}</text>
          ${rings}${axes}
          <polygon points="${poly}" fill="rgba(37,99,235,0.18)" stroke="#2563eb" stroke-width="2"/>
          ${dots}
        </svg>`;
        return;
      }

      if (trace.type === 'heatmap') {
        const z = Array.isArray(trace.z) && Array.isArray(trace.z[0]) ? trace.z : [[0]];
        const rows = z.length, cols = Math.max((z[0] || []).length, 1);
        const padL = 70, padR = 30, padT = 38, padB = 45;
        const pw = w - padL - padR, ph = h - padT - padB;
        const cw = pw / cols, ch = ph / rows;
        const zmax = trace.zmax || 31.75;
        let cells = '';
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const val = Number((z[r] && z[r][c]) || 0);
            const ratio = Math.max(0, Math.min(1, val / (zmax || 1)));
            const red = Math.round(20 + ratio * 200);
            const grn = Math.round(150 - ratio * 95);
            const blu = Math.round(90 - ratio * 60);
            cells += `<rect x="${(padL + c * cw).toFixed(1)}" y="${(padT + r * ch).toFixed(1)}" width="${Math.max(cw + 0.4, 1).toFixed(1)}" height="${Math.max(ch + 0.4, 1).toFixed(1)}" fill="rgb(${red},${grn},${blu})"><title>[${r + 1}, ${c + 1}]: ${val.toFixed(2)}</title></rect>`;
          }
        }
        container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;background:#ffffff;border-radius:6px;">
          <text x="${w / 2}" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">${escapeHtml(String(title))}</text>
          ${cells}
          <rect x="${padL}" y="${padT}" width="${pw}" height="${ph}" fill="none" stroke="#94a3b8"/>
        </svg>`;
        return;
      }

      if (trace.type === 'bar') {
        const isHoriz = trace.orientation === 'h';
        const labels = (isHoriz ? trace.y : trace.x) || [];
        const rawVals = (isHoriz ? trace.x : trace.y) || [];
        const vals = rawVals.map(v => Number(v) || 0);
        const colors = (trace.marker && Array.isArray(trace.marker.color)) ? trace.marker.color : null;
        const baseColor = (trace.marker && typeof trace.marker.color === 'string') ? trace.marker.color : '#2563eb';
        const padL = isHoriz ? 155 : 60, padR = 30, padT = 38, padB = 48;
        const pw = w - padL - padR, ph = h - padT - padB;
        const n = Math.max(vals.length, 1);
        const minV = Math.min(0, ...vals), maxV = Math.max(0.001, ...vals);
        const span = Math.max(Math.abs(maxV - minV), 1);

        if (isHoriz) {
          const bh = Math.max(6, (ph / n) * 0.72);
          const bars = vals.map((v, i) => {
            const y = padT + (i + 0.14) * (ph / n);
            const bw = Math.max(2, (Math.abs(v) / Math.max(Math.abs(maxV), Math.abs(minV), 1)) * pw);
            const col = colors ? (colors[i] || baseColor) : baseColor;
            return `<rect x="${padL}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${col}" rx="2"/>
                    <text x="${padL - 6}" y="${(y + bh / 2).toFixed(1)}" text-anchor="end" dominant-baseline="middle" font-size="11" fill="#334155">${escapeHtml(String(labels[i] || ''))}</text>
                    <text x="${(padL + bw + 5).toFixed(1)}" y="${(y + bh / 2).toFixed(1)}" dominant-baseline="middle" font-size="10.5" fill="#0f172a" font-weight="600">${v.toFixed(2)}</text>`;
          }).join('');
          container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;background:#ffffff;border-radius:6px;">
            <text x="${w / 2}" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">${escapeHtml(String(title))}</text>
            <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + ph}" stroke="#94a3b8"/>
            ${bars}
          </svg>`;
        } else {
          const bw = Math.max(10, (pw / n) * 0.65);
          const zeroY = maxV <= 0 ? padT : (minV >= 0 ? padT + ph : padT + (maxV / span) * ph);
          const bars = vals.map((v, i) => {
            const x = padL + (i + 0.17) * (pw / n);
            const bh = Math.max(2, (Math.abs(v) / Math.max(Math.abs(maxV), Math.abs(minV), 1)) * (ph * 0.85));
            const y = v >= 0 ? (zeroY - bh) : zeroY;
            const col = colors ? (colors[i] || baseColor) : baseColor;
            return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${col}" rx="2"/>
                    <text x="${(x + bw / 2).toFixed(1)}" y="${padT + ph + 16}" text-anchor="middle" font-size="10.5" fill="#334155">${escapeHtml(String(labels[i] || '').slice(0, 14))}</text>
                    <text x="${(x + bw / 2).toFixed(1)}" y="${(v >= 0 ? y - 5 : y + bh + 12).toFixed(1)}" text-anchor="middle" font-size="10" fill="#0f172a" font-weight="600">${v.toFixed(1)}</text>`;
          }).join('');
          container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;background:#ffffff;border-radius:6px;">
            <text x="${w / 2}" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">${escapeHtml(String(title))}</text>
            <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${padL + pw}" y2="${zeroY.toFixed(1)}" stroke="#94a3b8"/>
            ${bars}
          </svg>`;
        }
        return;
      }

      // Default line / scatter plot
      const padL = 55, padR = 25, padT = 38, padB = 42;
      const pw = w - padL - padR, ph = h - padT - padB;
      const allX = [], allY = [];
      traces.forEach(tr => {
        (tr.x || []).forEach(v => allX.push(Number(v) || 0));
        (tr.y || []).forEach(v => allY.push(Number(v) || 0));
      });
      const minX = Math.min(0, ...allX), maxX = Math.max(1, ...allX);
      const minY = (layout.yaxis && layout.yaxis.range) ? layout.yaxis.range[0] : Math.min(0, ...allY);
      const maxY = (layout.yaxis && layout.yaxis.range) ? layout.yaxis.range[1] : Math.max(100, ...allY);
      const paths = traces.map(tr => {
        const xs = tr.x || [], ys = tr.y || [];
        const col = (tr.line && tr.line.color) || '#2563eb';
        const pts = ys.map((yv, i) => {
          const xv = xs[i] !== undefined ? Number(xs[i]) : i + 1;
          const px = padL + ((xv - minX) / Math.max(maxX - minX, 1)) * pw;
          const py = padT + ph - ((Number(yv) - minY) / Math.max(maxY - minY, 1)) * ph;
          return `${px.toFixed(1)},${py.toFixed(1)}`;
        }).join(' ');
        return pts ? `<polyline fill="none" stroke="${col}" stroke-width="2" points="${pts}"/>` : '';
      }).join('');
      container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;background:#ffffff;border-radius:6px;">
        <text x="${w / 2}" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">${escapeHtml(String(title))}</text>
        <rect x="${padL}" y="${padT}" width="${pw}" height="${ph}" fill="#f8fafc" stroke="#cbd5e1"/>
        ${paths}
      </svg>`;
    }

    /* --- Viewer 1: ADMET Radar & Table (Plotly.js + SVG Fallback) --- */
    function renderEmbeddedAdmet(box, data, ana) {
      const ENDPOINTS = ['metabolic_stability', 'cyp_inhibition', 'permeability', 'herg_liability', 'solubility'];
      const LABELS = {
        metabolic_stability: 'Metabolic Stability',
        cyp_inhibition: 'CYP Inhibition Safety',
        permeability: 'Permeability (Caco-2)',
        herg_liability: 'hERG Cardiac Safety',
        solubility: 'Kinetic Solubility'
      };
      const SCORE_MAP = { acceptable: 3, pass: 3, marginal: 2, flag: 2, unacceptable: 1, fail: 1 };
      const COLOR_MAP = { acceptable: '#16a34a', pass: '#16a34a', marginal: '#d97706', flag: '#d97706', unacceptable: '#dc2626', fail: '#dc2626' };

      const epSource = (ana && ana.metrics && ana.metrics.endpoint_results)
        || (data && data.metrics && data.metrics.endpoint_results)
        || (data && data.endpoint_results)
        || {};
      const preds = (data && data.predictions) || (ana && ana.metrics && ana.metrics.predictions) || {};
      const radarAxes = (data && data.radar_axes) || (ana && ana.metrics && ana.metrics.radar_axes) || {};

      function resolveEndpoint(e) {
        if (epSource[e] !== undefined) {
          const it = epSource[e];
          if (typeof it === 'object' && it !== null) {
            return {
              status: it.status || 'acceptable',
              score: SCORE_MAP[it.status] || (typeof it.score === 'number' ? it.score : 2.5),
              display: it.value !== undefined ? String(it.value) : '—'
            };
          }
          if (typeof it === 'number') {
            return { status: it >= 2.2 ? 'acceptable' : 'marginal', score: it, display: String(it) };
          }
        }
        if (e === 'metabolic_stability') {
          const v = preds.hlm_t12_min ?? preds.metabolic_stability;
          const ax = radarAxes.metabolic_stability;
          const st = (v !== undefined && v >= 30) ? 'acceptable' : (v !== undefined ? 'marginal' : 'acceptable');
          return {
            status: st,
            score: ax !== undefined ? ax * 3.0 : (SCORE_MAP[st] || 2.5),
            display: v !== undefined ? `${v} min (HLM t1/2)` : (ax !== undefined ? `${(ax * 100).toFixed(0)}% score` : 'Acceptable')
          };
        }
        if (e === 'cyp_inhibition') {
          const v = preds.cyp3a4_ic50_um ?? preds.cyp_inhibition;
          const ax = radarAxes.cyp_safety ?? radarAxes.cyp_inhibition;
          const st = (v !== undefined && v >= 10) ? 'acceptable' : (v !== undefined ? 'marginal' : 'acceptable');
          return {
            status: st,
            score: ax !== undefined ? ax * 3.0 : (SCORE_MAP[st] || 2.5),
            display: v !== undefined ? `CYP3A4 IC50 = ${v} µM` : (ax !== undefined ? `${(ax * 100).toFixed(0)}% score` : 'Acceptable')
          };
        }
        if (e === 'permeability') {
          const v = preds.caco2_papp_1e6 ?? preds.permeability;
          const ax = radarAxes.permeability;
          const st = (v !== undefined && v >= 5) ? 'acceptable' : (v !== undefined ? 'marginal' : 'acceptable');
          return {
            status: st,
            score: ax !== undefined ? ax * 3.0 : (SCORE_MAP[st] || 2.5),
            display: v !== undefined ? `Caco-2 Papp = ${v} × 10⁻⁶ cm/s` : (ax !== undefined ? `${(ax * 100).toFixed(0)}% score` : 'Acceptable')
          };
        }
        if (e === 'herg_liability') {
          const v = preds.herg_ic50_um ?? preds.herg_liability;
          const ax = radarAxes.herg_safety ?? radarAxes.herg_liability;
          const st = (v !== undefined && v >= 30) ? 'acceptable' : (v !== undefined && v >= 10 ? 'marginal' : 'acceptable');
          return {
            status: st,
            score: ax !== undefined ? ax * 3.0 : (SCORE_MAP[st] || 2.5),
            display: v !== undefined ? `hERG IC50 = ${v} µM` : (ax !== undefined ? `${(ax * 100).toFixed(0)}% score` : 'Acceptable')
          };
        }
        if (e === 'solubility') {
          const v = preds.kinetic_solubility_um ?? preds.solubility;
          const ax = radarAxes.solubility;
          const st = (v !== undefined && v >= 50) ? 'acceptable' : (v !== undefined ? 'marginal' : 'acceptable');
          return {
            status: st,
            score: ax !== undefined ? ax * 3.0 : (SCORE_MAP[st] || 2.5),
            display: v !== undefined ? `${v} µM (pH 7.4)` : (ax !== undefined ? `${(ax * 100).toFixed(0)}% score` : 'Acceptable')
          };
        }
        return { status: 'acceptable', score: 2.5, display: '—' };
      }

      const resolved = ENDPOINTS.map(e => ({ key: e, label: LABELS[e], ...resolveEndpoint(e) }));
      if (preds.oral_bioavailability_pct !== undefined) {
        resolved.push({
          key: 'oral_f',
          label: 'Predicted Oral Bioavailability (%F)',
          status: preds.oral_bioavailability_pct >= 30 ? 'acceptable' : 'marginal',
          score: Math.min(3.0, (preds.oral_bioavailability_pct / 100) * 3.5),
          display: `${preds.oral_bioavailability_pct}%`
        });
      }

      const plotDiv = document.createElement('div');
      plotDiv.style.height = '340px';
      const tblDiv = document.createElement('div');
      box.appendChild(plotDiv);
      box.appendChild(tblDiv);

      const radarItems = resolved.slice(0, 5);
      const theta = radarItems.map(r => r.label);
      const rVals = radarItems.map(r => r.score);
      const colors = radarItems.map(r => COLOR_MAP[r.status] || '#3b82f6');

      renderPlotWithFallback(plotDiv, [{
        type: 'scatterpolar',
        r: rVals.concat([rVals[0]]),
        theta: theta.concat([theta[0]]),
        fill: 'toself',
        fillcolor: 'rgba(59, 130, 246, 0.15)',
        line: { color: '#2563eb', width: 2 },
        marker: { size: 9, color: colors.concat([colors[0]]) }
      }], {
        title: { text: 'ADMET Multipartite Endpoint Profile — ' + ((data && data.compound_id) || 'Lead'), font: { size: 14 } },
        polar: {
          radialaxis: { visible: true, range: [0, 3.4], tickvals: [1, 2, 3], ticktext: ['Unacceptable (1)', 'Marginal (2)', 'Acceptable (3)'] }
        },
        margin: { t: 40, b: 30, l: 60, r: 60 },
        showlegend: false
      }, { responsive: true });

      tblDiv.innerHTML = `<table class="data-table" style="color:#0f172a;margin-top:8px;">
        <thead><tr><th>ADMET Endpoint</th><th>Status</th><th>Value / Metric</th></tr></thead>
        <tbody>
          ${resolved.map(r => `<tr>
            <td><strong>${escapeHtml(r.label)}</strong></td>
            <td style="color:${COLOR_MAP[r.status] || '#0f172a'};font-weight:700;">${escapeHtml(r.status.toUpperCase())}</td>
            <td><strong>${escapeHtml(r.display)}</strong></td>
          </tr>`).join('')}
        </tbody>
      </table>`;
    }

    /* --- Viewer 2: Per-Residue pLDDT Confidence (Plotly.js + SVG Fallback) --- */
    function renderEmbeddedPlddt(box, data) {
      const plotDiv = document.createElement('div');
      plotDiv.style.height = '400px';
      box.appendChild(plotDiv);

      const CHAIN_COLORS = ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd'];
      let traces = [];
      let totalRes = 0;

      if (Array.isArray(data)) {
        totalRes = data.length;
        traces.push({ x: data.map((_, i) => i + 1), y: data, type: 'scatter', mode: 'lines', name: 'pLDDT', line: { color: '#0f172a', width: 1.8 } });
      } else if (data && data.residue_plddt) {
        if (Array.isArray(data.residue_plddt)) {
          totalRes = data.residue_plddt.length;
          traces.push({ x: data.residue_plddt.map((_, i) => i + 1), y: data.residue_plddt, type: 'scatter', mode: 'lines', name: 'pLDDT', line: { color: '#0f172a', width: 1.8 } });
        } else {
          let offset = 0;
          Object.keys(data.residue_plddt).forEach((ch, ci) => {
            const arr = data.residue_plddt[ch] || [];
            totalRes += arr.length;
            traces.push({
              x: arr.map((_, i) => i + 1 + offset),
              y: arr,
              type: 'scatter',
              mode: 'lines',
              name: 'Chain ' + ch,
              line: { color: CHAIN_COLORS[ci % CHAIN_COLORS.length], width: 1.8 }
            });
            offset += arr.length;
          });
        }
      } else {
        const arr = (data && (data.plddt || data.confidenceScore || data.atom_plddt)) || [];
        totalRes = arr.length;
        traces.push({ x: arr.map((_, i) => i + 1), y: arr, type: 'scatter', mode: 'lines', name: 'pLDDT', line: { color: '#0f172a', width: 1.8 } });
      }

      const shapes = [
        { type: 'rect', y0: 90, y1: 100, x0: 0, x1: totalRes + 1, fillcolor: 'rgba(0,83,214,0.15)', line: { width: 0 }, layer: 'below' },
        { type: 'rect', y0: 70, y1: 90, x0: 0, x1: totalRes + 1, fillcolor: 'rgba(101,203,243,0.15)', line: { width: 0 }, layer: 'below' },
        { type: 'rect', y0: 50, y1: 70, x0: 0, x1: totalRes + 1, fillcolor: 'rgba(255,219,19,0.15)', line: { width: 0 }, layer: 'below' },
        { type: 'rect', y0: 0, y1: 50, x0: 0, x1: totalRes + 1, fillcolor: 'rgba(255,125,69,0.15)', line: { width: 0 }, layer: 'below' }
      ];

      renderPlotWithFallback(plotDiv, traces, {
        title: { text: 'Per-Residue AlphaFold pLDDT Confidence' },
        xaxis: { title: 'Residue Number', range: [0, totalRes + 1] },
        yaxis: { title: 'pLDDT (0–100)', range: [0, 100] },
        shapes: shapes,
        margin: { t: 45, l: 55, r: 25, b: 45 }
      }, { responsive: true });
    }

    /* --- Viewer 3: PAE 2D Heatmap (Plotly.js + SVG Fallback) --- */
    function renderEmbeddedPae(box, paeData, name) {
      const plotDiv = document.createElement('div');
      plotDiv.style.height = '410px';
      box.appendChild(plotDiv);

      let matrix = null, maxPAE = 31.75;
      if (Array.isArray(paeData) && paeData.length > 0) {
        if (Array.isArray(paeData[0])) matrix = paeData;
        else if (paeData[0] && paeData[0].predicted_aligned_error) {
          matrix = paeData[0].predicted_aligned_error;
          maxPAE = paeData[0].max_predicted_aligned_error || paeData[0].max_pae || 31.75;
        }
      } else if (paeData && paeData.predicted_aligned_error) {
        matrix = paeData.predicted_aligned_error;
        maxPAE = paeData.max_predicted_aligned_error || paeData.max_pae || 31.75;
      }

      const colorscale = [
        [0, '#00441b'], [0.2, '#41ae76'], [0.4, '#99d8c9'],
        [0.6, '#e5f5e0'], [0.8, '#fdbb84'], [1, '#b30000']
      ];
      renderPlotWithFallback(plotDiv, [{
        z: matrix || [[0]],
        type: 'heatmap',
        colorscale: colorscale,
        zmin: 0,
        zmax: maxPAE,
        colorbar: { title: 'PAE (Å)' }
      }], {
        title: { text: 'Predicted Aligned Error (PAE) — ' + name },
        xaxis: { title: 'Scored Residue' },
        yaxis: { title: 'Aligned Residue', autorange: 'reversed' },
        margin: { t: 45, l: 60, r: 40, b: 45 }
      }, { responsive: true });
    }

    /* --- Viewer 4: gnomAD Genetic Constraint & OpenTargets/ClinVar Studio --- */
    function renderEmbeddedConstraint(box, data, filename, ana) {
      const geneObj = (data && data.data && data.data.gene && typeof data.data.gene === 'object')
        ? data.data.gene
        : ((data && data.gene && typeof data.gene === 'object') ? data.gene : (data || {}));
      const c = geneObj.gnomad_constraint
        || (data && data.constraint)
        || (ana && ana.metrics && ana.metrics.constraint)
        || geneObj
        || {};
      const sym = (data && typeof data.gene === 'string' ? data.gene : null)
        || geneObj.symbol
        || (data && data.target)
        || filename.replace(/\.(gnomad-constraint|json)$/i, '');
      const items = [
        { k: 'pLI', label: 'pLI (LoF Intolerance)', v: c.pLI ?? (ana && ana.metrics && ana.metrics.pLI), desc: 'Constrained > 0.9' },
        { k: 'LOEUF', label: 'LOEUF Upper Bound', v: c.oe_lof_upper ?? c.loeuf ?? (ana && ana.metrics && ana.metrics.loeuf), desc: 'Constrained < 0.35' },
        { k: 'oe_lof', label: 'o/e Loss-of-Function', v: c.oe_lof ?? c.oe_lof_upper ?? c.loeuf, desc: 'Observed / Expected LoF' },
        { k: 'oe_mis', label: 'o/e Missense', v: c.oe_mis, desc: 'Observed / Expected Missense' },
        { k: 'mis_z', label: 'Missense Z-Score', v: c.mis_z, desc: 'Significant > 3.09' },
        { k: 'syn_z', label: 'Synonymous Z-Score', v: c.syn_z ?? c.lof_z, desc: 'Baseline Z-Score' }
      ];

      const associations = (data && (data.disease_associations || data.associations))
        || (geneObj && geneObj.disease_associations)
        || (ana && ana.metrics && ana.metrics.disease_associations)
        || [];

      const clinvar = (data && (data.clinvar_summary || data.clinical_variants))
        || (geneObj && geneObj.clinvar_summary)
        || null;

      let assocHtml = '';
      if (Array.isArray(associations) && associations.length > 0) {
        assocHtml = `
          <div style="margin-top:16px;">
            <h4 style="margin:0 0 8px;color:#0f172a;">OpenTargets &amp; GWAS Disease Associations (${associations.length})</h4>
            <div id="constraint-assoc-plot" style="height:260px;"></div>
            <table class="data-table" style="color:#0f172a;margin-top:8px;">
              <thead><tr><th>Disease / Indication</th><th>EFO / ID</th><th>Overall Score</th><th>Genetic Assoc.</th><th>Somatic / Literature</th></tr></thead>
              <tbody>
                ${associations.map(a => {
                  const sc = typeof a.score === 'number' ? a.score : (typeof a.overall_score === 'number' ? a.overall_score : 0);
                  const ga = a.genetic_association_score ?? a.gwas_score ?? '—';
                  const som = a.somatic_mutation_score ?? a.literature_score ?? '—';
                  return `<tr>
                    <td><strong>${escapeHtml(a.disease_name || a.disease || a.name || 'Indication')}</strong></td>
                    <td><code>${escapeHtml(a.disease_id || a.efo_id || '—')}</code></td>
                    <td><strong style="color:${sc >= 0.7 ? '#16a34a' : '#2563eb'};">${sc ? sc.toFixed(3) : '—'}</strong></td>
                    <td>${typeof ga === 'number' ? ga.toFixed(3) : escapeHtml(String(ga))}</td>
                    <td>${typeof som === 'number' ? som.toFixed(3) : escapeHtml(String(som))}</td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      let clinvarHtml = '';
      if (clinvar && typeof clinvar === 'object') {
        const entries = Array.isArray(clinvar) ? clinvar : Object.entries(clinvar).map(([k, v]) => ({ label: k, value: v }));
        clinvarHtml = `
          <div style="margin-top:14px;">
            <h4 style="margin:0 0 6px;color:#0f172a;">ClinVar Pathogenicity &amp; Variant Summary</h4>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              ${entries.map(e => `<div style="border:1px solid #cbd5e1;border-radius:6px;padding:8px 12px;background:#f8fafc;color:#0f172a;">
                <span style="font-size:11px;color:#64748b;">${escapeHtml(e.label || e.variant || e.significance || 'Metric')}:</span>
                <strong style="margin-left:4px;">${escapeHtml(typeof e.value === 'object' ? JSON.stringify(e.value) : String(e.value ?? e.count ?? ''))}</strong>
              </div>`).join('')}
            </div>
          </div>
        `;
      }

      box.innerHTML = `
        <div style="padding:10px;">
          <h3 style="margin:0 0 12px;color:#0f172a;">gnomAD Constraint &amp; Target Genetic Evidence — ${escapeHtml(sym)}</h3>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;">
            ${items.map(m => {

    /* --- Viewer 5: Tissue Expression Bar Chart (Plotly.js + SVG Fallback) --- */
    function renderEmbeddedExpression(box, jsonData, filename) {

    /* --- Cross-Platform 3D Molecular Engine (3Dmol.js WebGL + Interactive HTML5 Canvas2D Software 3D Fallback) --- */
    function canUseWebGL() {
      if (window.__FORCE_CANVAS_3D__) return false;
      if (typeof $3Dmol === 'undefined' || typeof $3Dmol.createViewer !== 'function') return false;
      try {
        const c = document.createElement('canvas');
