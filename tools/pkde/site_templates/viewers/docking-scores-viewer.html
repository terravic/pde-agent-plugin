<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none';">
  <title>Docking Scores Viewer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; color: #1a1a1a; }
    .error { color: #c0392b; padding: 1rem; background: #fdf2f0; border-radius: 4px; }
    .filename { color: #555; font-size: 0.9rem; margin-bottom: 1rem; }
    h1 { color: #2c3e50; font-size: 1.3rem; }
    #viewer-container { width: 100%; }
    .legend { margin-top: 0.75rem; font-size: 0.85rem; color: #555; display: flex; gap: 1.5rem; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 0.4rem; }
    .legend-swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
      button:focus-visible, a:focus-visible, select:focus-visible, [tabindex="0"]:focus-visible { outline: 2px solid #1B5E8A; outline-offset: 2px; }
  </style>
  <script>
    /* Offline zero-CDN Plotly fallback renderer (inline SVG / tabular summary) */
    window.Plotly = window.Plotly || {
      newPlot: function(target, traces, layout) {
        var el = typeof target === 'string' ? document.getElementById(target) : target;
        if (!el) return;
        function _esc(s) {
          return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
        var t0 = (traces && traces[0]) || {};
        var title = (layout && layout.title && (typeof layout.title === 'string' ? layout.title : layout.title.text)) || 'Data Plot';
        if (t0.type === 'bar' && Array.isArray(t0.x) && Array.isArray(t0.y)) {
          var isH = t0.orientation === 'h';
          var labels = isH ? t0.y : t0.x;
          var vals = isH ? t0.x : t0.y;
          var maxV = Math.max.apply(null, vals.map(function(v){ return Math.abs(Number(v) || 0); }).concat([1]));
          var rows = labels.map(function(lbl, idx) {
            var v = Number(vals[idx]) || 0;
            var pct = Math.min(100, Math.round((Math.abs(v) / maxV) * 100));
            return '<tr><td style="padding:4px 8px;border-bottom:1px solid #e2e8f0;">' + _esc(lbl) +
              '</td><td style="padding:4px 8px;border-bottom:1px solid #e2e8f0;width:55%;">' +
              '<div style="background:#0D9488;height:12px;border-radius:3px;width:' + pct + '%;"></div></td>' +
              '<td style="padding:4px 8px;border-bottom:1px solid #e2e8f0;font-family:monospace;text-align:right;">' + _esc(v.toFixed(2)) + '</td></tr>';
          }).join('');
          el.innerHTML = '<div style="border:1px solid #e2e8f0;border-radius:6px;padding:12px;">' +
            '<div style="font-weight:600;margin-bottom:8px;">' + _esc(title) + '</div>' +
            '<table style="width:100%;border-collapse:collapse;font-size:12px;">' + rows + '</table></div>';
          return;
        }
        if (t0.type === 'scatterpolar' && Array.isArray(t0.r) && Array.isArray(t0.theta)) {
          var items = t0.theta.slice(0, Math.max(0, t0.theta.length - 1));
          var rVals = t0.r.slice(0, items.length);
          var pRows = items.map(function(th, i) {
            return '<tr><td style="padding:4px 8px;border-bottom:1px solid #e2e8f0;">' + _esc(th) +
              '</td><td style="padding:4px 8px;border-bottom:1px solid #e2e8f0;font-family:monospace;">' + _esc(rVals[i]) + '</td></tr>';
          }).join('');
          el.innerHTML = '<div style="border:1px solid #e2e8f0;border-radius:6px;padding:12px;">' +
            '<div style="font-weight:600;margin-bottom:8px;">' + _esc(title) + '</div>' +
            '<table style="width:100%;border-collapse:collapse;font-size:12px;"><thead><tr><th style="text-align:left;padding:4px 8px;">Endpoint</th><th style="text-align:left;padding:4px 8px;">Score</th></tr></thead><tbody>' + pRows + '</tbody></table></div>';
          return;
        }
        if (t0.type === 'heatmap' && Array.isArray(t0.z)) {
          var nRows = t0.z.length;
          var nCols = (t0.z[0] && t0.z[0].length) || 0;
          var flat = [];
          t0.z.forEach(function(row){ if (Array.isArray(row)) row.forEach(function(v){ if (typeof v === 'number' && !isNaN(v)) flat.push(v); }); });
          var minVal = flat.length ? Math.min.apply(null, flat).toFixed(2) : '--';
          var maxVal = flat.length ? Math.max.apply(null, flat).toFixed(2) : '--';
          el.innerHTML = '<div style="border:1px solid #e2e8f0;border-radius:6px;padding:12px;font-size:13px;">' +
            '<div style="font-weight:600;margin-bottom:6px;">' + _esc(title) + '</div>' +
            '<div style="color:#475569;font-family:monospace;">Matrix: ' + nRows + ' x ' + nCols + ' | Min: ' + _esc(minVal) + ' | Max: ' + _esc(maxVal) + '</div></div>';
          return;
        }
        if (Array.isArray(t0.y) && t0.y.length > 0) {
          var ys = t0.y.map(Number).filter(function(v){ return !isNaN(v); });
          var yMin = Math.min.apply(null, ys), yMax = Math.max.apply(null, ys);
          var span = (yMax - yMin) || 1;
          var step = Math.max(1, Math.floor(ys.length / 240));
          var pts = [];
          for (var i = 0; i < ys.length; i += step) {
            var px = (40 + (i / Math.max(1, ys.length - 1)) * 540).toFixed(1);
            var py = (180 - ((ys[i] - yMin) / span) * 140).toFixed(1);
            pts.push(px + ',' + py);
          }
          el.innerHTML = '<div style="border:1px solid #e2e8f0;border-radius:6px;padding:12px;">' +
            '<div style="font-weight:600;margin-bottom:6px;">' + _esc(title) + ' (' + ys.length + ' points)</div>' +
            '<svg viewBox="0 0 600 210" style="width:100%;max-height:240px;" role="img" aria-label="' + _esc(title) + '">' +
            '<polyline fill="none" stroke="#0D9488" stroke-width="2" points="' + pts.join(' ') + '" /></svg></div>';
          return;
        }
        el.textContent = title + ' (offline tabular view)';
      }
    };
  </script>
</head>
<body>
  <h1>Docking Scores</h1>
  <div class="filename" id="filename"></div>
  <div id="viewer-container"></div>
  <div class="legend">
    <div class="legend-item">
      <span class="legend-swatch" style="background:#16a34a"></span>
      <span>Strong (&lt; -8.0 kcal/mol)</span>
    </div>
    <div class="legend-item">
      <span class="legend-swatch" style="background:#3b82f6"></span>
      <span>Moderate (-8.0 to -6.0 kcal/mol)</span>
    </div>
    <div class="legend-item">
      <span class="legend-swatch" style="background:#94a3b8"></span>
      <span>Weak (&gt; -6.0 kcal/mol)</span>
    </div>
  </div>
  <div id="error" class="error" style="display:none"></div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var filePath = params.get('file');

    function showError(msg) {
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').textContent = msg;
    }

    function isSafeRelativeFile(p) {
      if (!p || typeof p !== 'string') return false;
      var trimmed = p.trim();
      if (!trimmed || /^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(trimmed)) return false;
      try {
        var resolved = new URL(trimmed, window.location.href);
        return resolved.origin === window.location.origin && resolved.protocol === window.location.protocol;
      } catch (e) {
        return false;
      }
    }

    /* Score banding: semantic colors for docking score ranges */
    function bandColor(score) {
      if (score < -8.0) return '#16a34a';  /* Strong: green */
      if (score < -6.0) return '#3b82f6';  /* Moderate: blue */
      return '#94a3b8';                     /* Weak: gray */
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#x27;');
    }

    if (!filePath) {
      showError('No file specified. Use ?file=path/to/file.docking_result.json');
    } else if (!isSafeRelativeFile(filePath)) {
      showError('Invalid file path: only relative same-origin paths are allowed.');
    } else {
      document.getElementById('filename').textContent = filePath.split('/').pop();

      fetch(filePath)
        .then(function(r) {
          if (!r.ok) throw new Error('HTTP ' + r.status + ': ' + r.statusText);
          return r.json();
        })
        .then(function(jsonData) {
          /* Support formats:
             - Array of pose objects {pose_id/mode, affinity, rmsd_lb?, rmsd_ub?}
             - {poses: [...]} or {results: [...]} wrapper
             - Autodock Vina output style */
          var poses = [];

          if (Array.isArray(jsonData)) {
            poses = jsonData;
          } else if (jsonData.poses && Array.isArray(jsonData.poses)) {
            poses = jsonData.poses;
          } else if (jsonData.results && Array.isArray(jsonData.results)) {
            poses = jsonData.results;
          } else if (jsonData.modes && Array.isArray(jsonData.modes)) {
            poses = jsonData.modes;
          } else {
            throw new Error('Unrecognised docking result format');
          }

          if (poses.length === 0) {
            throw new Error('No docking poses found in file');
          }

          /* Extract fields */
          var labels = poses.map(function(p, i) {
            return escapeHtml(p.pose_id || p.id || p.mode || ('Pose ' + (i + 1)));
          });
          var affinities = poses.map(function(p) {
            var a = p.affinity || p.binding_affinity || p.score || p.energy || 0;
            return typeof a === 'number' ? a : parseFloat(a) || 0;
          });

          /* Sort by affinity (most negative = best) */
          var indices = affinities.map(function(_, i) { return i; });
          indices.sort(function(a, b) { return affinities[a] - affinities[b]; });

          var sortedLabels = indices.map(function(i) { return String(labels[i]); });
          var sortedAffinities = indices.map(function(i) { return affinities[i]; });

          /* Apply score banding colors */
          var barColors = sortedAffinities.map(function(a) {
            return bandColor(a);
          });

          var traces = [{
            x: sortedLabels,
            y: sortedAffinities,
            type: 'bar',
            name: 'Binding Affinity',
            marker: { color: barColors },
            text: sortedAffinities.map(function(a) { return a.toFixed(2); }),
            textposition: 'outside',
            textfont: { size: 10 },
            hovertemplate: '%{x}<br>Affinity: %{y:.2f} kcal/mol<extra></extra>'
          }];

          /* If RMSD data available, add scatter overlay on secondary axis */
          var hasRmsd = poses.some(function(p) {
            return p.rmsd_lb !== undefined || p.rmsd !== undefined;
          });

          if (hasRmsd) {
            var sortedRmsd = indices.map(function(i) {
              return poses[i].rmsd_lb || poses[i].rmsd || poses[i].rmsd_ub || null;
            });

            traces.push({
              x: sortedLabels,
              y: sortedRmsd,
              type: 'scatter',
              mode: 'markers+lines',
              name: 'RMSD',
              yaxis: 'y2',
              marker: { color: '#e67e22', size: 8 },
              line: { color: '#e67e22', dash: 'dot' },
              hovertemplate: '%{x}<br>RMSD: %{y:.2f}<extra></extra>'
            });
          }

          var layout = {
            title: { text: 'Docking Scores by Pose' },
            xaxis: { title: { text: 'Pose' }, type: 'category' },
            yaxis: { title: { text: 'Binding Affinity (kcal/mol)' } },
            margin: { t: 50, l: 70, r: 80, b: 50 },
            /* Threshold reference lines */
            shapes: [
              {
                type: 'line',
                xref: 'paper',
                x0: 0,
                x1: 1,
                yref: 'y',
                y0: -8.0,
                y1: -8.0,
                line: { color: '#16a34a', width: 2, dash: 'dash' }
              },
              {
                type: 'line',
                xref: 'paper',
                x0: 0,
                x1: 1,
                yref: 'y',
                y0: -6.0,
                y1: -6.0,
                line: { color: '#d97706', width: 2, dash: 'dash' }
              }
            ],
            /* Threshold annotations */
            annotations: [
              {
                xref: 'paper',
                yref: 'y',
                x: 1.0,
                y: -8.0,
                xanchor: 'left',
                text: ' Strong',
                showarrow: false,
                font: { size: 11, color: '#16a34a' }
              },
              {
                xref: 'paper',
                yref: 'y',
                x: 1.0,
                y: -6.0,
                xanchor: 'left',
                text: ' Moderate',
                showarrow: false,
                font: { size: 11, color: '#d97706' }
              }
            ]
          };

          if (hasRmsd) {
            layout.yaxis2 = {
              title: { text: 'RMSD' },
              overlaying: 'y',
              side: 'right'
            };
            layout.legend = { x: 0.02, y: 0.98 };
          }

          Plotly.newPlot('viewer-container', traces, layout, { responsive: true });
        })
        .catch(function(err) { showError('Failed to load file: ' + err.message); });
    }
  </script>
</body>
</html>
